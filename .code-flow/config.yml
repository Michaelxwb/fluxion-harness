version: 1

spec_workflow:
    schema_version: 1
    enforcement: required  # required=全门禁 | warn=门禁仅记录不阻断 | inject=只注入不门禁
    drift_check: true
    scope_expansion_check: true
    metrics: true
    catalog:
        dedup_window: 5

budget:
    # 2026-10-29 二次收口：harness-test 已拆成 test（1.86k）+ e2e（1.13k）；最大单文件
    # api/arch ≈2.46k、im ≈2.1k。l1_max 是**一次编辑命中规范总和**的上限（router 取
    # min(total, l1_max)），实测最坏组合前端 ui+frontend+ui-detail ≈5.2k，故设 6000；
    # 目标是单文件继续变胖就拆域，而不是抬预算。
    total: 7500
    # 2026-10-29：L0 已做过一轮去重（验收细节下沉 harness-test、删历史叙事），剩 1077 tokens
    # 全是常驻行为契约（核心原则/禁止项/工作流/收尾纪律），没有可再删的口号。800 是通用默认，
    # 这里按实测内容显式放宽到 1100，而不是为了数字好看去砍规则。
    l0_max: 1100
    l1_max: 6000
    map_max: 400
    # catalog 模式下 spec 目录的 token 上限（超出按 Tier1 优先截断并告警）。
    # 2026-10-29：现有 22 个域、描述压缩到「域 + 3~5 个关键词」后仍需约 300 tokens；
    # 200 只能列出 15 个域，等于按预算盲切路由面。域数量本身就是导航信息，这里放到 320。
    catalog_max: 320

# 质量闭环（v0.5）：合规反馈 + 学习采集。
# enabled 仅 literal true 启用（缺失即关闭，升级用户行为不变）；
# 子开关缺省跟随 enabled，仅 literal false 单独关闭。
# 数据仅存本地 .code-flow/（.session-log.jsonl / .check-state.json）。
quality_loop:
    enabled: true
    post_check: true            # PostToolUse 违规反馈（只提示不阻断）
    stop_check: true            # Stop 收尾按 validation.yml 校验
    finish_check: true          # 任务 finish 时执行 validation.yml（heavy 由 verify-e2e/archive 执行）
    correction_capture: true    # 纠正句式采集（喂 cf-learn 候选）
    # 注入时对 spec 内容做保守无损压缩（去行尾空白、折叠多空行、剥 HTML 注释、去重 bullet）
    # 缺省视为 true；仅显式 false 关闭
    compress: true
    compress_reminder: true     # 会话过长每 N 轮提醒 /compact（per-session 计数，缺省 true）
    code_extensions:
        - ".py"
        - ".ts"
        - ".tsx"
        - ".js"
        - ".jsx"
        - ".go"
        - ".java"
        - ".rs"
        - ".rb"
        - ".vue"
        - ".svelte"
    skip_extensions:
        - ".md"
        - ".txt"
        - ".json"
        - ".yml"
        - ".yaml"
        - ".toml"
        - ".lock"
        - ".csv"
        - ".xml"
        - ".svg"
        - ".png"
        - ".jpg"
        - ".jpeg"
        - ".gif"
        - ".ico"
        - ".pdf"
        - ".zip"
        - ".gz"
        - ".tar"
    skip_paths:
        - "docs/**"
        - "*.config.*"
        - ".code-flow/**"
        - ".claude/**"
        - ".codex/**"
        - ".costrict/**"
        - ".opencode/**"
        - "node_modules/**"
        - "dist/**"
        - "build/**"
        - "out/**"
        - "coverage/**"
        - ".next/**"
        - ".cache/**"
        - ".venv/**"
        - "venv/**"
        - "__pycache__/**"
        - ".git/**"

path_mapping:
    memory:
        patterns:
            - "packages/contracts/src/muad_contracts/memory.py"
            - "packages/agent-core/src/muad_agent_core/memory/**"
            - "apps/agent-runtime/src/muad_agent_runtime/application/memory/**"
            - "apps/agent-runtime/src/muad_agent_runtime/application/memory_*.py"
            - "apps/agent-runtime/src/muad_agent_runtime/infrastructure/repositories/memory*.py"
            - "apps/agent-runtime/src/muad_agent_runtime/api/memory*.py"
            - "apps/console-platform/backend/src/muad_console_platform/application/memory*.py"
            - "apps/console-platform/backend/src/muad_console_platform/infrastructure/repositories/memory*.py"
            - "migrations/versions/0020_memory_redesign.py"
            - "tests/**/test_memory_redesign*.py"
            - "tests/test_memory_redesign*.py"
            - "e2e/tests/agent-management/memory-redesign.spec.ts"
        specs:
            - path: "memory/harness-memory.md"
              tags: ["memory", "confirmation", "quota", "consolidation"]
              tier: 1
    shared:
        # 共享模板供 cf-task:align / cf-task:prd 命令显式 Read 使用，
        # 不是约束规范，禁止通配符自动注入。
        # 仅 _map.md 保持 "*" 作为 Tier 0 导航。
        specs:
            - path: "shared/_map.md"
              tags: ["*"]
              tier: 0
            - path: "shared/scenarios-template.md"
              tags: []          # 永不自动注入，仅 align/plan 显式读取
              tier: 1
            - path: "shared/prd-template.md"
              tags: []          # 永不自动注入，仅 cf-task:prd 命令显式 Read
              tier: 1
            - path: "shared/design/design-lite.md"
              tags: []          # 永不自动注入，仅 cf-task:align 命令显式 Read
              tier: 1
            - path: "shared/design/design-full.md"
              tags: []          # 永不自动注入，仅 cf-task:align 命令显式 Read
              tier: 1
            - path: "shared/design/design-frontend.md"
              tags: []          # 永不自动注入，仅 cf-task:align 命令显式 Read（前端设计模板）
              tier: 1
    arch:
        patterns:
            - "deploy/**"
        specs:
            - path: "arch/harness-arch.md"
              tags:
              - "arch"
              - "deploy"
              - "stateless"
              - "runtime-pool"
              tier: 1
    secret:
        patterns:
            - "packages/api-kit/**"
            - "packages/platform-sdk/**"
            - "packages/logging-kit/**"
            - "**/security*.py"
            - "**/credential*/**"
            - "**/*redact*"
        specs:
            - path: "secret/harness-secret.md"
              tags:
              - "secret"
              - "credential"
              - "redaction"
              - "secret-ref"
              tier: 1
    time:
        patterns:
            - "**/models/**"
            - "**/*scheduler*"
            - "**/*schedule*"
            - "**/DateTimeText*"
        specs:
            - path: "time/harness-time.md"
              tags:
              - "time"
              - "timezone"
              - "timestamptz"
              - "cron"
              tier: 1
    logging:
        patterns:
            - "packages/logging-kit/**"
        specs:
            - path: "logging/harness-log.md"
              tags:
              - "log"
              - "logging"
              - "trace"
              - "redaction"
              tier: 1
    artifact:
        patterns:
            - "packages/artifact-store/**"
            - "packages/skill-sdk/**"
            # Skill **执行**面（子进程启用/进程组回收/stdout 结果解析）也在本 spec 的约束里，
            # 但原先没有任何 pattern 指向它 ⇒ 改 executor.py 时一条规范都不注入。
            # 只收 `**/skill/**` 这 3 个文件，不用 `packages/agent-core/**` 那种过宽的写法。
            - "packages/agent-core/**/skill/**"
        specs:
            - path: "artifact/harness-skill.md"
              tags:
              - "artifact"
              - "skill"
              - "cache"
              - "checksum"
              - "nfs"
              tier: 1
    persistence:
        # 表设计规范只随**schema 载体**注入：迁移与 ORM 模型。
        # 不列 `**/repositories/**` —— 仓库层是查询代码，只读查询模块（如 11 的
        # `audit_query_repository`、12 的 `overview_query_repository`）会被绑上
        # 表设计规则并触发无意义的 scope pause；schema 变更必然落在 migrations/models。
        patterns:
            - "migrations/**"
            - "**/models/**"
        specs:
            - path: "persistence/harness-data.md"
              tags:
              - "database"
              - "schema"
              - "migration"
              - "orm"
              - "index"
              tier: 1
    api:
        patterns:
            - "packages/api-kit/**"
            - "apps/**/api/**"
            - "config/api-messages.yaml"
        specs:
            - path: "api/harness-api.md"
              tags:
              - "api"
              - "envelope"
              - "error-code"
              tier: 1
    test:
        patterns:
            - "tests/**"
            - ".github/**"
            - "Makefile"
            # path_mapping 按 fnmatch 匹配且 * 跨 /，不能用 scripts/** 或 ! 排除；
            # 这里只列仓库级脚本，scripts/capacity/** 由 tests/capacity 覆盖。
            - "scripts/check_agent_capacity_deployment.py"
            - "scripts/check_error_message_hardcode.py"
            - "scripts/check_frontend_api_usage.py"
            - "scripts/check_frontend_i18n.py"
            - "scripts/check_secret_ref_residue.py"
            - "scripts/clean_acceptance_claims.py"
            - "scripts/dev.sh"
            - "scripts/e2e_changed.py"
        specs:
            - path: "test/harness-test.md"
              tags:
              - "test"
              - "acceptance"
              - "contract"
              - "ci"
              tier: 1
    e2e:
        # 浏览器验收单独成域：e2e/** 原先没有任何 pattern 指向，改域配置时一条规范都不注入。
        # 拆出 harness-e2e 后，tests/**（验收/单测/CI）与 e2e/**（Playwright 域配置）互不占预算。
        patterns:
            - "e2e/**"
            - "tests/frontend/test_e2e_suite_contract.py"
        specs:
            - path: "e2e/harness-e2e.md"
              tags:
              - "e2e"
              - "playwright"
              - "smoke"
              tier: 1
    i18n:
        patterns:
            - "apps/**/frontend/src/locales/**"
            - "apps/**/frontend/src/i18n/**"
            - "scripts/check_frontend_i18n.py"
        specs:
            - path: "i18n/harness-i18n.md"
              tags:
              - "i18n"
              - "locale"
              - "message"
              tier: 1
    ui:
        patterns:
            - "apps/**/frontend/**"
            - "**/*.tsx"
            - "**/*.jsx"
            - "**/*.css"
            - "**/*.scss"
        specs:
            - path: "ui/harness-ui.md"
              tags:
              - "ui"
              - "semi"
              - "menu"
              - "layout"
              tier: 1
    frontend:
        patterns:
            - "apps/**/frontend/**"
            - "scripts/check_frontend_api_usage.py"
        specs:
            - path: "frontend/harness-frontend.md"
              tags:
              - "frontend"
              - "api-client"
              - "axios"
              tier: 1
    ui-detail:
        # 只匹配详情视图的载体组件。**不能**沿用 frontend 的 `apps/**/frontend/**`：
        # 那会把「SideSheet 标题/操作/Tabs 结构」绑到任意前端文件，包括**没有任何详情
        # 视图**的模块（12-overview-dashboard 是仪表盘、列表只外链，就被误绑并触发一次
        # 无意义的 scope pause）。规则主体是具体组件家族，pattern 就应指向该家族。
        patterns:
            - "**/DetailSideSheet.tsx"
            - "**/*DetailSideSheet.tsx"
            - "**/*DetailTabs.tsx"
            - "**/components/common/DetailGrid.tsx"
        specs:
            - path: "ui-detail/harness-ui-detail.md"
              tags:
              - "ui"
              - "sidesheet"
              - "detail"
              - "tabs"
              tier: 1
    auth:
        patterns:
            - "**/models/auth.py"
            - "**/auth/**"
            - "**/*grant*"
            # CHAT 公开认证面（webchat auth）与 Console 管理会话是两套凭据，规则同属本域。
            - "**/webchat_auth.py"
            - "**/chat_auth_service.py"
            - "**/chat_token_service.py"
            - "**/chat_security.py"
        specs:
            - path: "auth/harness-auth.md"
              tags:
              - "auth"
              - "grant"
              - "scope"
              - "rbac"
              tier: 1
    model:
        patterns:
            - "packages/agent-core/**/model/**"
            - "**/models/model*"
            # 模型池/额度/容量：契约、Console 管理面与 Runtime 调度都有稳定规则（harness-model 的模型池段）。
            - "packages/contracts/src/muad_contracts/model_pool.py"
            - "apps/agent-runtime/src/muad_agent_runtime/application/model_*.py"
            - "apps/console-platform/backend/src/muad_console_platform/application/model_*.py"
        specs:
            - path: "model/harness-model.md"
              tags:
              - "model"
              - "provider"
              - "llm"
              tier: 1
    rel:
        patterns:
            - "**/*binding*"
            - "**/*relations*"
        specs:
            - path: "rel/harness-rel.md"
              tags:
              - "relation"
              - "binding"
              - "grant"
              - "transaction"
              tier: 1
    platform:
        patterns:
            - "packages/platform-sdk/**"
        specs:
            - path: "platform/harness-project-platform.md"
              tags:
              - "platform"
              - "adapter"
              - "session"
              - "credential"
              tier: 1
    im:
        patterns:
            - "apps/im-gateway/**"
            - "apps/im-connector/**"
            - "packages/im-core/**"
            - "packages/contracts/src/muad_contracts/channel.py"
            - "packages/contracts/src/muad_contracts/delivery.py"
            - "packages/contracts/src/muad_contracts/webchat.py"
            - "packages/contracts/src/muad_contracts/webchat_events.py"
        specs:
            - path: "im/harness-im.md"
              tags:
              - "im"
              - "gateway"
              - "bot"
              - "routing"
              tier: 1
    mcp:
        patterns:
            - "**/mcp/**"
            - "**/tools/**"
        specs:
            - path: "mcp/harness-mcp.md"
              tags:
              - "mcp"
              - "tool"
              - "catalog"
              - "discovery"
              tier: 1
    snapshot:
        patterns:
            - "apps/agent-runtime/**"
            - "packages/contracts/src/muad_contracts/runtime.py"
        specs:
            - path: "snapshot/harness-snapshot.md"
              tags:
              - "snapshot"
              - "freeze"
              - "version"
              - "budget"
              tier: 1
    worker:
        patterns:
            - "apps/agent-worker/**"
            - "packages/contracts/src/muad_contracts/tasks.py"
            - "**/scheduler/**"
        specs:
            - path: "worker/harness-worker.md"
              tags:
              - "worker"
              - "task"
              - "schedule"
              - "lease"
              - "claim"
              tier: 1
