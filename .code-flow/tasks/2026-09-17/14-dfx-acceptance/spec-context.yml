- spec_id: harness-api
  path: api/harness-api.md
  status: active
  hashes:
    file_sha256: 2e5d0a2a000f926953a8827b997514630f4b218746b5748567c75ac21e24c938
    metadata_sha256: 78f5e6a63d63c79dc2ac063f729d1dbbccf08917671adf7ff2bcd0974161fe60
