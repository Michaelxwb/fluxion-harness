- spec_id: harness-log
  path: logging/harness-log.md
  status: active
  hashes:
    file_sha256: 90d26b07974449f1b1121f6bd679daad85ecec208c7c706ec8d4885e71c04cd0
    metadata_sha256: 8bb67ae0c5cf82baee539013ff9840ed3004f3747460534ec4a8784e4b9640a1
    rules_sha256: 3b69c6ff06cb317f71f02b594214665b7f8ef095506ccf453279985f494811a8
  selected_by: agent
  reason: 新增接收/拒绝/失败日志走 logging-kit 并依赖其脱敏
  enforcement: required
  stages:
  - design
  - plan
  - code
  - review
  rules:
  - ref: RULE-log-001
    summary: 所有服务统一使用 logging-kit，仅配置 `LOG_DIR`（另读 `LOG_LEVEL`，缺省 `INFO`；非法级别直接 `raise
      ValueError` 而非静默回退；`console=True` 为默认值，会额外挂一个 stdout handler）；日志按 `service/YYYY-MM-DD.log`
