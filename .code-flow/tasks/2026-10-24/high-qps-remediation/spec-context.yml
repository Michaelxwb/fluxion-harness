- spec_id: harness-auth
  path: auth/harness-auth.md
  status: active
  hashes:
    file_sha256: 3214a3b041cdaa2a58d601754dce9ea10e02ccc2bbf8cb757a700baf35ec9b5e
    metadata_sha256: 282fc035519e5c5b8561dea4584ebcd8df997e78dc811a803b0dec769bd31e77
    rules_sha256: 2c0d8492b6adb9167c4309b44a5b1be42b1920f5e241f629d2f2bf9825cdc570
  selected_by: agent
  reason: Chat auth 查询合并与缓存不得改变三层授权/Effective Capability 口径
  enforcement: required
  stages:
  - design
  - plan
  - code
  - review
  rules:
  - ref: RULE-auth-001
    summary: 授权为三层关系：User→Agent（AgentAccessGrant）、Agent→Skill/MCP（Binding）、SELECTED
      资源再叠加 SkillUserGrant/McpUserGrant；Effective Capability 公式必须含 `is_deleted=false`
      与资源/Agent `enabled`；绑定无启停开关、授权无到期时间；不建三元授权、不做 MCP Tool 级授权；未授权资源不得进入 Prompt/ToolRegistry/Skill
