- spec_id: harness-memory
  path: memory/harness-memory.md
  status: active
  hashes:
    file_sha256: bdc1d8de5894d3b910893fa759822571fe73afb53c8996f617d29d353e67a511
    metadata_sha256: 26d60b919fdbf7ae2ae359788599979e062819d2fde8e31ff3f5ff03e21e629d
    rules_sha256: d74dfc24eb72fc17e685a51d708d2627a6f08952b1bc99264c9008ae2813d34a
  selected_by: path
  reason: 经验为 memory 行，状态/版本/历史/回执必须走记忆写入主通道
  enforcement: required
  stages:
  - design
  - plan
  - code
  - review
  rules:
  - ref: RULE-memory-001
    summary: 原话仅证明文本来源，不能授予保存授权；模型不得提供 author/explicit_request。自然语言 remember 必须展示完整候选，绑定租户/用户/Run/submission、候选
      hash、预期版本、forget_epoch 和有效期，由真实用户确认原子保存；只有真实入站的显式命令或已授权管理员可以直接保存。候选每 Run 至多一个，工具整轮完成后才暂停；resume
      先检查绝对 deadline。options 消费以租户和 source_event_id 唯一，结果 outcome 不进入唯一键。
    text_sha256: 45e94fd84a38203b37d6332389361b0e38af36731395999a213cc14a1f644dfe
    enforcement: required
    verifier_ref: harness-memory#RULE-memory-001
