    metadata_sha256: 5430fcb6d3c7d5e74881da16201bd6cf9661576d7b799848c8c456af37561841
    rules_sha256: 2c0d8492b6adb9167c4309b44a5b1be42b1920f5e241f629d2f2bf9825cdc570
  selected_by: path
  reason: 管理端点仅管理员；internal 仅服务身份
  enforcement: required
  stages:
