  path: platform/harness-project-platform.md
  status: active
  hashes:
    file_sha256: f4f43d998f5784d97bb0d048bd9712fab22a3089f0a53824b8b458f4b16ea5c7
    metadata_sha256: f96049e71930bae78aa61e211444baeb508c2abf1b61edd77db2699dc7b15a58
    rules_sha256: 34aebfc7fe09131b718d3fc60668f9a9540e8b5dc838a275252a93079bba7e4f
  selected_by: agent
  reason: PlatformSession 是可重建 Redis 缓存，session 失效逻辑改为逐 key 删除，必须保持缓存可重建语义。
  enforcement: required
  stages:
  - design
  - plan
  - code
  - review
  rules:
  - ref: RULE-platform-001
    summary: ProjectPlatform 只保存实例与寻址配置，认证/Session 由 PlatformAdapter 承担（SPI 无独立 `refresh`，刷新属于
      `authenticate` 内部）；凭据明文存于凭据表并由主键引用，`credential_mode` 仅表达选择策略（USER_ONLY/SHARED_ONLY/USER_THEN_SHARED/NONE）；PlatformSession
      为可重建 Redis 缓存，键为 `platform_session:{tenant_id:platform_id}:{actor_scope}:{credential_version}:{adapter_key}:{adapter_version}`（`{tenant_id:platform_id}`
      是字面 hash tag，session/index/generation/lock 同 slot，保证 4-key Lua 在 Redis Cluster
      可执行），索引 `platform_sessions:{tenant_id:platform_id}` 以 Set 清理；更换 adapter_key
      必须使旧凭据与会话失效。
    text_sha256: 5d84305e080ffb1a69e16206cc600ea1d8358d6756e206bf50a3fd22c41c72f2
