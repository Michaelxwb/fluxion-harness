    rules_sha256: 9ba8e1ce5ed34d0a5d740660530acab3d7f825818d4d2c3239f6a0ff0c631496
  selected_by: agent
  reason: 继承旧出口 SDK 需求的规范范围；新版重新建立证据，新增共享状态与稳定身份需要 data/time 约束
  enforcement: required
  stages:
  - design
  - plan
  - code
  - review
  rules:
  - ref: RULE-secret-001
