          reason: 本模块为只读聚合：两份 design 均声明只读 Owner 表、不写任何表，全模块仅 GET /api/v1/overview
            一个接口，不存在创建/上传类 POST；该规则（创建类 POST 的 Idempotency-Key 幂等）的适用对象与其 verifier（tests/console_skill/test_import_idempotency.py）均不涉及本模块。用户逐项确认。
