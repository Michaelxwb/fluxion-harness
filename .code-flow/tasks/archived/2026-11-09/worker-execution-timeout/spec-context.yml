  selected_by: agent
  reason: Preserve Runtime and Worker boundaries while removing a startup business
    default
  enforcement: required
  stages:
  - design
  - plan
  - code
  - review
  rules:
  - ref: RULE-arch-001
    summary: 固定四个**逻辑业务部署单元**（console-platform / agent-runtime / agent-worker / im-gateway）；`im-gateway`
      可拆为无状态 web 与有状态 connector 两个运行时角色，connector 不是第五个业务微服务。Runtime 与 Worker 无状态、可横向扩展，不绑定
      Pod、bot_id 或用户；同一会话可被任意 Pod 执行；Connector 只持有 bot 传输所有权与回复上下文，不建立 agent→Pod 映射。
