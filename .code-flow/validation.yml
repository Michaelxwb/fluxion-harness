# NOTE: 项目解释器是 `.venv/bin/python`（Python >=3.12，见 pyproject requires-python）。
# 裸 `python3` 在 macOS 上会落到 /usr/bin/python3 (3.9)，既没有依赖也没有 mypy，
# 会让每条校验永久失败。`uv` 不在非交互 shell 的 PATH 上，故不用于此处。
validators:
    - name: "Python 语法检查"
      trigger: "**/*.py"
      command: ".venv/bin/python -m py_compile {files}"
      timeout: 30000
      on_fail: "检查语法错误"

    # tsconfig.json 分处两个工程：frontend/console 与 apps/channel_gateway。
    # 在项目根执行 npx tsc 会去下载 TypeScript 并报 "you are looking for ..."；
    # 只跑 console 又会让 gateway 的 .ts 得到假 PASS。故按工程分别检查。
    # 依赖未安装时显式跳过——与 pytest 连不上 PG 时 skip 同口径。
    - name: "TypeScript 类型检查 (frontend/console)"
      trigger: "frontend/console/**/*.{ts,tsx}"
      command: "cd frontend/console && if [ ! -d node_modules ]; then echo 'SKIP: frontend/console/node_modules 未安装，类型检查未执行'; else npx tsc --noEmit; fi"
      timeout: 30000
      on_fail: "检查类型定义，参见 specs/frontend/quality-standards.md"

    - name: "TypeScript 类型检查 (apps/channel_gateway)"
      trigger: "apps/channel_gateway/**/*.{ts,tsx}"
      command: "cd apps/channel_gateway && if [ ! -d node_modules ]; then echo 'SKIP: apps/channel_gateway/node_modules 未安装，类型检查未执行（先 npm install）'; else npx tsc --noEmit; fi"
      timeout: 30000
      on_fail: "检查类型定义，参见 specs/frontend/quality-standards.md"

    - name: "Python 类型检查"
      trigger: "**/*.py"
      command: ".venv/bin/python -m mypy {files}"
      timeout: 30000
      on_fail: "检查类型注解，参见 specs/backend/code-quality-performance.md"

    - name: "Pytest"
      trigger: "**/*.py"
      command: ".venv/bin/python -m pytest --tb=short -q"
      timeout: 60000
      on_fail: "测试失败，检查断言和 mock 是否需要更新"
