# NOTE: 项目解释器是 `.venv/bin/python`（Python >=3.12，见 pyproject requires-python）。
# 裸 `python3` 在 macOS 上会落到 /usr/bin/python3 (3.9)，既没有依赖也没有 mypy，
# 会让每条校验永久失败。`uv` 不在非交互 shell 的 PATH 上，故不用于此处。
validators:
    - name: "Python 语法检查"
      trigger: "**/*.py"
      command: ".venv/bin/python -m py_compile {files}"
      timeout: 30000
      on_fail: "检查语法错误"

    # 真实前端工程只有 apps/console-platform/frontend 一处（含 tsconfig.json）。
    # 在项目根执行 npx tsc 会去下载 TypeScript 并报 "you are looking for ..."，
    # 故进入工程目录执行。依赖未安装时显式跳过——与 pytest 连不上 PG 时 skip 同口径。
    - name: "TypeScript 类型检查 (apps/console-platform/frontend)"
      trigger: "apps/console-platform/frontend/**/*.{ts,tsx}"
      command: "cd apps/console-platform/frontend && if [ ! -d node_modules ]; then echo 'SKIP: apps/console-platform/frontend/node_modules 未安装，类型检查未执行（先 npm install）'; else npx tsc --noEmit; fi"
      timeout: 30000
      on_fail: "检查类型定义，参见 specs/frontend/harness-frontend.md"

    - name: "Python 类型检查"
      # 触发范围只覆盖 mypy 恒绿的产品代码（apps/packages/scripts，含各根目录下的直属 .py）：
      # tests/ 从未纳入 strict mypy（muad_* 包未提供 py.typed、测试不做全量注解，实测每个
      # 测试文件都报错）；migrations/versions/ 为 alembic 自动生成（同 pyproject 的 mypy exclude
      # 与 ruff 的 extend-exclude 口径）。测试类型由 pytest 契约用例兜底。
      trigger: "{apps,packages,scripts}/{**,}*.py"
      command: ".venv/bin/python -m mypy {files}"
      timeout: 30000
      on_fail: "检查类型注解，参见 specs/arch/harness-arch.md"

    - name: "Pytest"
      trigger: "**/*.py"
      command: ".venv/bin/python -m pytest --tb=short -q"
      # Stop 链预算只有 30s（cf_stop_hook 的 TOTAL_BUDGET_SECONDS），全量套件永远跑不完——
      # 表现是「超时（>900s）」的**假失败**（cf_exec_base 用 min(timeout, remaining)，
      # 报错文案却按声明值打印）。故标为 heavy：语义是「Stop 链跳过、由 Done Gate(finish)/
      # cf-validate/CI 跑」（见 cf_stop_hook 的 `_stop_validators`）。**判据不变**：
      # `cf_validation` 不过滤 heavy，finish 仍跑全量。
      heavy: true
      # 套件含真实进程验收（uvicorn/子进程/探针/双 Worker 等）。2026-09-27 实测 1562 passed
      # 用时 717s（0:11:57），当时预算取 900s。2026-09-29：在 900s 预算下 finish 报
      # 「预算耗尽，部分未执行: Pytest」——注意该次观测发生时共享库上存在一套**孤儿验收栈**
      # （PPID=1 的 runtime×2+worker+gateway），其 Worker 会抢走验收任务（claim 无 tenant
      # 谓词），把耗时显著放大（同批用例清孤儿前后 369s → 56s）。故 1171s 类数字**不足以**
      # 作为标定依据。清孤儿后预算上限放宽到 1800s 并实测通过（Done Gate pass，
      # 2026-09-29 15:07）；真实分段耗时待下次干净单跑补记。
      timeout: 1800000
      on_fail: "测试失败，检查断言和 mock 是否需要更新"
