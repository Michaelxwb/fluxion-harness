# NOTE: 项目解释器是 `.venv/bin/python`（Python >=3.12，见 pyproject requires-python）。
# 裸 `python3` 在 macOS 上会落到 /usr/bin/python3 (3.9)，既没有依赖也没有 mypy，
# 会让每条校验永久失败。`uv` 不在非交互 shell 的 PATH 上，故不用于此处。
validators:
    - name: "Python 语法检查"
      trigger: "**/*.py"
      command: ".venv/bin/python -m py_compile {files}"
      timeout: 30000
      on_fail: "检查语法错误"

    # 真实前端工程只有 apps/console-platform/frontend 一处（含 tsconfig.json）。
    # 在项目根执行 npx tsc 会去下载 TypeScript 并报 "you are looking for ..."，
    # 故进入工程目录执行。依赖未安装时显式跳过——与 pytest 连不上 PG 时 skip 同口径。
    - name: "TypeScript 类型检查 (apps/console-platform/frontend)"
      trigger: "apps/console-platform/frontend/**/*.{ts,tsx}"
      command: "cd apps/console-platform/frontend && if [ ! -d node_modules ]; then echo 'SKIP: apps/console-platform/frontend/node_modules 未安装，类型检查未执行（先 npm install）'; else npx tsc --noEmit; fi"
      timeout: 30000
      on_fail: "检查类型定义，参见 specs/frontend/harness-frontend.md"

    - name: "Python 类型检查"
      # 触发范围只覆盖 mypy 恒绿的产品代码（apps/packages/scripts，含各根目录下的直属 .py）：
      # tests/ 从未纳入 strict mypy（muad_* 包未提供 py.typed、测试不做全量注解，实测每个
      # 测试文件都报错）；migrations/versions/ 为 alembic 自动生成（同 pyproject 的 mypy exclude
      # 与 ruff 的 extend-exclude 口径）。测试类型由 pytest 契约用例兜底。
      trigger: "{apps,packages,scripts}/{**,}*.py"
      command: ".venv/bin/python -m mypy {files}"
      timeout: 30000
      on_fail: "检查类型注解，参见 specs/arch/harness-arch.md"

    # 拆两条：验收与单测各自一个 pytest 进程（各自独立会话/独立数据存储）。
    # 原因（2026-10-15 实测）：`tests/acceptance/conftest.py` 的 session fixture 会把
    # `os.environ` 的 DATABASE_URL/REDIS_URL 覆盖成本轮验收库**直到会话结束**，而
    # 记忆 job/任务领取不带租户谓词——同一进程里跑在验收库上的单测会领到验收残留，
    # 表现为「单跑绿、整跑红」（实例：test_memory_redesign_job_effects 的 B-11 整跑红、
    # 单跑 1 passed×2）。拆进程后单测用环境注入的库、验收用自建库，互不可见。
    # 两条都标 heavy：Stop 与任务 finish 跳过（deferred_heavy），由需求终验 verify-e2e /
    # 归档 cf_validation 与显式 /cf-validate 执行；结果按工作树内容指纹缓存。
    - name: "Pytest (acceptance)"
      trigger: "**/*.py"
      # 容量压测（200/1000 用户）已标记 `capacity_load`，默认 acceptance 排除：它是环境依赖强的
      # load 场景，不是常规 integration；显式入口 `make capacity-load`（200 档）。
      # 1000 用户 × 8 轮仍是 manual/staging 的未验证边界，见
      # docs/operations/agent-capacity-webchat-validation.md「未验证边界」。
      command: ".venv/bin/python -m pytest --tb=short -q --durations=30 -m \"not capacity_load\" tests/acceptance"
      heavy: true
      # 验收含真实进程栈（uvicorn/子进程/探针/双 Worker/浏览器域外的一切），2026-10-15 实测
      # 331 passed ≈ 22–25 分钟；预算给 45 分钟留负载余量。
      timeout: 2700000
      on_fail: "验收失败：检查真实栈/探针/租户清理与断言，参见 specs/test/harness-test.md"
    - name: "Pytest (unit)"
      trigger: "**/*.py"
      command: ".venv/bin/python -m pytest --tb=short -q --durations=30 --ignore=tests/acceptance"
      heavy: true
      # 单测（agent_runtime/console_platform/frontend/gateway/sdk/migrations 等）2026-10-15
      # 实测 ≈ 12 分钟；预算给 30 分钟。
      timeout: 1800000
      on_fail: "测试失败，检查断言和 mock 是否需要更新"
