# Fluxion Harness 后端 CI（ADR-A007 PG-Only）
#
# 覆盖内容（单 PG job）：
#   1. ruff 代码风格检查 + mypy 类型检查
#   2. pytest 全量回归（PostgreSQL 后端，经服务容器提供）
#   3. Contract 测试即全量回归的一部分（backend/tests/contract/，单 PG 腿）
#
# 依赖安装说明（仓库含 uv.lock，优先使用 uv）：
#   uv sync --extra dev
#   无 uv 时的 pip 回退（见下方 backend 步骤注释）：
#   python3 -m pip install --upgrade pip
#   python3 -m pip install -e '.[dev]'

name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支 / PR 的新提交取消旧的未完成运行，节省 CI 额度
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端静态检查 + 全量回归（PostgreSQL，经服务容器提供）
  # ---------------------------------------------------------------------------
  backend:
    name: 后端 lint / mypy / pytest（PG）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxion_test
        ports:
          - 5432:5432
        # 健康检查：runner 会等待容器健康后再执行 job 步骤
        options: >-
          --health-cmd "pg_isready -U postgres -d fluxion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen：不解锁 / 更新 uv.lock，锁文件与 pyproject.toml 不一致时直接报错，
      # 保证 CI 可复现。--extra dev 安装 pyproject 的 dev 依赖组（pytest/mypy/ruff/testcontainers）。
      - name: 安装后端依赖（uv）
        run: uv sync --extra dev --frozen
        # 无 uv 时的 pip 回退：
        #   python3 -m pip install --upgrade pip
        #   python3 -m pip install -e '.[dev]'

      - name: ruff 代码风格检查
        run: uv run ruff check backend/src backend/tests

      - name: mypy 类型检查
        run: uv run mypy backend/src

      # 全量回归（含 backend/tests/contract/ 单 PG 腿；S-P13-07 live smoke 受
      # FLUXION_LIVE_MODEL_SMOKE 门控跳过）。PG 由上方服务容器提供。
      - name: pytest 全量回归（PostgreSQL）
        env:
          FLUXION_POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/fluxion_test
          FLUXION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fluxion_test
        run: uv run python -m pytest backend/tests -q
