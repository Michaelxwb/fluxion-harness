name: capacity

# 容量回归守卫（不是生产 SLO 门禁）。
#
# 为什么只跑“runner 能承载”的档：GitHub-hosted runner 是 4 vCPU / 16 GB，PG/Redis/四单元与
# 负载生成器同机。2026-10-26 实测（run #1/#2，同一套 S-16 阈值）：
#   - 30 用户：admission P95 1246ms（阈值 1000）、first_delta P95 3536ms（阈值 2500）、
#     idle-in-tx 26（阈值 20）→ 红；同一天同一份代码在本机 30 用户 1 passed。
#   - 15 用户：全绿。
# 即 30 用户档在 runner 上不是“稳定通过”的，它是机器差异不是代码退化；档位据此定在 15。
# 阈值本身**不下调**（保持与生产同一把尺），只降负载，回归仍会被抓到。
#
# 1000×8 全量只在 staging 由人工发布门禁 E-09 执行；runner 上的任何数字都不得写成
# “1000 用户达标”。

on:
  schedule:
    # 每天 18:00 UTC（02:00 CST）跑一次；与 push/PR 流水线解耦，不占 PR 反馈时间。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      users:
        description: "并发用户数（runner 容量内；超过 runner 承载档会失真）"
        required: false
        default: "15"

concurrency:
  # 同一时刻只跑一个容量档，避免两次压测互相抢 CPU/连接。
  group: capacity-nightly
  cancel-in-progress: false

jobs:
  capacity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
      INTERNAL_SERVICE_TOKEN: test-internal-token
      PYTEST_FAILURE_LOG: /tmp/pytest-failures.log
      # 默认 15（= 2026-10-26 实测 runner 可稳定承载的档，见文件头）。manual 触发可传更高档，
      # 但超过承载档时得到的是排队效应，只作诊断、不写达标。
      CAPACITY_LOAD_USERS: ${{ github.event.inputs.users || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: 生成 CI 专用 alembic ini 并迁移到 head
        run: |
          printf '[alembic]\nscript_location = migrations\nprepend_sys_path = .\nsqlalchemy.url = %s\n' \
            "$DATABASE_URL" > "$RUNNER_TEMP/alembic.ci.ini"
          uv run python migrations/db_migrate.py -c "$RUNNER_TEMP/alembic.ci.ini"
      - name: 清理残留 Redis claim
        run: uv run python scripts/clean_acceptance_claims.py
      - name: 预建干净检出缺失的 .data 挂载目录
        run: mkdir -p .data/artifacts .data/skill-cache
      - name: 容量 smoke（闸门容量回归守卫，非 1000 用户 SLO）
        run: |
          uv run pytest -q -m capacity_load \
            tests/acceptance/capacity/test_capacity_smoke.py \
            --durations=20
      - name: 上传失败用例与报告（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-smoke-report
          path: |
            /tmp/pytest-failures.log
            .data/dev/*.log
          retention-days: 14
          if-no-files-found: ignore
