name: check

on:
  push:
  pull_request:

jobs:
  # 静态检查不需要数据库：从原来的 backend job 拆出来，和测试分片并行，而不是串在一轮
  # 70 分钟的全量执行里。compile/i18n/error-message/lint/typecheck 都是纯静态或只读文件。
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # **必须钉 Python 版本**：不钉的话 uv 会在 runner 上挑系统自带的 3.12、在开发机上挑
      # uv 装的 3.13 —— CI 与本地静默跑在不同解释器上，是"本地绿、CI 红"最难查的一类来源
      # （2026-10-03 实测：三次 CI 各挂一个不同的验收用例，而本地同批 1888 条全过）。
      # 口径以镜像为准：四个 Dockerfile 都用 `uv:python3.12-bookworm-slim`，所以钉 3.12，
      # 把开发机拉回与 CI / 生产一致，而不是反过来改 CI。仓库根的 `.python-version` 是同一口径的本地落地。
      # 同一个 job 里 node 一直是显式钉的（`node-version: 20`），Python 漏了，这是补齐。
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run make compile
      - run: uv run make i18n-check
      - run: uv run make error-message-check
      - run: uv run make lint
      - run: uv run make typecheck

  # 单测按目录切成 4 个互不重叠的分片并行。每个分片是独立 job，因而各自拿到一套 PG/Redis
  # service —— 不共享数据库、不共享 Redis 号位，跨分片不会互相污染。
  # 用静态路径分片而不是 pytest-xdist：失败能直接归因到固定目录，复现命令就是本矩阵里的那行；
  # 代价是新增顶层测试目录时必须同步这里。覆盖由人工维护，`tests/test_collection_layout.py`
  # 只校验收集布局，不会发现「某目录没被任何分片引用」。
  backend-tests:
    name: backend-tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: fast
            paths: "tests/contracts tests/frontend tests/architecture tests/agent_core tests/test_*.py"
          - name: runtime
            paths: "tests/agent_runtime tests/sdk"
          - name: console
            paths: "tests/gateway tests/console_auth tests/console_channel tests/console_internal tests/console_mcp tests/console_platform tests/console_skill tests/console_tasks tests/e2e"
          - name: worker
            paths: "tests/agent_worker tests/capacity tests/migrations"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 全量测试里有大量用例要求真实 Redis（如 tests/agent_worker/test_worker_lifecycle.py 的
      # wakeup hint），缺了会直接红：`AssertionError: REDIS_URL 未配置或不可达：该用例需要真实 Redis`
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
      # 真实栈的内部边界要求服务身份；干净检出没有 `.env`，不设这一格所有
      # `/internal/**` 调用都会 403（测试侧 fixture 也会兜底，但子进程只继承 env）。
      INTERNAL_SERVICE_TOKEN: test-internal-token
      # tests/conftest.py 在用例失败/出错时即时写一行；分片被超时或 kill 时摘要不会生成，
      # 这个文件 + artifact 是事后定位失败用例的唯一线索。
      PYTEST_FAILURE_LOG: /tmp/pytest-failures.log
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # 迁移配置「各环境各一份」：每个分片用自己的 service DSN 现场生成 CI 专用 ini，
      # 仓库里的 migrations/alembic.ini 是 **dev 的**配置，两者互不影响（迁移只认 ini，不读环境变量）。
      - name: 生成 CI 专用 alembic ini 并迁移到 head
        run: |
          printf '[alembic]\nscript_location = migrations\nprepend_sys_path = .\nsqlalchemy.url = %s\n' \
            "$DATABASE_URL" > "$RUNNER_TEMP/alembic.ci.ini"
          uv run python migrations/db_migrate.py -c "$RUNNER_TEMP/alembic.ci.ini"
      - name: 运行 ${{ matrix.shard.name }} 分片
        run: uv run pytest -q -m "not capacity_load" --durations=30 ${{ matrix.shard.paths }}
      - name: 上传失败用例清单（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard.name }}-failures
          path: /tmp/pytest-failures.log
          retention-days: 7
          if-no-files-found: ignore

  # 真实栈验收（tests/acceptance）：每轮自建 muad_acc_<uuid> 空库 + 独立 Redis 号位。
  # **按模块分片**：DFX 等模块会起真实 Worker/Runtime 子进程，claim 是全局的；串在一个
  # pytest 进程/job 里会让前序模块的进程领走后续模块的任务（单跑绿、串跑红），且全量
  # 超过 45 分钟。每片独立 job + 独立 PG/Redis，既隔离进程也隔离库/号位。
  acceptance:
    name: acceptance (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: dfx
            paths: "tests/acceptance/dfx"
          - name: gateway
            paths: "tests/acceptance/gateway tests/acceptance/im_gateway"
          - name: runtime
            paths: "tests/acceptance/runtime tests/acceptance/capacity tests/acceptance/task_schedule"
          - name: rest
            paths: "tests/acceptance/attachment_round_trip tests/acceptance/audit_observability tests/acceptance/console_auth_flow tests/acceptance/overview tests/acceptance/security tests/acceptance/wecom_attachments tests/acceptance/test_*.py"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
      INTERNAL_SERVICE_TOKEN: test-internal-token
      PYTEST_FAILURE_LOG: /tmp/pytest-failures.log
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: 生成 CI 专用 alembic ini 并迁移到 head
        run: |
          printf '[alembic]\nscript_location = migrations\nprepend_sys_path = .\nsqlalchemy.url = %s\n' \
            "$DATABASE_URL" > "$RUNNER_TEMP/alembic.ci.ini"
          uv run python migrations/db_migrate.py -c "$RUNNER_TEMP/alembic.ci.ini"
      - name: 清理残留 Redis claim
        run: uv run python scripts/clean_acceptance_claims.py
      - name: 运行 ${{ matrix.shard.name }} 验收分片
        run: uv run pytest -q -m "not capacity_load" --durations=30 ${{ matrix.shard.paths }}
      - name: 上传失败用例清单（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.shard.name }}-failures
          path: /tmp/pytest-failures.log
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/console-platform/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm run build
        working-directory: apps/console-platform/frontend

  # 浏览器验收：真实构建产物（vite preview）+ 真实 Chrome + 真实 PostgreSQL/Redis。
  #
  # 15 条跨域 smoke 白名单（e2e/scenarios/smoke-15.scenarios.md）：PR/发布必跑的关键旅程。
  # 与 e2e job 同样的真实栈服务，但只跑 @smoke 标记；逐域不 fail-fast，一次列出所有失败域。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/console-platform/frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --extra dev
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm ci
        working-directory: e2e
      - name: 预检系统 Chrome
        run: google-chrome --version
      - name: 构建前端产物（smoke 各域共用）
        run: npm --prefix apps/console-platform/frontend run build
      - name: 逐域 smoke（汇总失败，不 fail-fast）
        run: |
          set -u
          failed=""
          mkdir -p /tmp/smoke-logs
          for domain in \
            console-auth overview-dashboard model-management agent skill mcp \
            platform user-identity settings task-schedule-e2e \
            audit-observability run-observability-e2e webchat-e2e
          do
            echo "::group::smoke ${domain}"
            log="/tmp/smoke-logs/${domain}.log"
            if npm --prefix e2e test -- --config "playwright.${domain}.config.ts" --grep "@smoke" >"$log" 2>&1; then
              echo "PASS smoke ${domain}"
            else
              echo "FAIL smoke ${domain}"
              failed="${failed} ${domain}"
              cp -r e2e/test-results "/tmp/smoke-logs/${domain}-test-results" 2>/dev/null || true
              reason="$(grep -m1 -E '✘|^[[:space:]]*[0-9]+\) ' "$log" || true)"
              if [ -z "${reason}" ]; then
                reason="$(grep -m1 -E 'Error:|Timed out|EADDRINUSE|ECONNREFUSED|refused|StartupValidationError' "$log" || true)"
              fi
              echo "::error::smoke ${domain}: ${reason:-（未匹配到错误行，见 artifact smoke-domain-logs）}"
              tail -c 2000 "$log"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "::error::smoke 失败的域:${failed}"
            exit 1
          fi
          echo "15 条 smoke 白名单全部通过（34 条用例）"
      - name: changed profile（非 smoke；按 trigger_paths）
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="HEAD~1"; fi
          uv run python scripts/e2e_changed.py --base "$base" --no-build --no-smoke --run
      - name: 上传 smoke 日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-domain-logs
          path: /tmp/smoke-logs
          retention-days: 7
          if-no-files-found: warn

  # 为什么单列一个 job：`frontend` 只验证「能构建」，Playwright 在 CI 里从不执行 —— 于是断言
  # 与实现之间的漂移（testid 改名、详情容器从 Modal 换成 SideSheet、写死的文案被本地化）只在
  # 有人手动跑某个域时才暴露，没有任何聚合信号（2026-10-02 一轮里手查出 4 处这类漂移 + 1 处
  # 产品崩溃）。逐域顺序执行且**不 fail-fast**：一次 CI 就能列出**全部**漂移的域，而不是修一个
  # 才发现下一个。新增域时同步下面那份域清单即可。
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 验收每轮自建 muad_acc_<uuid> 空库（tests/acceptance/datastores.py），此处的库只作「建库
      # 基准」；POSTGRES_USER=muad 在官方镜像里是超级用户，具备建库权限。
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      # **必须钉 Python 版本**：不钉的话 uv 会在 runner 上挑系统自带的 3.12、在开发机上挑
      # uv 装的 3.13 —— CI 与本地静默跑在不同解释器上，是"本地绿、CI 红"最难查的一类来源
      # （2026-10-03 实测：三次 CI 各挂一个不同的验收用例，而本地同批 1888 条全过）。
      # 口径以镜像为准：四个 Dockerfile 都用 `uv:python3.12-bookworm-slim`，所以钉 3.12，
      # 把开发机拉回与 CI / 生产一致，而不是反过来改 CI。仓库根的 `.python-version` 是同一口径的本地落地。
      # 同一个 job 里 node 一直是显式钉的（`node-version: 20`），Python 漏了，这是补齐。
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/console-platform/frontend/package-lock.json
            e2e/package-lock.json
      # redis 不随 --extra dev 直装，但 dev extra 含 muad-agent-runtime / muad-im-gateway，
      # 两者把 redis 声明为运行时依赖，故会传递装上（datastores.py 依赖它做号位占位）。
      - run: uv sync --extra dev
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm ci
        working-directory: e2e
      # 域配置一律 `channel: 'chrome'`（系统 Chrome，不下载 Playwright 自带浏览器）：缺了要立刻
      # 报清楚，而不是等到某个域超时才发现
      - name: 预检系统 Chrome
        run: google-chrome --version
      - name: 构建前端产物（e2e 各域共用）
        run: npm --prefix apps/console-platform/frontend run build
      - name: 逐域浏览器验收（汇总失败，不 fail-fast）
        run: |
          set -u
          failed=""
          mkdir -p /tmp/e2e-logs
          for domain in \
            agent audit-observability console-auth mcp \
            model-management overview-dashboard platform run-observability-e2e run-observability-regression settings skill \
            task-schedule-e2e task-schedule-regression user-identity webchat-e2e webchat-regression
          do
            echo "::group::e2e ${domain}"
            log="/tmp/e2e-logs/${domain}.log"
            if make acceptance-e2e DOMAIN="${domain}" BUILD_FRONTEND=0 >"$log" 2>&1; then
              echo "PASS ${domain}"
            else
              echo "FAIL ${domain}"
              failed="${failed} ${domain}"
              # trace / error-context 只在失败时保留（`trace: retain-on-failure`），但 Playwright
              # 每跑一次都会清空 outputDir（默认 `e2e/test-results`）⇒ 当场按域搬走，否则 16 个域
              # 顺序跑完只剩**最后一个**域的，偶发失败（如 task-cancel 的 detach）事后无从复盘。
              cp -r e2e/test-results "/tmp/e2e-logs/${domain}-test-results" 2>/dev/null || true
              # 把**失败的那一条**带进 annotation：annotation 匿名可读，而 job 日志需要认证。
              # 分两轮取，顺序重要 ——
              #   ① `✘`（list reporter 的失败标记）或 ` 12) `（失败块编号）：这才是**失败项**本身；
              #   ② 退回到 `Error:` 一类：启动阶段就死时没有 ①（Playwright 还没跑到用例），
              #      此时 WebServer 的报错才是真因。
              # 教训：早先只用一条宽泛的 grep（含 `FAILED`），会匹配到**通过**用例的名字
              # （如「E-FE-03 超时 Task 显示 FAILED …」），于是 annotation 报出一个假原因。
              reason="$(grep -m1 -E '✘|^[[:space:]]*[0-9]+\) ' "$log" || true)"
              if [ -z "${reason}" ]; then
                reason="$(grep -m1 -E 'Error:|Timed out|EADDRINUSE|ECONNREFUSED|refused|StartupValidationError' "$log" || true)"
              fi
              echo "::error::${domain}: ${reason:-（未匹配到错误行，见 artifact e2e-domain-logs）}"
              tail -c 2000 "$log"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "::error::浏览器验收失败的域:${failed}"
            exit 1
          fi
          echo "全部 16 个域通过"
      - name: 上传各域日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-domain-logs
          path: /tmp/e2e-logs
          retention-days: 7
          if-no-files-found: warn

  # 纯 component 域（真实构建产物 + mock API，不启动 Console/PG/Redis）。
  # 与 e2e 分开：布局/错误态/菜单等 UI 语义不应该占用真实 E2E 的信号与超时预算。
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/console-platform/frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm ci
        working-directory: e2e
      - name: 预检系统 Chrome
        run: google-chrome --version
      - name: 构建前端产物（component 各域共用）
        run: npm --prefix apps/console-platform/frontend run build
      - name: 逐域 component 验收（汇总失败，不 fail-fast）
        run: |
          set -u
          failed=""
          mkdir -p /tmp/component-logs
          for domain in \
            form-layout list-actions sidebar console-auth-ui overview-dashboard-ui audit-observability-ui \
            model-management-ui skill-management-ui mcp-management-ui project-platform-ui \
            user-identity-ui settings-ui agent-management-ui
          do
            echo "::group::component ${domain}"
            log="/tmp/component-logs/${domain}.log"
            if make acceptance-e2e DOMAIN="${domain}" BUILD_FRONTEND=0 >"$log" 2>&1; then
              echo "PASS ${domain}"
            else
              echo "FAIL ${domain}"
              failed="${failed} ${domain}"
              # 每个域跑完都会清空 outputDir，当场搬走 trace/error-context，避免只剩最后一个域的。
              cp -r e2e/test-results "/tmp/component-logs/${domain}-test-results" 2>/dev/null || true
              reason="$(grep -m1 -E '✘|^[[:space:]]*[0-9]+\) ' "$log" || true)"
              if [ -z "${reason}" ]; then
                reason="$(grep -m1 -E 'Error:|Timed out|EADDRINUSE|ECONNREFUSED|refused|StartupValidationError' "$log" || true)"
              fi
              echo "::error::${domain}: ${reason:-（未匹配到错误行，见 artifact component-domain-logs）}"
              tail -c 2000 "$log"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "::error::component 验收失败的域:${failed}"
            exit 1
          fi
          echo "全部 13 个 component 域通过"
      - name: 上传 component 日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-domain-logs
          path: /tmp/component-logs
          retention-days: 7
          if-no-files-found: warn

  # 四个部署单元各一个镜像（与 deploy/k8s/base 的四份 Deployment 一一对应）。
  # PR 上只验证「能构建」；**只有 main 的 push 才发布到 ghcr.io**（避免 PR 污染 registry）。
  # 镜像名沿用仓库既有口径 `muad-<unit>`；deploy/k8s/base/*.yaml 的 image 字段引用的是同一
  # 名字的 **ghcr 全名**（`ghcr.io/michaelxwb/muad-<unit>:latest`）——两边都不得写裸名。
  # 早期 ghcr 上那套 fluxion-api / fluxion-runtime / fluxion-worker / fluxion 是
  # 2026-09-07 的一次手动推送（tag 为当天的 sha `f7cf691`），命名与仓库单元对不上，**不再沿用**。
  #
  # tags 里**不得**出现无 registry 前缀的裸名：`muad-<unit>:ci` 会被解析成
  # `docker.io/library/muad-<unit>`，而 `push: true` 时 buildx 推**全部** tag ⇒ 拿 ghcr 的
  # token 去推 Docker Hub，以 `401 ... access token has insufficient scopes` 整条失败
  # （2026-10-02 首轮真实推送实测）。裸名也没有消费者：本 job 无 `load:`，镜像不进本地 daemon。
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        unit: [console-platform, agent-runtime, agent-worker, im-gateway]
    steps:
      - uses: actions/checkout@v4
      # ghcr 的包名要求**全小写**，而 owner 是 `Michaelxwb` ⇒ 用 bash 小写展开算前缀，
      # 否则 build-push-action 会以 invalid reference format 失败。
      - name: 计算镜像前缀（ghcr 包名要求全小写）
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # 平台与推送的**唯一决策点**（后面各步都引用它，避免条件散落多处而不一致）：
      # - main 的 push：多平台（amd64 + arm64）并推送；
      # - 其它（PR / 其它分支）：只构建本机平台、不推送。
      # 为什么不能「多平台 + 不推送」：多平台镜像产出的 manifest list **无法 load 进本地
      # docker daemon**（daemon 只持单一平台），build-push-action 会以
      # `docker exporter does not currently support exporting manifest lists` 失败。
      - name: 选择目标平台与是否推送
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      # arm64 走 QEMU 模拟；必须排在 buildx **之前**，binfmt 才会被 buildx 采纳。
      # 只在真要多平台时装（PR 上省掉这段开销）。
      - if: steps.targets.outputs.push == 'true'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: steps.targets.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.unit }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.unit }}/Dockerfile
          platforms: ${{ steps.targets.outputs.platforms }}
          push: ${{ steps.targets.outputs.push }}
          tags: |
            ${{ steps.img.outputs.prefix }}/muad-${{ matrix.unit }}:latest
            ${{ steps.img.outputs.prefix }}/muad-${{ matrix.unit }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.unit }}
