name: check

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 全量测试里有大量用例要求真实 Redis（如 tests/agent_worker/test_worker_lifecycle.py 的
      # wakeup hint），缺了会直接红：`AssertionError: REDIS_URL 未配置或不可达：该用例需要真实 Redis`
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      # 迁移配置「各环境各一份」：本 job 用自己 service 的 DSN 现场生成 CI 专用 ini，
      # 仓库里的 migrations/alembic.ini 是 **dev 的**配置，两者互不影响（迁移只认 ini，不读环境变量）。
      - name: 生成 CI 专用 alembic ini 并迁移到 head
        run: |
          printf '[alembic]\nscript_location = migrations\nprepend_sys_path = .\nsqlalchemy.url = %s\n' \
            "$DATABASE_URL" > "$RUNNER_TEMP/alembic.ci.ini"
          uv run python migrations/db_migrate.py -c "$RUNNER_TEMP/alembic.ci.ini"
      - run: uv run make check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/console-platform/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm run build
        working-directory: apps/console-platform/frontend

  # 浏览器验收：真实构建产物（vite preview）+ 真实 Chrome + 真实 PostgreSQL/Redis。
  #
  # 为什么单列一个 job：`frontend` 只验证「能构建」，Playwright 在 CI 里从不执行 —— 于是断言
  # 与实现之间的漂移（testid 改名、详情容器从 Modal 换成 SideSheet、写死的文案被本地化）只在
  # 有人手动跑某个域时才暴露，没有任何聚合信号（2026-10-02 一轮里手查出 4 处这类漂移 + 1 处
  # 产品崩溃）。逐域顺序执行且**不 fail-fast**：一次 CI 就能列出**全部**漂移的域，而不是修一个
  # 才发现下一个。新增域时同步下面那份域清单即可。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 验收每轮自建 muad_acc_<uuid> 空库（tests/acceptance/datastores.py），此处的库只作「建库
      # 基准」；POSTGRES_USER=muad 在官方镜像里是超级用户，具备建库权限。
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/console-platform/frontend/package-lock.json
            e2e/package-lock.json
      # redis 不随 --extra dev 直装，但 dev extra 含 muad-agent-runtime / muad-im-gateway，
      # 两者把 redis 声明为运行时依赖，故会传递装上（datastores.py 依赖它做号位占位）。
      - run: uv sync --extra dev
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm ci
        working-directory: e2e
      # 域配置一律 `channel: 'chrome'`（系统 Chrome，不下载 Playwright 自带浏览器）：缺了要立刻
      # 报清楚，而不是等到某个域超时才发现
      - name: 预检系统 Chrome
        run: google-chrome --version
      - name: 逐域浏览器验收（汇总失败，不 fail-fast）
        run: |
          set -u
          failed=""
          mkdir -p /tmp/e2e-logs
          for domain in \
            agent audit-observability console-auth form-layout list-actions mcp \
            model-management overview-dashboard platform sidebar skill \
            task-schedule user-identity
          do
            echo "::group::e2e ${domain}"
            log="/tmp/e2e-logs/${domain}.log"
            if make acceptance-e2e DOMAIN="${domain}" >"$log" 2>&1; then
              echo "PASS ${domain}"
            else
              echo "FAIL ${domain}"
              failed="${failed} ${domain}"
              # 把**首条错误**带进 annotation：annotation 匿名可读，而 job 日志需要认证。
              # 2026-10-02 首跑只报「哪些域失败」不报原因，等于没法诊断 —— 这次补上。
              reason="$(grep -m1 -E "Error:|error:|Timeout|FAILED|failed|EADDRINUSE|refused" "$log" | cut -c1-220 || true)"
              echo "::error::${domain}: ${reason:-（未匹配到错误行，见 artifact e2e-domain-logs）}"
              tail -c 2000 "$log"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "::error::浏览器验收失败的域:${failed}"
            exit 1
          fi
          echo "全部 13 个域通过"
      - name: 上传各域日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-domain-logs
          path: /tmp/e2e-logs
          retention-days: 7
          if-no-files-found: warn

  # 四个部署单元各一个镜像（与 deploy/k8s/base 的四份 Deployment 一一对应）。
  # PR 上只验证「能构建」；**只有 main 的 push 才发布到 ghcr.io**（避免 PR 污染 registry）。
  # 命名沿用仓库既有口径 `muad-<unit>` —— 与 deploy/k8s/base/*.yaml 的 image 字段、
  # 以及本 job 的本地 tag `muad-<unit>:ci` 一致。早期 ghcr 上那套
  # fluxion-api / fluxion-runtime / fluxion-worker / fluxion 是 2026-09-07 的一次手动推送
  # （tag 为当天的 sha `f7cf691`），命名与仓库单元对不上，**不再沿用**。
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        unit: [console-platform, agent-runtime, agent-worker, im-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # ghcr 的包名要求**全小写**，而 owner 是 `Michaelxwb` ⇒ 用 bash 小写展开算前缀，
      # 否则 build-push-action 会以 invalid reference format 失败。
      - name: 计算镜像前缀（ghcr 包名要求全小写）
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.unit }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.unit }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            muad-${{ matrix.unit }}:ci
            ${{ steps.img.outputs.prefix }}/muad-${{ matrix.unit }}:latest
            ${{ steps.img.outputs.prefix }}/muad-${{ matrix.unit }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.unit }}
