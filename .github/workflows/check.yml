name: check

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muad
          POSTGRES_PASSWORD: muad
          POSTGRES_DB: muad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muad -d muad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://muad:muad@localhost:5432/muad
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      # 迁移连接串读 migrations/alembic.ini（migrations/ 下不读环境变量）——
      # 该文件的 sqlalchemy.url 必须与上面的 postgres service 一致（当前都是 muad:muad@localhost:5432/muad）
      - run: uv run alembic -c migrations/alembic.ini upgrade head
      - run: uv run make check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/console-platform/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/console-platform/frontend
      - run: npm run build
        working-directory: apps/console-platform/frontend

  # 四个部署单元各一个镜像（与 deploy/k8s/base 的四份 Deployment 一一对应）。
  # 这里只验证「能构建」；镜像推送/打标（:latest / :vX.Y.Z）待 registry 确定后另加 job。
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: [console-platform, agent-runtime, agent-worker, im-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.unit }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.unit }}/Dockerfile
          push: false
          tags: muad-${{ matrix.unit }}:ci
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.unit }}
