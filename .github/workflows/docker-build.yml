# Fluxion Harness 镜像构建与推送（ADR-A007 之后的三角色形态）
#
# 产物（GHCR，双架构 linux/amd64 + linux/arm64）：
#   - ghcr.io/<owner>/fluxion-api
#   - ghcr.io/<owner>/fluxion-runtime
#   - ghcr.io/<owner>/fluxion-worker
#
# Tag 规则（docker/metadata-action）：
#   - 主分支：<sha> + latest
#   - PR：pr-<number>（只构建不推送，见下方 push 条件）
#   - tag 推送：v*.*.* → 对应版本号 + latest
#
# 触发：main 分支 push、v* tag、手动 dispatch。PR 只做构建验证（不推送）。
# 说明：Dockerfile 三 target 共用 frontend/backend/base 层，buildx 一次构建多架构。

name: docker-build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建推送 ${{ matrix.target }}（amd64+arm64）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [api, runtime, worker]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 小写 owner（GHCR 路径必须小写）
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tag 规则
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/fluxion-${{ matrix.target }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
