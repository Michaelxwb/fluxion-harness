[project]
name = "muad-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "muad-api",
  "muad-common",
  "muad-contracts",
  "muad-artifact-store",
  "muad-agent-core",
  "muad-skill-sdk",
  "muad-platform-sdk",
  "muad-logging",
  "redis>=5,<7",
  # 附件文档文本抽取（设计 §3.1 技术栈 / AD-4-B）：**落在 agent 侧，不进网关** —— 渠道层不背
  # 内容理解，且任何入口落进 artifact 的东西都能读（企微附件 / Console 上传 / skill 产出）。
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
muad-api = { workspace = true }
muad-common = { workspace = true }
muad-contracts = { workspace = true }
muad-artifact-store = { workspace = true }
muad-agent-core = { workspace = true }
muad-skill-sdk = { workspace = true }
muad-platform-sdk = { workspace = true }
muad-logging = { workspace = true }
