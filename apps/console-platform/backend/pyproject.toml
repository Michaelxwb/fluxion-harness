[project]
name = "muad-console-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=23,<26",
  "muad-api",
  "muad-common",
  "muad-contracts",
  "muad-artifact-store",
  "muad-logging",
  "muad-skill-sdk",
  "jsonschema>=4.26.0",
  # 迁移载体：`migrations/db_migrate.py` 只依赖 alembic + sqlalchemy[asyncio] + asyncpg
  # （不 import 任何业务包）。集群内没有别的地方能跑迁移，而 Console 是控制面单元，
  # 故由它的镜像承载 `deploy/k8s/base/migrate-job.yaml`（版本与根 pyproject 同 pin）。
  "alembic>=1.14,<2",
]

[project.scripts]
muad-console-admin = "muad_console_platform.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
muad-api = { workspace = true }
muad-common = { workspace = true }
muad-contracts = { workspace = true }
muad-artifact-store = { workspace = true }
muad-logging = { workspace = true }
muad-skill-sdk = { workspace = true }
