[project]
name = "muad-console-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=23,<26",
  "muad-api",
  "muad-common",
  "muad-contracts",
  "muad-artifact-store",
  "muad-logging",
  "muad-skill-sdk",
  "jsonschema>=4.26.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
muad-api = { workspace = true }
muad-common = { workspace = true }
muad-contracts = { workspace = true }
muad-artifact-store = { workspace = true }
muad-logging = { workspace = true }
muad-skill-sdk = { workspace = true }
