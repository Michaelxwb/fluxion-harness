[project]
name = "muad-im-connector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.28,<1",
  "redis>=5,<7",
  "muad-api",
  "muad-artifact-store",
  "muad-common",
  "muad-contracts",
  "muad-im-core",
  # Connector 是 im-gateway 的**有状态运行时角色**：复用 Gateway 的渠道中立协议面
  # （`channels/base.py`）与控制面客户端；渠道实现（含 SDK）只活在本包 `channels/`。
  "muad-im-gateway",
  "muad-logging",
  "muad-platform-sdk",
  "wecom-aibot-python-sdk>=1,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
muad-api = { workspace = true }
muad-artifact-store = { workspace = true }
muad-common = { workspace = true }
muad-contracts = { workspace = true }
muad-im-core = { workspace = true }
muad-im-gateway = { workspace = true }
muad-logging = { workspace = true }
muad-platform-sdk = { workspace = true }
