[project]
name = "muad-im-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.28,<1",
  "redis>=5,<7",
  "muad-api",
  "muad-common",
  "muad-contracts",
  "muad-logging",
  "muad-platform-sdk",
  "wecom-aibot-python-sdk>=1,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
muad-api = { workspace = true }
muad-common = { workspace = true }
muad-contracts = { workspace = true }
muad-logging = { workspace = true }
muad-platform-sdk = { workspace = true }
