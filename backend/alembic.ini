# Alembic 迁移配置：Dev SQLite / Prod PostgreSQL 共用同一套 migration。
# sqlalchemy.url 在此仅作占位，实际由 env.py 从 FLUXION_DATABASE_URL 环境变量读取，
# 未设置时回退到本地 dev SQLite。
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///./.data/fluxion.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
