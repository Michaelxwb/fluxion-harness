image:
  repository: ''
  tag: ''

global:
  imageRegistry: docker.sangfor.com/mss-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  existingSecret: muad-external
  connectorSecret: muad-connector-external
  artifacts:
    existingClaim: muad-artifacts-rwx
    mountPath: /mnt/muad-artifacts
  workspaces:
    existingClaim: muad-workspaces-rwx
    mountPath: /mnt/muad-workspaces
  skillCache:
    mountPath: /var/cache/muad/skills
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
serviceAccount:
  create: false
  name: ''
  annotations: {}
service:
  tag: ''
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  #: 每进程执行槽（`RUNTIME_EXECUTION_CONCURRENCY`）。内网按 8 部署（8 副本 × 8 = 64 并发 Run），
  #: 与 `SharedSettings` 的 typed 默认 256 不同——这是内网容量选择，不是默认值。
  #: HPA 的 `runtime_queue_depth` 目标由它推导（2 × 本值）。
  executionConcurrency: 8
  extraEnv: []
  name: muad-agent-runtime
  image: muad-agent-runtime
  port: 8001
  type: ClusterIP
  nodePort: null
  externalTrafficPolicy: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
autoscaling:
  enabled: true
  minReplicas: 8
  maxReplicas: 8
  cpuUtilization: 70
  memoryUtilization: 80
