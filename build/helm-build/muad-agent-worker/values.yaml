global:
  imageRegistry: docker.sangfor.com/mss-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  existingSecret: muad-external
  connectorSecret: muad-connector-external
  artifacts:
    existingClaim: muad-artifacts-rwx
    create: false
    storage: 100Gi
    storageClassName: ''
    mountPath: /mnt/muad-artifacts
  skillCache:
    mountPath: /var/cache/muad/skills
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
serviceAccount:
  create: false
  name: ''
  annotations: {}
service:
  tag: ''
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
  extraEnv: []
  name: muad-agent-worker
  image: muad-agent-worker
  port: 8002
  type: ClusterIP
  nodePort: null
  externalTrafficPolicy: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 4
  cpuUtilization: 70
  memoryUtilization: 80
