apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-console-platform
  labels:
    app: muad-console-platform
    {{- include "muad-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: muad-console-platform
  template:
    metadata:
      labels:
        app: muad-console-platform
        {{- include "muad-platform.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- with (include "muad-platform.serviceAccountName" . | trim) }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "muad-platform.podSecurityContext" . | nindent 8 }}
        {{- with (include "muad-platform.sysctls" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "muad-platform.nodeSelector" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "muad-platform.tolerations" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "muad-platform.affinity" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "muad-platform.image" (dict "root" . "service" .Values.service) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["uvicorn"]
          args:
            - "muad_console_platform.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.service.port }}"
            - "--workers"
            - "{{ .Values.console.workers }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: muad-common
            {{- with (include "muad-platform.extraEnvFrom" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: REDIS_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: INTERNAL_SERVICE_TOKEN
            # 外部 IM 平台验签因子（单键 JSON，按 platform_key 索引；含公钥/issuer/audience/salt
            # 与 identity_keys/identity_field_labels/display_name）。空/缺省 = 未配置外部平台，
            # 行为与接入前一致（仅 WEBCHAT）；未配置该键时容器照常启动，不阻断其它通道。
            # 与 `deploy/k8s/base/console-platform.yaml` 的同名项必须保持一致——两套清单并存，
            # CD 实际部署走 Helm chart。
            - name: EXTERNAL_ASSERTION_PLATFORMS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: EXTERNAL_ASSERTION_PLATFORMS_JSON
                  optional: true
            # 外部断言的最大会话年龄（秒）。上游 token 的 login_time 是登录时刻、随使用不滑动
            # （Redis TTL 续期不重签 JWT），SSE 复核按 login_time + 本值中断会话，因此必须覆盖
            # 一个完整工作日；配 0 等于关闭该闸（只保留上游正数 exp 约束）。
            - name: EXTERNAL_ASSERTION_MAX_SESSION_AGE_SEC
              value: {{ .Values.externalAssertion.maxSessionAgeSec | quote }}
            - name: CONTROL_HTTP_MAX_CONNECTIONS
              value: "32"
            - name: CONTROL_HTTP_MAX_KEEPALIVE
              value: "16"
            - name: MODEL_HTTP_MAX_CONNECTIONS
              value: "256"
            - name: MODEL_HTTP_MAX_KEEPALIVE
              value: "32"
            {{- with .Values.service.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.service.resources | nindent 12 }}
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.global.artifacts.mountPath }}
            - name: workspaces
              mountPath: {{ .Values.global.workspaces.mountPath }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.global.artifacts.existingClaim }}
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ .Values.global.workspaces.existingClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: muad-console-platform
  labels:
    app: muad-console-platform
    {{- include "muad-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  {{- $serviceType := .Values.service.type | default "ClusterIP" }}
  {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app: muad-console-platform
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
