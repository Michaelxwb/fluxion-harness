global:
  imageRegistry: docker.sangfor.com/mss-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  existingSecret: muad-external
  connectorSecret: muad-connector-external
  artifacts:
    existingClaim: muad-artifacts-rwx
    create: false
    storage: 100Gi
    storageClassName: ''
    mountPath: /mnt/muad-artifacts
  skillCache:
    mountPath: /var/cache/muad/skills
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
serviceAccount:
  create: false
  name: ''
  annotations: {}
service:
  tag: ''
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  extraEnv: []
  name: muad-console-platform
  image: muad-console-platform
  port: 8000
  type: ClusterIP
  nodePort: null
  externalTrafficPolicy: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
ingress:
  enabled: true
  className: nginx
  host: ''
  gatewayPort: 8003
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  tls: []
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  cpuUtilization: 70
  memoryUtilization: 80
console:
  workers: 4
