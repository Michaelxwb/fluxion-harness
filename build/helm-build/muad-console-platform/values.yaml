image:
  repository: ''
  tag: ''

global:
  imageRegistry: docker.sangfor.com/mss-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  existingSecret: muad-external
  connectorSecret: muad-connector-external
  artifacts:
    existingClaim: muad-artifacts-rwx
    mountPath: /mnt/muad-artifacts
  workspaces:
    existingClaim: muad-workspaces-rwx
    mountPath: /mnt/muad-workspaces
  skillCache:
    mountPath: /var/cache/muad/skills
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
serviceAccount:
  create: false
  name: ''
  annotations: {}
service:
  tag: ''
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  extraEnv: []
  name: muad-console-platform
  image: muad-console-platform
  port: 8000
  type: ClusterIP
  nodePort: null
  externalTrafficPolicy: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvFrom: []
  sysctls: []
ingress:
  enabled: true
  className: nginx
  host: ''
  gatewayPort: 8003
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  tls: []
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  cpuUtilization: 70
  memoryUtilization: 80
console:
  workers: 4
externalAssertion:
  # 外部断言最大会话年龄（秒）。86400 = 一天，覆盖一个工作日。
  # 上游 login_time 不随使用滑动，设得过小会在用户活跃时被 SSE 复核中断；0 表示关闭该闸。
  maxSessionAgeSec: 86400
