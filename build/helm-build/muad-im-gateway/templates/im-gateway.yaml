apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-im-gateway
  labels:
    app: muad-im-gateway
    {{- include "muad-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: muad-im-gateway
  template:
    metadata:
      labels:
        app: muad-im-gateway
        {{- include "muad-platform.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- with (include "muad-platform.serviceAccountName" . | trim) }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "muad-platform.podSecurityContext" . | nindent 8 }}
        {{- with (include "muad-platform.sysctls" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "muad-platform.nodeSelector" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "muad-platform.tolerations" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "muad-platform.affinity" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "muad-platform.image" (dict "root" . "service" .Values.service) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: muad-common
            {{- with (include "muad-platform.extraEnvFrom" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: REDIS_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: INTERNAL_SERVICE_TOKEN
            # 外部 IM 平台验签因子（单键 JSON，按 platform_key 索引）。Gateway 不持因子做验签
            # （验签只在 Console），但要读它做「该通道是否已配置」的判定与路由挂载，
            # 因此与 Console 共用同一个键。空/缺省 = 未配置外部平台，容器照常启动。
            # 与 `deploy/k8s/base/im-gateway.yaml` 的同名项必须保持一致——CD 实际部署走 Helm chart。
            - name: EXTERNAL_ASSERTION_PLATFORMS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: EXTERNAL_ASSERTION_PLATFORMS_JSON
                  optional: true
            # 断言验签结果缓存的闲置窗口（秒）。与 Console 的
            # EXTERNAL_ASSERTION_CACHE_TTL_SEC 必须同值：Gateway 用它在命中后
            # 续期 TTL（取 min(本值, expires_at - now)），偏差会让两侧判定不一致。
            - name: EXTERNAL_ASSERTION_CACHE_TTL_SEC
              value: {{ .Values.externalAssertion.cacheTtlSec | quote }}
            - name: CONTROL_HTTP_MAX_CONNECTIONS
              value: "32"
            - name: CONTROL_HTTP_MAX_KEEPALIVE
              value: "16"
            - name: STREAM_HTTP_MAX_CONNECTIONS
              value: "1100"
            - name: STREAM_HTTP_MAX_KEEPALIVE
              value: "64"
            - name: UPLOAD_HTTP_MAX_CONNECTIONS
              value: "8"
            - name: UPLOAD_HTTP_MAX_KEEPALIVE
              value: "4"
            - name: EGRESS_HTTP_MAX_CONNECTIONS
              value: "1024"
            - name: EGRESS_HTTP_MAX_KEEPALIVE
              value: "256"
            {{- with .Values.service.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.service.resources | nindent 12 }}
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.global.artifacts.mountPath }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.global.artifacts.existingClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: muad-im-gateway
  labels:
    app: muad-im-gateway
    {{- include "muad-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  {{- $serviceType := .Values.service.type | default "ClusterIP" }}
  {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app: muad-im-gateway
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
