apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-entry-nginx
  labels:
    app: muad-entry-nginx
    {{- include "muad-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: muad-entry-nginx
  template:
    metadata:
      labels:
        app: muad-entry-nginx
        {{- include "muad-platform.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- with (include "muad-platform.serviceAccountName" . | trim) }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "muad-platform.podSecurityContext" . | nindent 8 }}
        {{- with (include "muad-platform.sysctls" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "muad-platform.nodeSelector" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "muad-platform.tolerations" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "muad-platform.affinity" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "muad-platform.image" (dict "root" . "service" .Values.service) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.service.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.port }}
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.port }}
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: muad-entry-nginx
  labels:
    app: muad-entry-nginx
    {{- include "muad-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  {{- $serviceType := .Values.service.type | default "ClusterIP" }}
  {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app: muad-entry-nginx
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
