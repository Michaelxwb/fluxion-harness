global:
  imageRegistry: docker.sangfor.com/mss-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  sysctls: []
serviceAccount:
  create: false
  name: ''
  annotations: {}
service:
  image: muad-nginx
  tag: ''
  port: 8080
  type: NodePort
  nodePort: 30090
  externalTrafficPolicy: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  sysctls: []
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
  cpuUtilization: 70
  memoryUtilization: 80
probes:
  path: /healthz
