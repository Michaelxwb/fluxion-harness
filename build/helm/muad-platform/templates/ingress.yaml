{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muad-webchat
  labels:
    {{- include "muad-platform.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v1/webchat/auth
            pathType: Prefix
            backend:
              service:
                name: muad-console-platform
                port:
                  number: {{ .Values.console.port }}
          - path: /api/v1/webchat
            pathType: Prefix
            backend:
              service:
                name: muad-im-gateway
                port:
                  number: {{ .Values.imGateway.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: muad-console-platform
                port:
                  number: {{ .Values.console.port }}
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: muad-console-platform
                port:
                  number: {{ .Values.console.port }}
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: muad-console-platform
                port:
                  number: {{ .Values.console.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: muad-console-platform
                port:
                  number: {{ .Values.console.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muad-webchat-sse
  labels:
    {{- include "muad-platform.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "45"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "45"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v1/webchat/runs
            pathType: Prefix
            backend:
              service:
                name: muad-im-gateway
                port:
                  number: {{ .Values.imGateway.port }}
{{- end }}
