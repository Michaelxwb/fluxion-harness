codes:
  MEMORY_KEY_INVALID:
    http_status: 400
    messages:
      zh-CN: "记忆标识无效"
      en-US: "Invalid memory key"
  MEMORY_VALUE_INVALID:
    http_status: 400
    messages:
      zh-CN: "记忆内容无效"
      en-US: "Invalid memory value"
  MEMORY_CATEGORY_NOT_ALLOWED:
    http_status: 400
    messages:
      zh-CN: "记忆类别不允许"
      en-US: "Memory category is not allowed"
  MEMORY_QUERY_INVALID:
    http_status: 400
    messages:
      zh-CN: "记忆查询无效"
      en-US: "Invalid memory query"
  MEMORY_LIMIT_INVALID:
    http_status: 400
    messages:
      zh-CN: "记忆数量限制无效"
      en-US: "Invalid memory limit"
  MEMORY_READ_FAILED:
    http_status: 503
    messages:
      zh-CN: "暂时无法读取记忆，请稍后重试"
      en-US: "Memory is temporarily unavailable; try again later"
  MEMORY_QUOTA_EXCEEDED:
    http_status: 409
    messages:
      zh-CN: "记忆额度已满，请清理或申请提高额度"
      en-US: "Memory quota is full; remove entries or request a higher quota"
  MEMORY_FORBIDDEN_CONTENT:
    http_status: 422
    messages:
      zh-CN: "该内容不允许保存为记忆"
      en-US: "This content cannot be saved as memory"
  MEMORY_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: "记忆不存在"
      en-US: "Memory not found"
  MEMORY_VERSION_CONFLICT:
    http_status: 409
    messages:
      zh-CN: "记忆已发生变化，请刷新后重试"
      en-US: "Memory has changed; refresh and try again"
  MEMORY_CONFIRMATION_EXPIRED:
    http_status: 410
    messages:
      zh-CN: "记忆确认已过期，请重新提出候选"
      en-US: "Memory confirmation has expired; submit a new proposal"
  MEMORY_CONFIRMATION_INVALID:
    http_status: 400
    messages:
      zh-CN: "记忆确认无效，请使用展示的确认或拒绝编号"
      en-US: "Invalid memory confirmation; use the displayed confirmation or rejection number"
  MEMORY_CONFIRMATION_PENDING:
    http_status: 409
    messages:
      zh-CN: "当前已有记忆候选等待确认"
      en-US: "A memory proposal is already waiting for confirmation"
  MEMORY_QUOTA_REDUCTION_REQUIRES_MAINTENANCE:
    http_status: 409
    messages:
      zh-CN: "降低记忆额度需要维护窗口并排空在途任务"
      en-US: "Lowering memory quotas requires a maintenance window and drained in-flight work"
  MEMORY_RESULT_BUDGET_EXCEEDED:
    http_status: 422
    messages:
      zh-CN: "记忆结果超过输出预算"
      en-US: "Memory result exceeds the output budget"
  "0":
    http_status: 200
    messages:
      zh-CN: 成功
      en-US: Success

  COMMON_BAD_REQUEST:
    http_status: 400
    messages:
      zh-CN: 请求参数错误
      en-US: Bad request

  COMMON_VALIDATION_ERROR:
    http_status: 422
    messages:
      zh-CN: 请求参数校验失败
      en-US: Request validation failed

  COMMON_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: 请求的资源不存在
      en-US: Resource not found

  COMMON_CONFLICT:
    http_status: 409
    messages:
      zh-CN: 数据已发生变化，请刷新后重试
      en-US: The resource has changed. Refresh and try again.

  COMMON_INTERNAL_ERROR:
    http_status: 500
    messages:
      zh-CN: 系统内部错误
      en-US: Internal server error

  UNAUTHORIZED:
    http_status: 401
    messages:
      zh-CN: 未登录或会话已失效
      en-US: Authentication is required

  FORBIDDEN:
    http_status: 403
    messages:
      zh-CN: 无权执行该操作
      en-US: You do not have permission to perform this action

  INVALID_CREDENTIALS:
    http_status: 401
    messages:
      zh-CN: 用户名或密码错误
      en-US: Invalid username or password

  ACCOUNT_LOCKED:
    http_status: 423
    messages:
      zh-CN: 账号已锁定，请稍后重试
      en-US: The account is locked. Try again later.

  AGENT_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: Agent 不存在
      en-US: Agent not found

  AGENT_DISABLED:
    http_status: 409
    messages:
      zh-CN: Agent 已禁用
      en-US: Agent is disabled

  AGENT_ACCESS_DENIED:
    http_status: 403
    messages:
      zh-CN: 无权使用该 Agent
      en-US: Access to this Agent is denied

  REVISION_CONFLICT:
    http_status: 409
    messages:
      zh-CN: 配置版本已变化，请刷新后重试
      en-US: The configuration revision has changed. Refresh and try again.

  VALIDATION_FAILED:
    http_status: 400
    messages:
      zh-CN: 参数校验失败
      en-US: Request validation failed

  MODEL_NOT_FOUND:
    http_status: 400
    messages:
      zh-CN: 模型不存在或未启用
      en-US: The model does not exist or is disabled

  PLATFORM_SETTINGS_VERSION_CONFLICT:
    http_status: 409
    messages:
      zh-CN: 设置版本已变化，请刷新后重试
      en-US: The settings revision has changed. Refresh and try again.

  PLATFORM_SETTINGS_SECRET_REJECTED:
    http_status: 400
    messages:
      zh-CN: 不允许保存敏感配置项
      en-US: Saving sensitive configuration is not allowed

  PLATFORM_SETTINGS_REVISION_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: 设置版本不存在
      en-US: The settings revision does not exist

  SKILL_PACKAGE_INVALID:
    http_status: 400
    messages:
      zh-CN: Skill 包结构或文件类型不合法
      en-US: The Skill package structure or file types are invalid

  SKILL_VERSION_EXISTS:
    http_status: 409
    messages:
      zh-CN: 该 Skill 版本已存在
      en-US: This Skill version already exists

  MCP_CONFIG_INVALID:
    http_status: 400
    messages:
      zh-CN: MCP 配置错误
      en-US: The MCP configuration is invalid

  BIND_CODE_INVALID:
    http_status: 400
    messages:
      zh-CN: 绑定码无效
      en-US: The bind code is invalid

  BIND_CODE_EXPIRED:
    http_status: 410
    messages:
      zh-CN: 绑定码已过期
      en-US: The bind code has expired

  IDENTITY_ALREADY_BOUND:
    http_status: 409
    messages:
      zh-CN: 该 IM 身份已绑定到其他用户，请先解绑后再使用绑定码
      en-US: This IM identity is already bound to another user. Unbind it before using the code.

  BOT_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: Bot 账号不存在或已禁用
      en-US: The bot account does not exist or is disabled

  # 出站产物交付（attachment-round-trip TASK-006）。文案由**模型转达给用户**，
  # 所以要说清"东西没送到"以及"能不能重试"，不能只给一个冷冰冰的码。
  ARTIFACT_DELIVERY_UNAVAILABLE:
    http_status: 400
    messages:
      zh-CN: 当前会话没有可交付的通道，产物没法发出去
      en-US: This conversation has no delivery channel, so the artifact cannot be sent

  ARTIFACT_DELIVERY_FAILED:
    http_status: 502
    messages:
      zh-CN: 产物交付失败（渠道侧或上传侧），产物已保留，可重试
      en-US: "Delivering the artifact failed (channel or upload side); it is kept and can be retried"

  CREDENTIAL_MISSING:
    http_status: 409
    messages:
      zh-CN: 平台认证尚未配置
      en-US: Platform credentials are not configured

  PLATFORM_ADAPTER_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: 平台适配器不存在
      en-US: Platform adapter not found

  MODEL_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: 模型标识 {key} 已存在
      en-US: Model key {key} already exists

  ACCOUNT_USERNAME_EXISTS:
    http_status: 409
    messages:
      zh-CN: 账号 {username} 已存在
      en-US: Account {username} already exists

  AGENT_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: Agent 标识 {key} 已存在
      en-US: Agent key {key} already exists

  BOT_ID_EXISTS:
    http_status: 409
    messages:
      zh-CN: Bot ID {bot_id} 已被占用
      en-US: Bot ID {bot_id} is already taken

  SKILL_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: Skill 标识 {key} 已存在
      en-US: Skill key {key} already exists

  MCP_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: MCP Server 标识 {key} 已存在
      en-US: MCP server key {key} already exists

  PLATFORM_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: 项目平台标识 {key} 已存在
      en-US: Project platform key {key} already exists

  USER_CODE_EXISTS:
    http_status: 409
    messages:
      zh-CN: 用户编码 {user_code} 已存在
      en-US: User code {user_code} already exists

  IDEMPOTENCY_MISMATCH:
    http_status: 409
    messages:
      zh-CN: 相同幂等键被用于不同的请求内容，请更换幂等键后重试
      en-US: The same idempotency key was used with different request content. Use a new key and retry.

  MODEL_IN_USE:
    http_status: 409
    messages:
      zh-CN: 模型 {model_key} 已被 {agent_count} 个 Agent 引用，无法删除
      en-US: Model {model_key} is referenced by {agent_count} agent(s) and cannot be deleted

  MODEL_DISABLED:
    http_status: 409
    messages:
      zh-CN: 模型已禁用
      en-US: Model is disabled

  MODEL_UNAVAILABLE:
    http_status: 503
    messages:
      zh-CN: 模型服务暂时不可用，请稍后重试
      en-US: The model service is temporarily unavailable

  MODEL_OUTPUT_BUDGET_INVALID:
    http_status: 409
    messages:
      zh-CN: 模型未配置有效的输出预算（max_tokens），请联系管理员补齐后重试
      en-US: The model has no valid output budget (max_tokens). Ask an administrator to configure it.

  SKILL_ARTIFACT_UNAVAILABLE:
    http_status: 503
    messages:
      zh-CN: Skill 制品暂时不可用
      en-US: Skill artifact is temporarily unavailable

  SKILL_ARTIFACT_CHECKSUM_MISMATCH:
    http_status: 500
    messages:
      zh-CN: Skill 制品校验失败
      en-US: Skill artifact checksum verification failed

  MCP_DISCOVERY_FAILED:
    http_status: 502
    messages:
      zh-CN: MCP 工具发现失败
      en-US: MCP tool discovery failed

  RUN_BUSY:
    http_status: 409
    messages:
      zh-CN: 当前会话已有任务执行中，可发送 /stop 停止
      en-US: This conversation already has a running task. Send /stop to cancel.

  NO_ACTIVE_RUN:
    http_status: 404
    messages:
      zh-CN: 当前没有执行中的任务
      en-US: There is no active task to cancel

  # 网关排队积压时的**用户可见**拒绝（RULE-01：不静默丢）。429 只是封套里的状态码，这条文案
  # 实际是发给 IM 用户的：网关被瞬时打满时，让用户知道该重发，而不是以为机器人坏了。
  CHANNEL_BUSY:
    http_status: 429
    messages:
      zh-CN: 当前消息较多，请稍后重发
      en-US: The service is busy right now. Please send your message again shortly.

  UNSUPPORTED_MEDIA:
    http_status: 400
    messages:
      zh-CN: 这条消息的格式暂不支持，请改用文字、图片或文件
      en-US: This message type is not supported yet. Please send text, an image, or a file.

  ATTACHMENT_COUNT_EXCEEDED:
    http_status: 400
    messages:
      zh-CN: 单条消息最多接收 {limit} 个附件，多余的未接收
      en-US: At most {limit} attachments per message are accepted; the extras were skipped.

  ATTACHMENT_TYPE_NOT_ALLOWED:
    http_status: 400
    messages:
      zh-CN: 这个文件类型暂不支持，未接收
      en-US: This file type is not supported and was not accepted.

  ATTACHMENT_TOO_LARGE:
    http_status: 400
    messages:
      zh-CN: 文件超过单个体积上限（{limit} 字节），未接收
      en-US: The file exceeds the per-file limit of {limit} bytes and was not accepted.

  ATTACHMENT_FETCH_FAILED:
    http_status: 502
    messages:
      zh-CN: 附件未能取回，请稍后重发
      en-US: The attachment could not be retrieved. Please try sending it again.

  ATTACHMENT_FETCH_TIMEOUT:
    http_status: 504
    messages:
      zh-CN: 附件取回超时，请稍后重发
      en-US: Retrieving the attachment timed out. Please try again.

  ATTACHMENT_DECRYPT_FAILED:
    http_status: 400
    messages:
      zh-CN: 附件无法解密，未接收
      en-US: The attachment could not be decrypted and was not accepted.

  # 入站回执（attachment-round-trip TASK-004 / RULE-04）：与拒绝反馈**合并为至多一条**。
  # 全收下报数目；部分接收把「收到几个 + 几个没收 + 原因」并进同一条，原因复用上方各码的文案
  # （经 {reason} 注入，**数值仍只有一处来源**）；全拒时只发上方的拒绝说明，不叠加本回执。
  ATTACHMENT_RECEIPT_ALL:
    http_status: 200
    messages:
      zh-CN: 已收到 {count} 个附件
      en-US: Received {count} attachment(s).

  ATTACHMENT_RECEIPT_PARTIAL:
    http_status: 200
    messages:
      zh-CN: 已收到 {accepted} 个附件，{rejected} 个未接收：{reason}
      en-US: "Received {accepted} attachment(s); {rejected} were not accepted: {reason}"

  TOOL_COMPLETION_MODE_INVALID:
    http_status: 422
    messages:
      zh-CN: 该 Skill 不支持所选完成模式
      en-US: This Skill does not support the selected completion mode
  TOOL_OPERATION_CAPACITY_EXCEEDED:
    http_status: 409
    messages:
      zh-CN: 当前 Run 的异步操作额度已满
      en-US: This Run has reached its asynchronous operation limit
  TASK_OPERATION_CANCELLED:
    http_status: 409
    messages:
      zh-CN: 该操作已取消，无法创建任务
      en-US: This operation was cancelled and cannot create a task
  TOOL_RESULT_BINDING_MISMATCH:
    http_status: 403
    messages:
      zh-CN: 任务结果的来源与操作不匹配
      en-US: The task result source does not match the operation
  RUN_CHECKPOINT_INVALID:
    http_status: 500
    messages:
      zh-CN: 等待检查点损坏，无法安全恢复
      en-US: The waiting checkpoint is invalid and cannot be safely resumed

  # Capacity and Webchat messages never interpolate credentials or raw provider errors.
  PLATFORM_SETTINGS_UNAVAILABLE:
    http_status: 503
    messages:
      zh-CN: 当前设置暂时不可用，请稍后重试
      en-US: Current settings are temporarily unavailable. Please try again later.
  CHAT_TOKEN_INVALID:
    http_status: 401
    messages:
      zh-CN: 聊天 Token 无效，请检查后重新输入
      en-US: The chat token is invalid. Check it and try again.
  CHAT_TOKEN_EXPIRED:
    http_status: 401
    messages:
      zh-CN: 聊天 Token 已过期，请联系管理员获取新 Token
      en-US: The chat token has expired. Contact an administrator for a new token.
  CHAT_TOKEN_REVOKED:
    http_status: 401
    messages:
      zh-CN: 聊天 Token 已撤销，请联系管理员获取新 Token
      en-US: The chat token has been revoked. Contact an administrator for a new token.
  CHAT_SESSION_EXPIRED:
    http_status: 401
    messages:
      zh-CN: 聊天登录已过期，请重新输入有效 Token
      en-US: Your chat session has expired. Enter a valid token to continue.
  CHAT_SESSION_REVOKED:
    http_status: 401
    messages:
      zh-CN: 聊天登录已失效，请重新进入聊天
      en-US: Your chat session has been revoked. Enter chat again to continue.
  AUTH_CONTEXT_CHANGED:
    http_status: 409
    messages:
      zh-CN: 当前聊天身份已变化，请重新进入聊天
      en-US: The current chat identity has changed. Enter chat again to continue.
  CHAT_AUTH_RATE_LIMITED:
    http_status: 429
    messages:
      zh-CN: 进入聊天的请求过于频繁，请稍后重试
      en-US: Too many chat authentication requests. Please try again later.
  REQUEST_BODY_TOO_LARGE:
    http_status: 413
    messages:
      zh-CN: 请求内容超过大小限制，请减少内容后重试
      en-US: The request exceeds the size limit. Reduce its content and try again.
  RUN_CAPACITY_EXCEEDED:
    http_status: 429
    messages:
      zh-CN: 当前请求数量已达上限，请等待已有请求完成后再试
      en-US: The active request limit has been reached. Wait for an existing request to finish.
  RUN_QUEUE_TIMEOUT:
    http_status: 408
    messages:
      zh-CN: 本轮请求排队超时，未开始执行
      en-US: This request timed out in the queue before execution started.
  MODEL_CAPACITY_UNAVAILABLE:
    http_status: 503
    messages:
      zh-CN: 当前没有可用的模型资源
      en-US: No model capacity is currently available.
  MODEL_WAIT_TIMEOUT:
    http_status: 504
    messages:
      zh-CN: 等待模型资源超时，本轮请求已停止
      en-US: The model capacity wait timed out. This request has stopped.
  MODEL_CAPACITY_DRAIN_REQUIRED:
    http_status: 409
    messages:
      zh-CN: 请等待现有模型调用结束并核实未确定结果后，再调整容量或归属
      en-US: Wait for existing model calls to finish and resolve unknown outcomes before changing capacity or ownership.
  MODEL_CALL_OUTCOME_UNKNOWN:
    http_status: 409
    messages:
      zh-CN: 模型调用是否结束尚未确认，相关资源仍保留占用，请联系管理员核实
      en-US: Model call completion is unconfirmed. Its capacity remains reserved; contact an administrator.
  MODEL_CREDENTIAL_EXISTS:
    http_status: 409
    messages:
      zh-CN: 已存在相同的模型凭据，请引用已有凭据
      en-US: The model credential already exists. Reference the existing credential.
  MODEL_CREDENTIAL_IN_USE:
    http_status: 409
    messages:
      zh-CN: 模型凭据仍被引用，无法删除
      en-US: The model credential is still referenced and cannot be deleted.
  MODEL_DEPLOYMENT_EXISTS:
    http_status: 409
    messages:
      zh-CN: 已存在相同的模型成员绑定或成员标识
      en-US: This model member binding or member key already exists.
  MODEL_QUOTA_GROUP_EXISTS:
    http_status: 409
    messages:
      zh-CN: 已存在同名额度组，请使用其他标识
      en-US: A quota group with this key already exists. Use another key.
  MODEL_QUOTA_GROUP_IN_USE:
    http_status: 409
    messages:
      zh-CN: 额度组仍被模型凭据引用，无法删除
      en-US: The quota group is still referenced by model credentials and cannot be deleted.
  MODEL_PROVIDER_MISMATCH:
    http_status: 422
    messages:
      zh-CN: 模型与凭据的供方不一致，无法绑定
      en-US: The model and credential providers differ and cannot be bound.
  MODEL_CREDENTIAL_CHANGED:
    http_status: 409
    messages:
      zh-CN: 模型凭据版本已变化，需要重新申请调用资源
      en-US: The model credential revision has changed. A new capacity reservation is required.
  MODEL_CALL_LEASE_LOST:
    http_status: 409
    messages:
      zh-CN: 模型调用租约已失效，当前执行方不能继续提交
      en-US: The model call lease is no longer valid. This executor cannot submit further updates.
  CONVERSATION_MODEL_MISMATCH:
    http_status: 409
    messages:
      zh-CN: 当前模型配置与此会话不兼容，请新建会话
      en-US: The current model configuration is incompatible with this conversation. Start a new conversation.
  CURSOR_EXPIRED:
    http_status: 410
    messages:
      zh-CN: 事件游标已过期，请重新加载会话状态
      en-US: The event cursor has expired. Reload the conversation state.
  CURSOR_AHEAD:
    http_status: 400
    messages:
      zh-CN: 事件游标超出已保存的范围，请重新加载当前状态
      en-US: The event cursor is beyond the persisted range. Reload the current state.
  CURSOR_RUN_MISMATCH:
    http_status: 400
    messages:
      zh-CN: 事件游标与当前请求不匹配，请重新加载会话状态
      en-US: The event cursor does not match this run. Reload the conversation state.
  UPLOAD_EXPIRED:
    http_status: 410
    messages:
      zh-CN: 暂存附件已过期，请重新上传
      en-US: The staged attachment has expired. Upload it again.
  DELIVERY_RECEIPT_EXPIRED:
    http_status: 410
    messages:
      zh-CN: 投递回执已超过保留期限，无法作为新投递重放
      en-US: The delivery receipt has expired and cannot be replayed as a new delivery.
  DELIVERY_LEASE_LOST:
    http_status: 409
    messages:
      zh-CN: 投递租约已失效，当前发送方不能继续确认
      en-US: The delivery lease is no longer valid. This sender cannot acknowledge it.
  EXECUTION_OUTCOME_UNKNOWN:
    http_status: 409
    messages:
      zh-CN: 操作结果尚待核实，已停止自动重试，请联系管理员
      en-US: The operation outcome requires verification. Automatic retries have stopped; contact an administrator.

# Transient IM activity presentation; these are UI templates, not API error codes.
activity_messages:
  PREPARING:
    zh-CN: '🔵 准备中 · 已执行 {elapsed}'
    en-US: '🔵 Preparing · elapsed {elapsed}'
  THINKING:
    zh-CN: '🔵 思考中 · 已执行 {elapsed}'
    en-US: '🔵 Thinking · elapsed {elapsed}'
  EXECUTING:
    zh-CN: '⚙️ 执行中 · 已执行 {elapsed}'
    en-US: '⚙️ Executing · elapsed {elapsed}'
  WAITING_TOOL:
    zh-CN: '⏳ 等待任务结果 · 已执行 {elapsed}'
    en-US: '⏳ Waiting for task result · elapsed {elapsed}'
  WAITING_INPUT:
    zh-CN: '⏸ 等待你的确认 · 已执行 {elapsed}'
