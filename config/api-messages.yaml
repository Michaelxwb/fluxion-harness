codes:
  "0":
    http_status: 200
    messages:
      zh-CN: 成功
      en-US: Success

  COMMON_BAD_REQUEST:
    http_status: 400
    messages:
      zh-CN: 请求参数错误
      en-US: Bad request

  COMMON_VALIDATION_ERROR:
    http_status: 422
    messages:
      zh-CN: 请求参数校验失败
      en-US: Request validation failed

  COMMON_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: 请求的资源不存在
      en-US: Resource not found

  COMMON_CONFLICT:
    http_status: 409
    messages:
      zh-CN: 数据已发生变化，请刷新后重试
      en-US: The resource has changed. Refresh and try again.

  COMMON_INTERNAL_ERROR:
    http_status: 500
    messages:
      zh-CN: 系统内部错误
      en-US: Internal server error

  UNAUTHORIZED:
    http_status: 401
    messages:
      zh-CN: 未登录或会话已失效
      en-US: Authentication is required

  FORBIDDEN:
    http_status: 403
    messages:
      zh-CN: 无权执行该操作
      en-US: You do not have permission to perform this action

  INVALID_CREDENTIALS:
    http_status: 401
    messages:
      zh-CN: 用户名或密码错误
      en-US: Invalid username or password

  ACCOUNT_LOCKED:
    http_status: 423
    messages:
      zh-CN: 账号已锁定，请稍后重试
      en-US: The account is locked. Try again later.

  AGENT_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: Agent 不存在
      en-US: Agent not found

  AGENT_DISABLED:
    http_status: 409
    messages:
      zh-CN: Agent 已禁用
      en-US: Agent is disabled

  AGENT_ACCESS_DENIED:
    http_status: 403
    messages:
      zh-CN: 无权使用该 Agent
      en-US: Access to this Agent is denied

  REVISION_CONFLICT:
    http_status: 409
    messages:
      zh-CN: 配置版本已变化，请刷新后重试
      en-US: The configuration revision has changed. Refresh and try again.

  SKILL_PACKAGE_INVALID:
    http_status: 400
    messages:
      zh-CN: Skill 包结构或文件类型不合法
      en-US: The Skill package structure or file types are invalid

  SKILL_VERSION_EXISTS:
    http_status: 409
    messages:
      zh-CN: 该 Skill 版本已存在
      en-US: This Skill version already exists

  MCP_CONFIG_INVALID:
    http_status: 400
    messages:
      zh-CN: MCP 配置错误
      en-US: The MCP configuration is invalid

  BIND_CODE_INVALID:
    http_status: 400
    messages:
      zh-CN: 绑定码无效
      en-US: The bind code is invalid

  BIND_CODE_EXPIRED:
    http_status: 410
    messages:
      zh-CN: 绑定码已过期
      en-US: The bind code has expired

  IDENTITY_ALREADY_BOUND:
    http_status: 409
    messages:
      zh-CN: 该 IM 身份已绑定到其他用户，请先解绑后再使用绑定码
      en-US: This IM identity is already bound to another user. Unbind it before using the code.

  BOT_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: Bot 账号不存在或已禁用
      en-US: The bot account does not exist or is disabled

  CREDENTIAL_MISSING:
    http_status: 409
    messages:
      zh-CN: 平台认证尚未配置
      en-US: Platform credentials are not configured

  PLATFORM_ADAPTER_NOT_FOUND:
    http_status: 404
    messages:
      zh-CN: 平台适配器不存在
      en-US: Platform adapter not found

  MODEL_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: 模型标识 {key} 已存在
      en-US: Model key {key} already exists

  ACCOUNT_USERNAME_EXISTS:
    http_status: 409
    messages:
      zh-CN: 账号 {username} 已存在
      en-US: Account {username} already exists

  AGENT_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: Agent 标识 {key} 已存在
      en-US: Agent key {key} already exists

  BOT_ID_EXISTS:
    http_status: 409
    messages:
      zh-CN: Bot ID {bot_id} 已被占用
      en-US: Bot ID {bot_id} is already taken

  SKILL_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: Skill 标识 {key} 已存在
      en-US: Skill key {key} already exists

  MCP_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: MCP Server 标识 {key} 已存在
      en-US: MCP server key {key} already exists

  PLATFORM_KEY_EXISTS:
    http_status: 409
    messages:
      zh-CN: 项目平台标识 {key} 已存在
      en-US: Project platform key {key} already exists

  USER_CODE_EXISTS:
    http_status: 409
    messages:
      zh-CN: 用户编码 {user_code} 已存在
      en-US: User code {user_code} already exists

  IDEMPOTENCY_MISMATCH:
    http_status: 409
    messages:
      zh-CN: 相同幂等键被用于不同的请求内容，请更换幂等键后重试
      en-US: The same idempotency key was used with different request content. Use a new key and retry.

  MODEL_IN_USE:
    http_status: 409
    messages:
      zh-CN: 模型 {model_key} 已被 {agent_count} 个 Agent 引用，无法删除
      en-US: Model {model_key} is referenced by {agent_count} agent(s) and cannot be deleted

  MODEL_DISABLED:
    http_status: 409
    messages:
      zh-CN: 模型已禁用
      en-US: Model is disabled

  MODEL_UNAVAILABLE:
    http_status: 503
    messages:
      zh-CN: 模型服务暂时不可用，请稍后重试
      en-US: The model service is temporarily unavailable

  SKILL_ARTIFACT_UNAVAILABLE:
    http_status: 503
    messages:
      zh-CN: Skill 制品暂时不可用
      en-US: Skill artifact is temporarily unavailable

  SKILL_ARTIFACT_CHECKSUM_MISMATCH:
    http_status: 500
    messages:
      zh-CN: Skill 制品校验失败
      en-US: Skill artifact checksum verification failed

  MCP_DISCOVERY_FAILED:
    http_status: 502
    messages:
      zh-CN: MCP 工具发现失败
      en-US: MCP tool discovery failed

  RUN_BUSY:
    http_status: 409
    messages:
      zh-CN: 当前会话已有任务执行中，可发送 /stop 停止
      en-US: This conversation already has a running task. Send /stop to cancel.

  NO_ACTIVE_RUN:
    http_status: 404
    messages:
      zh-CN: 当前没有执行中的任务
      en-US: There is no active task to cancel
