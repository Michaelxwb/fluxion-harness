# 本地一键启动：PostgreSQL + Fluxion 后端（生产模式）
#
# 用法：
#   export FLUXION_MASTER_KEY="$(openssl rand -base64 32)"
#   docker compose -f deploy/docker/docker-compose.yml up --build -d
#   curl http://127.0.0.1:8000/healthz
#
# 说明：
# - fluxion 服务用 deploy/docker/Dockerfile 从仓库根构建（context: ../..）。
# - 生产模式使用 PostgreSQL，FLUXION_DATABASE_URL 指向 postgres 服务。
# - FLUXION_MASTER_KEY 从宿主环境变量注入，不写入文件/仓库；未设置时 compose 直接报错。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxion
      POSTGRES_PASSWORD: fluxion
      POSTGRES_DB: fluxion
    # 如需从宿主机直连数据库可放开；本地演示可注释掉避免端口冲突
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxion -d fluxion"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluxion:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLUXION_ENV: production
      FLUXION_LOG_LEVEL: INFO
      FLUXION_DATABASE_URL: postgresql+asyncpg://fluxion:fluxion@postgres:5432/fluxion
      # 必填：32 字节 AES-256-GCM key 的 base64，生成命令 openssl rand -base64 32
      FLUXION_MASTER_KEY: "${FLUXION_MASTER_KEY:?请先导出 FLUXION_MASTER_KEY，例如 export FLUXION_MASTER_KEY=$(openssl rand -base64 32)}"
    ports:
      - "8000:8000"
    healthcheck:
      # 镜像内无 curl/wget，用 python urllib 探测生产模式的 /healthz
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
