# 本地一键启动：Fluxion 后端三角色（生产模式）
#
# 用法（前置：用户已单独提供外部 PostgreSQL；需要 Redis/L2 缓存时同样外部提供，
# 本 compose 不自动启动任何基础组件）：
#   export FLUXION_SECRET_MASTER_KEY="$(openssl rand -base64 32)"
#   export FLUXION_DATABASE_URL="postgresql+asyncpg://user:pass@host:5432/fluxion"
#   export FLUXION_REDIS_URL="redis://host:6379/0"  # 可选，L2 缓存用；不设即禁用
#   docker compose -f deploy/docker/docker-compose.yml up --build -d
#   docker compose -f deploy/docker/docker-compose.yml up --build -d --scale runtime=3
#   curl http://127.0.0.1:8000/healthz
#
# 说明：
# - 各服务用 deploy/docker/Dockerfile 从仓库根构建（context: ../..），同一镜像，
#   仅 FLUXION_ROLE 不同（api / runtime / worker）。
# - PostgreSQL / Redis 一律由用户作为外部依赖提供，compose 内禁止自带
#   postgres/redis 服务；FLUXION_DATABASE_URL 必填，缺失时 compose 直接报错。
# - FLUXION_SECRET_MASTER_KEY 从宿主环境变量注入，不写入文件/仓库；未设置时 compose 直接报错。
# - api 经 FLUXION_RUNTIME_SERVICE_URL 指向 runtime 服务（compose 内服务名）。

x-fluxion-env: &fluxion-env
  FLUXION_ENV: production
  FLUXION_LOG_LEVEL: INFO
  # 必填：外部 PostgreSQL DSN，例如 postgresql+asyncpg://user:pass@host:5432/fluxion
  FLUXION_DATABASE_URL: "${FLUXION_DATABASE_URL:?请先导出外部 PostgreSQL 的 FLUXION_DATABASE_URL，例如 export FLUXION_DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/fluxion}"
  # 可选：外部 Redis URL（L2 缓存用）；不设即禁用，不影响正确性
  FLUXION_REDIS_URL: "${FLUXION_REDIS_URL:-}"
  # 必填：32 字节 AES-256-GCM key 的 base64，生成命令 openssl rand -base64 32
  FLUXION_SECRET_MASTER_KEY: "${FLUXION_SECRET_MASTER_KEY:?请先导出 FLUXION_SECRET_MASTER_KEY，例如 export FLUXION_SECRET_MASTER_KEY=$(openssl rand -base64 32)}"

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *fluxion-env
      # 单制品：角色由环境决定，此处显式声明便于阅读（entrypoint 默认即 api）。
      FLUXION_ROLE: api
      FLUXION_RUNTIME_SERVICE_URL: http://runtime:8000
    ports:
      - "8000:8000"
    depends_on:
      runtime:
        condition: service_started
    healthcheck:
      # 镜像内无 curl/wget，用 python urllib 探测生产模式的 /healthz
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  runtime:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *fluxion-env
      FLUXION_ROLE: runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *fluxion-env
      FLUXION_ROLE: worker
