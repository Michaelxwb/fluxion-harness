apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fluxion.fullname" . }}-config
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
data:
  FLUXION_ENV: {{ .Values.env.FLUXION_ENV | default "production" | quote }}
  FLUXION_LOG_LEVEL: {{ .Values.env.FLUXION_LOG_LEVEL | default "INFO" | quote }}
  {{- if .Values.s3.enabled }}
  FLUXION_S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  FLUXION_S3_BUCKET: {{ .Values.s3.bucket | quote }}
  FLUXION_S3_REGION: {{ .Values.s3.region | default "us-east-1" | quote }}
  {{- end }}
