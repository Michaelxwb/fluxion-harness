{{- if .Values.dbMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fluxion.fullname" . }}-db-migrate
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
  annotations:
    # pre-install/pre-upgrade：Deployment 滚动前完成 schema 迁移（A13/ADR-004：
    # PG serving schema 由 alembic 管控，迁移先于副本滚动）
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "fluxion.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # alembic env.py 读 FLUXION_DATABASE_URL（经 Secret 注入），cwd=backend
          command: ["alembic", "upgrade", "head"]
          workingDir: /app/backend
          envFrom:
            - configMapRef:
                name: {{ include "fluxion.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "fluxion.fullname" .)) }}
{{- end }}
