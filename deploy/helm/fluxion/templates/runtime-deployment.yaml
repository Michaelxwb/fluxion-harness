{{- if gt (int .Values.runtime.replicaCount) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fluxion.fullname" . }}-runtime
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  selector:
    matchLabels:
      {{- include "fluxion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        {{- include "fluxion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # FEAT-05：独立 Runtime 探针（参数来自 values.runtime.probes，
          # 与应用内 readiness 1s 预算配套发布）。
          livenessProbe:
            httpGet:
              path: {{ .Values.runtime.probes.liveness.path }}
              port: {{ .Values.runtime.probes.liveness.port }}
            periodSeconds: {{ .Values.runtime.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.runtime.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.runtime.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.runtime.probes.readiness.path }}
              port: {{ .Values.runtime.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.runtime.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.runtime.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.runtime.probes.readiness.failureThreshold }}
          {{- if .Values.runtime.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.runtime.startupProbe.path }}
              port: {{ .Values.runtime.startupProbe.port }}
            initialDelaySeconds: {{ .Values.runtime.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.runtime.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.runtime.startupProbe.failureThreshold }}
          {{- end }}
          env:
            # entrypoint 分派：runtime 角色 → fluxion serve --runtime（AgentLoop 独立进程，规则 14）
            - name: FLUXION_ROLE
              value: runtime
          envFrom:
            - configMapRef:
                name: {{ include "fluxion.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "fluxion.fullname" .)) }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
