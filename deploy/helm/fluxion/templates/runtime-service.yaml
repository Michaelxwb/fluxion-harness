apiVersion: v1
kind: Service
metadata:
  name: {{ include "fluxion.fullname" . }}-runtime
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  # FEAT-02：独立 Runtime Service（ClusterIP，仅集群内 API 调用）。
  # runtime.replicaCount=0 时允许无 endpoint（远程请求按 E-01 失败，
  # 不自动选 API Pod）；本 Service 始终渲染，不随 Deployment 条件消失。
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fluxion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
