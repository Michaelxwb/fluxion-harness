{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluxion.fullname" . }}-secret
  labels:
    {{- include "fluxion.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MASTER_KEY：32 字节 AES-256-GCM key 的 base64（openssl rand -base64 32）
  FLUXION_MASTER_KEY: {{ required "secrets.masterKey 必填（生成命令：openssl rand -base64 32）" .Values.secrets.masterKey | quote }}
  # 代码内 Secret Store 实际读取的变量名，保持一致
  FLUXION_SECRET_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  # 数据库 DSN 含账号密码，一并放入 Secret
  FLUXION_DATABASE_URL: {{ include "fluxion.databaseUrl" . | quote }}
{{- end }}
