# Fluxion Harness 默认配置（最小可用）
# 安装前请至少设置 secrets.masterKey（MASTER_KEY），生产环境务必修改数据库密码。

# 副本数（Runtime 无状态，可水平扩缩；此 Deployment 承载 Runtime/Console API
# 生产 bundle：Phase 6 TASK-006 要求 ≥2 副本，S-07/S-10 多副本 Gate）
replicaCount: 2

# fluxion-workflow-worker Deployment（Phase 6 TASK-006）：DBOS 执行进程，
# ≥2 副本分摊 queue；API/Console 进程只做 client 侧 start/signal（rule 13）。
worker:
  replicaCount: 2
  # 生产装配点：Registry 读路径 + sync resolver + active ref + 投影 writer
  bootstrap: "fluxion.runtime.workflow_worker_bootstrap:install_production_worker_bootstrap"
  workerConcurrency: 4

image:
  repository: fluxion-harness/fluxion
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# 非敏感环境变量（进 ConfigMap）
env:
  FLUXION_ENV: production
  FLUXION_LOG_LEVEL: INFO

# DBOS sysdb DSN（Operations 端点 + worker 执行进程）。
# 空 → 由 databaseUrl 推导（去掉 +asyncpg 驱动后缀，指向同一库——sysdb schema=dbos）。
dbosSysdbDsn: ""

# S3/MinIO artifact 生产 provider（Phase 6 TASK-006；enabled=false 时不装配）。
# accessKey/secretKey 进 Secret；endpoint/bucket/region 进 ConfigMap。
s3:
  enabled: false
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: "fluxion-artifacts"
  region: "us-east-1"

# 敏感环境变量（进 Secret）
secrets:
  # FLUXION_MASTER_KEY：32 字节 AES-256-GCM key 的 base64。
  # 生成：openssl rand -base64 32
  # 生产环境请用 helm --set-file 或外部 Secret 管理，不要明文提交到仓库。
  masterKey: ""
  # 若指定 existingSecret，则跳过内置 Secret 创建，Deployment 直接引用该已存在 Secret；
  # 该 Secret 必须包含 FLUXION_MASTER_KEY / FLUXION_SECRET_MASTER_KEY / FLUXION_DATABASE_URL。
  existingSecret: ""

# 数据库连接 DSN（优先级最高）。为空时：若 postgresql.enabled 则用子 chart 自动拼 DSN，
# 否则使用 externalDatabase.url。
databaseUrl: ""

# 外部数据库（postgresql.enabled=false 时使用；本地 OrbStack k8s 用宿主 PG：
# host.internal——见 deploy/README.md 部署示例）
externalDatabase:
  url: "postgresql+asyncpg://fluxion:fluxion@postgres:5432/fluxion"

# 内置 PostgreSQL（bitnami/postgresql 子 chart）。
# review P1-6：默认 false——bitnami OCI 依赖未随仓库存放（Chart.yaml 注释说明，
# 网络受限时无法 dependency build），enabled=true 的默认值渲染出不存在的
# <release>-postgresql Service。需要内置 PG 时：取消 Chart.yaml 依赖注释 →
# helm dependency build → 显式 --set postgresql.enabled=true。
postgresql:
  enabled: false
  auth:
    username: fluxion
    password: fluxion      # 生产环境务必修改
    database: fluxion
  primary:
    persistence:
      enabled: true
      size: 8Gi

# 健康检查端点（后端生产模式暴露 /healthz 与 /readyz）
probes:
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# 资源配置（按需调整）
resources: {}
#   requests:
#     cpu: 100m
#     memory: 128Mi
#   limits:
#     cpu: 500m
#     memory: 512Mi

# 容器安全上下文（示例：若镜像以非 root 运行则开启 runAsNonRoot）
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: []
