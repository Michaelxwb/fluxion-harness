apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-agent-runtime
  namespace: muad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muad-agent-runtime
  template:
    metadata:
      labels:
        app: muad-agent-runtime
    spec:
      # 非 root 运行：与镜像内 UID/GID 10001 对齐；fsGroup 让 artifacts PVC 对该组可写
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          # 必须带 ghcr 前缀：裸名会被当 Docker Hub 的 docker.io/library/… 去拉，
          # 而 `:latest` 默认 imagePullPolicy=Always ⇒ ImagePullBackOff。
          image: ghcr.io/michaelxwb/muad-agent-runtime:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: muad-common
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
          volumeMounts:
            - name: artifacts
              mountPath: /mnt/muad-artifacts
            - name: skill-cache
              mountPath: /var/cache/muad/skills
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: muad-artifacts-rwx
        - name: skill-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: muad-agent-runtime
  namespace: muad
spec:
  selector:
    app: muad-agent-runtime
  ports:
    - port: 8001
      targetPort: 8001
