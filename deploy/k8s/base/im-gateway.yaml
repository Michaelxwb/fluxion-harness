apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-im-gateway
  namespace: muad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muad-im-gateway
  template:
    metadata:
      labels:
        app: muad-im-gateway
    spec:
      containers:
        - name: app
          image: muad-im-gateway:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: muad-common
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: muad-im-gateway
  namespace: muad
spec:
  selector:
    app: muad-im-gateway
  ports:
    - port: 8003
      targetPort: 8003
