apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-im-gateway
  namespace: muad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muad-im-gateway
  template:
    metadata:
      labels:
        app: muad-im-gateway
    spec:
      # 非 root 运行：与镜像内 UID/GID 10001 对齐；fsGroup 让 artifacts PVC 对该组可写
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          # 必须带 ghcr 前缀：裸名会被当 Docker Hub 的 docker.io/library/… 去拉，
          # 而 `:latest` 默认 imagePullPolicy=Always ⇒ ImagePullBackOff。
          image: ghcr.io/michaelxwb/muad-im-gateway:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: muad-common
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: REDIS_URL
          # 附件字节要落进共享 artifact store，Runtime 才能按 storage_key 读到（AD-1-B）。
          # 只注入 ARTIFACT_ROOT 环境变量是不够的——路径没挂载时网关会写进容器临时盘并"成功"。
          volumeMounts:
            - name: artifacts
              mountPath: /mnt/muad-artifacts
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: muad-artifacts-rwx

---
apiVersion: v1
kind: Service
metadata:
  name: muad-im-gateway
  namespace: muad
spec:
  selector:
    app: muad-im-gateway
  ports:
    - port: 8003
      targetPort: 8003
