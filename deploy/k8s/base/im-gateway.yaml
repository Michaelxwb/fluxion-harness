apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-im-gateway
  namespace: muad
spec:
  # Gateway 是**请求面**（design §4.1：N 副本、无 sticky session）：2 个副本让滚动更新/
  # 单 Pod 故障期间 WebChat 仍可服务；请求带真实副本间重连（S-06）在 with-connector overlay
  # 的同拓扑上验证。单 Pod 出站池按目标并发定容，上界 = egress×副本数（预检核算）。
  replicas: 2
  selector:
    matchLabels:
      app: muad-im-gateway
  template:
    metadata:
      labels:
        app: muad-im-gateway
    spec:
      # 排空预算（design §4.1/§4.2）：readiness 先停新受理/领取，再有界等待并关闭订阅；
      # 已受理状态留在 PG。终止宽限起始 60 秒（§3.7）。Gateway 无状态、可多副本；
      # 长连接（企微 WS）在独立 Connector 角色里，不在请求面。
      terminationGracePeriodSeconds: 60
      # 非 root 运行：与镜像内 UID/GID 10001 对齐；fsGroup 让 artifacts PVC 对该组可写
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          # 必须带 ghcr 前缀：裸名会被当 Docker Hub 的 docker.io/library/… 去拉，
          # 而 `:latest` 默认 imagePullPolicy=Always ⇒ ImagePullBackOff。
          image: ghcr.io/michaelxwb/muad-im-gateway:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: muad-common
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: REDIS_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: muad-external
                  key: INTERNAL_SERVICE_TOKEN
            # —— 分池 HTTP 连接预算（每进程；池名与 GATEWAY_HTTP_POOLS 一致）——
            # 只声明本进程真实创建的池：control（Console 短控制/认证/设置）、
            # stream（Runtime 持久事件流）、upload（webchat 受信登记）、
            # egress（Runtime 历史/资源/交付/产物解析）。Gateway 不调用模型与 MCP，
            # 不写 model/mcp 池（写了就是「不生效的键」）。
            - name: CONTROL_HTTP_MAX_CONNECTIONS
              value: "32"
            - name: CONTROL_HTTP_MAX_KEEPALIVE
              value: "16"
            - name: STREAM_HTTP_MAX_CONNECTIONS
              value: "1100"
            - name: STREAM_HTTP_MAX_KEEPALIVE
              value: "64"
            - name: UPLOAD_HTTP_MAX_CONNECTIONS
              value: "8"
            - name: UPLOAD_HTTP_MAX_KEEPALIVE
              value: "4"
            # 业务出站池按目标并发定容：单 Pod 承载 1000 用户时，每个用户建会话/提交消息
            # 各占一条 Gateway→Runtime 连接（池小于用户数 = 排队 5s 后 500）。
            - name: EGRESS_HTTP_MAX_CONNECTIONS
              value: "1024"
            - name: EGRESS_HTTP_MAX_KEEPALIVE
              value: "256"
          # 资源声明与容量 profile 的 resources.hardware.im-gateway 一致
          # （tests/capacity/profiles/agent-capacity-webchat.example.yml）。
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # 附件字节要落进共享 artifact store，Runtime 才能按 storage_key 读到（AD-1-B）。
          # 只注入 ARTIFACT_ROOT 环境变量是不够的——路径没挂载时网关会写进容器临时盘并"成功"。
          volumeMounts:
            - name: artifacts
              mountPath: /mnt/muad-artifacts
          # readiness 接 /readyz（api-kit 的依赖就绪口径，依赖缺失回 503）；
          # liveness 仍接 /healthz（存活，不因依赖抖动重启 Pod）。
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8003
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8003
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: muad-artifacts-rwx

---
apiVersion: v1
kind: Service
metadata:
  name: muad-im-gateway
  namespace: muad
spec:
  selector:
    app: muad-im-gateway
  ports:
    - port: 8003
      targetPort: 8003
