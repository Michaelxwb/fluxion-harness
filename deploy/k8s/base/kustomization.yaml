apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 注意：`secret.example.yaml` **不在** resources 里 —— 它是模板（值是 CHANGE_ME），
# 真实 Secret 由部署方用 `kubectl create secret generic` 或外部密钥管理生成，键名见该文件。
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc-artifacts.yaml
  - migrate-job.yaml
  - console-platform.yaml
  - agent-runtime.yaml
  - agent-worker.yaml
  - im-gateway.yaml
