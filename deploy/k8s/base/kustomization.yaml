apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 注意：`secret.example.yaml` **不在** resources 里 —— 它是模板（值是 CHANGE_ME），
# 真实 Secret 由部署方用 `kubectl create secret generic` 或外部密钥管理生成，键名见该文件。
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc-artifacts.yaml
  - migrate-job.yaml
  - console-platform.yaml
  - agent-runtime.yaml
  - agent-worker.yaml
  - im-gateway.yaml
  # 同源入口代理（TASK-102）：认证面→Console、其余聊天 API→Gateway、/chat 与静态→Console。
  # 没被收集 = `kubectl apply -k deploy/k8s/base` 不会创建入口（TASK-102 延后项）。
  - ingress.yaml
  # Runtime/Worker 的 HPA 副本上界（TASK-103）：Console 固定 1 Pod、Gateway 固定 2 Pod，不在此声明；
  # maxReplicas 与容量 profile 的 typed max_replica_counts 一致（PG/下游预算按上界核算）。
  - capacity-autoscaling.yaml
