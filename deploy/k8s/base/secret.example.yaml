# Secret **模板**（不含真实凭据）：集群里请用 `kubectl create secret generic` 或外部密钥管理生成。
# 四个 Deployment 与迁移 Job 都从它取键；键名改动要同步改各清单。
apiVersion: v1
kind: Secret
metadata:
  name: muad-external
  namespace: muad
type: Opaque
stringData:
  # PostgreSQL：异步驱动 DSN（应用与 alembic 共用同一口径）
  DATABASE_URL: postgresql+asyncpg://muad:CHANGE_ME@postgres:5432/muad
  # Redis：去重、任务唤醒、租约等共享状态
  REDIS_URL: redis://redis:6379/0
  # 服务身份：四个单元互相调用内部端点时必须带 `X-Internal-Service: <该值>`。
  # 缺它时 Runtime/Worker/Gateway → Console 的内部调用会被拒（401/403），
  # 表现为"服务都起来了但什么都跑不动"。请用足够随机的值。
  INTERNAL_SERVICE_TOKEN: CHANGE_ME
  # 外部 IM 平台验签因子（单键 JSON，按 platform_key 索引）。空串/不配置 = 未启用外部平台，
  # 行为与接入前一致（仅 WEBCHAT）。Secret 与 Gateway 共用此键，两侧判定必须同源。
  #
  # 每平台字段：
  #   display_name           展示名（Console 下拉/横幅用）
  #   issuer / audience      断言 JWT 的 iss / aud 校验值
  #   public_key             验签公钥（PEM；生产由需求方提供，勿提交真实值）
  #   salt                   派生绑定时 sprinkle 用（勿提交真实值）
  #   identity_keys          该平台的稳定身份键集合（录入弹窗按它动态渲染字段）
  #   identity_field_labels  identity_keys → 中文标签（缺失回退 claim 名）
  #   cache_ttl_sec          认证缓存该平台条目的 TTL（可选，缺省取全局默认）
  # 示例（占位值，切勿直接用于生产）：
  EXTERNAL_ASSERTION_PLATFORMS_JSON: >-
    {"mssw": {"display_name": "MSSW 智能客服", "issuer": "CHANGE_ME", "audience": "CHANGE_ME",
    "public_key": "-----BEGIN PUBLIC KEY-----\nCHANGE_ME\n-----END PUBLIC KEY-----",
    "salt": "CHANGE_ME", "identity_keys": ["expert_id", "tenant_id"],
    "identity_field_labels": {"expert_id": "专家 ID", "tenant_id": "租户 ID"}}}
