# Secret **模板**（不含真实凭据）：集群里请用 `kubectl create secret generic` 或外部密钥管理生成。
# 四个 Deployment 与迁移 Job 都从它取键；键名改动要同步改各清单。
apiVersion: v1
kind: Secret
metadata:
  name: muad-external
  namespace: muad
type: Opaque
stringData:
  # PostgreSQL：异步驱动 DSN（应用与 alembic 共用同一口径）
  DATABASE_URL: postgresql+asyncpg://muad:CHANGE_ME@postgres:5432/muad
  # Redis：去重、任务唤醒、租约等共享状态
  REDIS_URL: redis://redis:6379/0
  # 服务身份：四个单元互相调用内部端点时必须带 `X-Internal-Service: <该值>`。
  # 缺它时 Runtime/Worker/Gateway → Console 的内部调用会被拒（401/403），
  # 表现为"服务都起来了但什么都跑不动"。请用足够随机的值。
  INTERNAL_SERVICE_TOKEN: CHANGE_ME
