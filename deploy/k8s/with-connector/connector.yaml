apiVersion: apps/v1
kind: Deployment
metadata:
  name: muad-connector
  namespace: muad
  labels:
    app: muad-connector
    muad.io/role: im-gateway-connector
spec:
  # 有状态运行时角色（im-gateway 的 Connector）：bot 连接所有权由 Redis lease 决定，
  # 2 副本时每个 bot 只有一个 owner，另一个待命接管（滚动更新/崩溃不中断全部 bot）。
  replicas: 2
  selector:
    matchLabels:
      app: muad-connector
  template:
    metadata:
      labels:
        app: muad-connector
    spec:
      # 排空预算：先停 lease 续租并断开长连接，再由新 owner 接管（lease TTL 内完成）。
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/michaelxwb/muad-im-connector:latest
          ports:
            - name: metrics
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: muad-common
          env:
            # **只挂自身 secret**：没有 DATABASE_URL（Connector 不持库），也不含任何渠道
            # 连接凭据（bot secret 由 Console 快照下发到本进程，不经过 Gateway）。
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: muad-connector-external
                  key: REDIS_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: muad-connector-external
                  key: INTERNAL_SERVICE_TOKEN
            - name: CONNECTOR_HANDLED_CHANNELS
              value: "WECOM"
            - name: CONNECTOR_LEASE_TTL_SEC
              value: "30"
            - name: CONNECTOR_LEASE_RENEW_SEC
              value: "10"
            - name: CONNECTOR_INBOUND_SHARDS
              value: "32"
            # 生产必须为 0：非 0 只用于验收在 XADD 前制造真实崩溃点。
            - name: CONNECTOR_TEST_PAUSE_BEFORE_XADD_SEC
              value: "0"
            # 快照节拍：与 Gateway 同源（typed 默认 30s），清单显式声明便于预检核对。
            - name: BOT_SNAPSHOT_POLL_SEC
              value: "30"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # 媒体/产物字节要落进共享 artifact store（与 Gateway/Runtime 同一个 RWX 卷）。
            - name: artifacts
              mountPath: /mnt/muad-artifacts
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8004
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8004
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: muad-artifacts-rwx

---
# 探针/指标是运维面：ClusterIP Service 不构成公开入口（Ingress 不指向它）。
apiVersion: v1
kind: Service
metadata:
  name: muad-connector
  namespace: muad
spec:
  selector:
    app: muad-connector
  ports:
    - name: metrics
      port: 8004
      targetPort: 8004

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: muad-connector
  namespace: muad
spec:
  # 有状态 bot 连接：允许一次有界中断，接管由 lease 完成；不能把全部 Connector 一起驱逐。
  maxUnavailable: 1
  selector:
    matchLabels:
      app: muad-connector
