apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 启用企微（5 单元）overlay：base 的四单元 + 独立 Connector（im-gateway 的有状态运行时角色）。
#   kubectl apply -k deploy/k8s/with-connector
#   uv run python scripts/check_agent_capacity_deployment.py \
#     --base deploy/k8s/with-connector \
#     --profile tests/capacity/profiles/agent-capacity-webchat-connector.example.yml
# 默认部署（WebChat-only、4 单元）不包含本 overlay。
# `secret-connector.example.yaml` **不在** resources 里：它是模板（值是 CHANGE_ME），
# 真实 Secret 由部署方 `kubectl create secret generic` 生成（见该文件的注释）。
#
# 只有 `resources`（没有 patches）：预检在无 kustomize 的环境里走**收集展开**，也能验证本
# overlay —— Gateway 多副本与远程通道开关已在 base 里声明，本 overlay 只多一个 Connector。
resources:
  - ../base
  - connector.yaml
