# Connector 专属 Secret **模板**（不含真实凭据）。
# "只挂自身 secret"：Connector 不持库，因此**没有** DATABASE_URL；渠道连接凭据（bot secret）
# 由 Console 的 bot 快照下发，不进任何 Deployment 的环境变量。
#
#   kubectl -n muad create secret generic muad-connector-external \
#     --from-literal=REDIS_URL='redis://redis:6379/0' \
#     --from-literal=INTERNAL_SERVICE_TOKEN='<与其余运行时角色一致的值>'
apiVersion: v1
kind: Secret
metadata:
  name: muad-connector-external
  namespace: muad
type: Opaque
stringData:
  REDIS_URL: redis://redis:6379/0
  INTERNAL_SERVICE_TOKEN: CHANGE_ME
