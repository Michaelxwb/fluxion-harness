<text x="420.0" y="79" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">本轮执行</text>
</g>
<line data-lifeline="A" x1="420" y1="90" x2="420" y2="540" stroke="#6B8199" stroke-width="1.5"/>
