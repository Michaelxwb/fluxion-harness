<text x="595" y="396" font-size="15" font-weight="500" text-anchor="middle" style="fill:#3D8585">11 显示绑定成功</text>
<text x="46" y="432" font-size="14" font-weight="400" text-anchor="start" style="fill:#536B81">管理员在 Console 为服务经理生成一次性绑定码；服务经理在企微发送后完成身份映射。</text>
