<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title">
<title id="title">逻辑分层</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#20344B}path,polyline{stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1200" height="680" fill="#FFFFFF"/>
<rect x="30" y="30" width="920" height="90" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="46" y="57" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">1 用户入口</text>
<text x="46" y="85" font-size="14" font-weight="400" text-anchor="start" style="fill:#64798D">发送消息、接收结果</text>
<rect x="30" y="140" width="920" height="110" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="46" y="167" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">2 接入层</text>
<text x="46" y="195" font-size="14" font-weight="400" text-anchor="start" style="fill:#64798D">连接、身份与消息转交</text>
<rect x="30" y="275" width="920" height="110" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="46" y="302" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">3 执行层</text>
<text x="46" y="330" font-size="14" font-weight="400" text-anchor="start" style="fill:#64798D">对话与后台任务</text>
<rect x="30" y="410" width="920" height="110" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="46" y="437" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">4 能力层</text>
<text x="46" y="465" font-size="14" font-weight="400" text-anchor="start" style="fill:#64798D">执行时按需调用</text>
<rect x="30" y="545" width="920" height="110" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="46" y="572" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">5 数据层</text>
<text x="46" y="600" font-size="14" font-weight="400" text-anchor="start" style="fill:#64798D">各层按职责读写</text>
<g data-node="wecom"><rect x="220" y="50" width="190" height="60" rx="8" fill="#F4F6F9" stroke="#CBD3DE" stroke-width="1.5"/>
<text x="315.0" y="86.0" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">企业微信</text>
</g>
<g data-node="webchat"><rect x="500" y="50" width="200" height="60" rx="8" fill="#F4F6F9" stroke="#CBD3DE" stroke-width="1.5"/>
<text x="600.0" y="86.0" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">WebChat</text>
</g>
<g data-node="connector"><rect x="220" y="170" width="190" height="65" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="315.0" y="197" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">IM Connector</text>
<text x="315.0" y="219" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">维护企微长连接</text>
</g>
<g data-node="gateway"><rect x="500" y="170" width="200" height="65" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="600.0" y="197" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">IM Gateway</text>
<text x="600.0" y="219" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">识别用户、转交请求</text>
</g>
<g data-node="runtime"><rect x="500" y="305" width="200" height="65" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="600.0" y="332" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">Agent Runtime</text>
<text x="600.0" y="354" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">处理本轮对话</text>
</g>
<g data-node="worker"><rect x="790" y="305" width="155" height="65" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="867.5" y="332" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">Agent Worker</text>
<text x="867.5" y="354" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">后台、定时、批量</text>
</g>
<g data-node="tools"><rect x="220" y="445" width="215" height="65" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="327.5" y="472" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">Skill / MCP 工具</text>
<text x="327.5" y="494" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">完成具体业务操作</text>
</g>
<g data-node="models"><rect x="500" y="445" width="200" height="65" rx="8" fill="#F4F6F9" stroke="#CBD3DE" stroke-width="1.5"/>
<text x="600.0" y="472" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">模型网关（外部）</text>
<text x="600.0" y="494" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">统一接入、脱敏与还原</text>
</g>
<g data-node="platforms"><rect x="750" y="445" width="195" height="65" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="847.5" y="472" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">平台接入与登录</text>
<text x="847.5" y="494" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">凭据复用、Session 管理</text>
</g>
<g data-node="postgres"><rect x="220" y="580" width="215" height="60" rx="8" fill="#F2F7F6" stroke="#BAD6CE" stroke-width="1.5"/>
<text x="327.5" y="607" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">PostgreSQL</text>
<text x="327.5" y="629" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">配置、会话、执行记录</text>
</g>
<g data-node="redis"><rect x="500" y="580" width="200" height="60" rx="8" fill="#F2F7F6" stroke="#BAD6CE" stroke-width="1.5"/>
<text x="600.0" y="607" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">Redis</text>
<text x="600.0" y="629" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">缓存、消息流、短租约</text>
</g>
<g data-node="files"><rect x="750" y="580" width="195" height="60" rx="8" fill="#F2F7F6" stroke="#BAD6CE" stroke-width="1.5"/>
<text x="847.5" y="607" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">共享文件</text>
<text x="847.5" y="629" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">技能包、附件、工作区</text>
</g>
<g data-node="admin"><rect x="995" y="50" width="160" height="60" rx="8" fill="#F4F6F9" stroke="#CBD3DE" stroke-width="1.5"/>
<text x="1075.0" y="86.0" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">管理员</text>
</g>
<rect x="975" y="140" width="195" height="515" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="991" y="167" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">管理与配置</text>
<g data-node="console"><rect x="995" y="185" width="160" height="90" rx="8" fill="#EFF6FC" stroke="#B7D1E5" stroke-width="1.5"/>
<text x="1075.0" y="212" font-size="19" font-weight="600" text-anchor="middle" style="fill:#20344B">Console</text>
<text x="1075.0" y="234" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">Agent / 授权 / 模型</text>
<text x="1075.0" y="253" font-size="14" font-weight="400" text-anchor="middle" style="fill:#536B81">凭据 / 运行记录</text>
</g>
<text x="993" y="330" font-size="14" font-weight="400" text-anchor="start" style="fill:#536B81">提供定义与授权</text>
<text x="993" y="360" font-size="14" font-weight="400" text-anchor="start" style="fill:#536B81">管理模型和凭据</text>
<text x="993" y="390" font-size="14" font-weight="400" text-anchor="start" style="fill:#536B81">查询执行与审计</text>
<text x="993" y="465" font-size="14" font-weight="400" text-anchor="start" style="fill:#536B81">通过内部接口供</text>
<text x="993" y="490" font-size="14" font-weight="400" text-anchor="start" style="fill:#536B81">接入层、执行层使用</text>
<polyline points="315,110 315,170" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="600,110 600,170" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="410,202 500,202" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="434.0" y="175" width="42.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="455" y="190" font-size="15" font-weight="500" text-anchor="middle" style="fill:#447DA5">消息</text>
<polyline points="600,235 600,305" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="611.0" y="260" width="72.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="647" y="275" font-size="15" font-weight="500" text-anchor="middle" style="fill:#447DA5">发起请求</text>
<polyline points="700,325 790,325" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="709.0" y="298" width="72.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="745" y="313" font-size="15" font-weight="500" text-anchor="middle" style="fill:#447DA5">后台任务</text>
<polyline points="790,350 700,350" fill="none" stroke="#3D8585" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="709.0" y="358" width="72.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="745" y="373" font-size="15" font-weight="500" text-anchor="middle" style="fill:#3D8585">结果回流</text>
<polyline points="867,305 867,202 700,202" fill="none" stroke="#7A8798" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="768.0" y="175" width="72.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="804" y="190" font-size="15" font-weight="500" text-anchor="middle" style="fill:#7A8798">独立通知</text>
<polyline points="600,370 600,410" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="614.0" y="388" width="72.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="650" y="403" font-size="15" font-weight="500" text-anchor="middle" style="fill:#447DA5">按需调用</text>
<polyline points="867,370 867,410" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="1075,110 1075,185" fill="none" stroke="#447DA5" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
