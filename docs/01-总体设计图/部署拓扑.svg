<polyline points="555,275 555,200" fill="none" stroke="#7A8798" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="581.5" y="225" width="57.0" height="20" rx="4" fill="#FFFFFF"/>
<text x="610" y="240" font-size="15" font-weight="500" text-anchor="middle" style="fill:#7A8798">事件流</text>
<rect x="245" y="480" width="925" height="250" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="261" y="507" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">由环境提供的存储与数据服务</text>
