<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title">
<title id="title">部署拓扑</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#20344B}path,polyline{stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1200" height="750" fill="#FFFFFF"/>
<rect x="245" y="35" width="925" height="435" rx="12" fill="#FBFCFE" stroke="#DCE4EC" stroke-width="1.4"/>
<text x="261" y="62" font-size="16" font-weight="600" text-anchor="start" style="fill:#4B637C">Kubernetes 集群 · 入口代理与业务工作负载</text>
