let current='overview',currentRole='Builder';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tag(v){const s=String(v);let c='';if(/启用|已成功|已投递|校验通过|低|是/.test(s))c='ok';else if(/停用|失败|高/.test(s))c='red';else if(/等待|草稿|未发布|中|待投递/.test(s))c='warn';else if(/Builder|Admin/.test(s))c='blue';return `<span class="tag ${c}">${esc(v)}</span>`}
function visibleItems(){return menuGroups.flatMap(g=>g.items.filter(i=>i.roles.includes(currentRole)))}
function renderNav(){document.getElementById('nav').innerHTML=menuGroups.map(g=>{const items=g.items.filter(i=>i.roles.includes(currentRole));if(!items.length)return '';return `<div class="nav-group">${g.label}</div>${items.map(i=>`<button class="nav-item ${current===i.key?'active':''} ${i.planned?'planned':''}" onclick="go('${i.key}')">${i.label}</button>`).join('')}`}).join('')}
function labelOf(k){for(const g of menuGroups)for(const i of g.items)if(i.key===k)return i.label;return k}
function go(k){if(!visibleItems().some(i=>i.key===k)){toast('当前角色无此菜单权限');return}current=k;location.hash=k;render()}
function render(){renderNav();document.getElementById('breadcrumb').textContent='Console / '+labelOf(current);if(current==='overview')renderOverview();else if(current==='knowledge')renderKnowledgePlanned();else renderList(current)}
function renderOverview(){document.getElementById('content').innerHTML=`

<div class="stats"><div class="card stat"><span class="muted">已启用服务</span><b>2</b><span class="muted">仅 Service 需要发布</span></div><div class="card stat"><span class="muted">智能体</span><b>3</b><span class="muted">配置保存后立即生效</span></div><div class="card stat"><span class="muted">项目平台</span><b>2</b><span class="muted">业务平台；每个平台一套用户认证模板</span></div><div class="card stat"><span class="muted">今日执行</span><b>47</b><span class="muted">执行与投递状态分离</span></div></div>
<div class="grid2"><div class="card section"><h3>核心配置关系</h3><div class="timeline"><div class="event"><b>项目平台</b><span class="muted">Console/DB 业务对象，表示 MSS/CRM 等外部业务平台；与部署级 Project Integration 分离。V1 每个平台一套用户认证字段模板。</span></div><div class="event"><b>用户</b><span class="muted">按“用户 × 项目平台”配置唯一账号；不同项目可分别配置。</span></div><div class="event"><b>Skill 与能力</b><span class="muted">Skill 在 PyCharm 等 IDE 中使用 Python 开发，通过 fluxion_skill_sdk 调 Capability。依赖能力来自 skill.yaml，Console 只读展示；归属平台只是文本标签。</span></div><div class="event"><b>智能体</b><span class="muted">创建基本信息后，分别绑定能力 / Skill / 知识库 / 可调用服务，并直接配置企业微信机器人和用户授权。</span></div><div class="event"><b>服务</b><span class="muted">创建时必须绑定一个主智能体；Service 才具有草稿、校验和发布生命周期。</span></div></div></div>
<div class="card section"><h3>${currentRole==='Builder'?'Builder 可见范围':'Admin 可见范围'}</h3>${currentRole==='Builder'?'<p>Builder 负责服务、智能体、能力、Skill、模型、项目平台等开发配置，并可以查看执行记录用于调试。</p><p class="muted">不显示“用户”菜单；不能执行正式服务发布和用户授权。</p>':'<p>Admin 在 Builder 资源基础上增加用户、授权和正式发布能力，可查看全部执行记录。</p><p class="muted">End User 不访问 Console，只通过已授权智能体的 IM/WebChat 入口使用服务。</p>'}<button class="btn" onclick="showRoleMatrix()">查看权限矩阵</button></div></div>`}

function renderList(k){const p=pages[k];const canAdd=p.add && !(k==='users'&&currentRole!=='Admin');const addLabel=k==='skills'?'导入 Skill':`新增${p.title}`;const addBtn=canAdd?`<button class="btn primary" onclick="openAdd('${k}')">+ ${addLabel}</button>`:'';document.getElementById('content').innerHTML=`

<div class="pagination">${p.columns.includes('更新时间')?`<span class="muted" style="margin-right:auto">时间格式：YYYY-MM-DD HH:mm:ss</span>`:''}<span class="muted">共 ${p.rows.length} 条</span><button class="pager active">1</button><button class="pager">2</button><select class="control" style="min-width:94px"><option>10 条/页</option><option selected>20 条/页</option><option>50 条/页</option><option>100 条/页</option></select></div></div>`}
function rowsHtml(k,rows){const p=pages[k];return rows.map((r,i)=>`<tr>${p.columns.map((c,ci)=>`<td>${/状态|风险|幂等|草稿|校验/.test(c)?tag(r[ci]):esc(r[ci]??'—')}</td>`).join('')}<td><div class="row-actions"><button class="btn link" onclick="openDetail('${k}',${i})">详情</button>${k==='executions'||k==='skills'?'':`<button class="btn link" onclick="openEdit('${k}',${i})">编辑</button>`}${k==='users'?`<button class="btn link" onclick="openUserGrant(${i})">授权智能体</button>`:''}${k==='skills'?`<button class="btn link" onclick="openSkillImport(${i})">导入新版本</button>`:''}</div></td></tr>`).join('')}
function filterRows(k){const q=document.getElementById('searchBox').value.toLowerCase();document.getElementById('tbody').innerHTML=rowsHtml(k,pages[k].rows.filter(r=>r.join(' ').toLowerCase().includes(q)))}
function openAdd(k){if(k==='capabilities')return openCapabilityForm('add',0);if(k==='skills')return openSkillImport(null);openGenericForm(k,'add',0)}
function openEdit(k,idx){if(k==='agents')return openAgentDetail(idx);if(k==='services')return openServiceDetail(idx);if(k==='integrations')return openIntegrationDetail(idx);if(k==='users')return openUserDetail(idx);if(k==='capabilities')return openCapabilityForm('edit',idx);if(k==='skills')return openSkillDetail(idx);if(k==='executions')return openExecution(idx);openGenericForm(k,'edit',idx)}
function detailValue(p,r,name){if(name==='API 密钥')return '••••••••（不回显）';const v=rowValueForField(p,r,name);return v!==''?v:'—'}
function openDetail(k,idx){if(k==='agents')return openAgentDetail(idx,'detail');if(k==='services')return openServiceDetail(idx,'detail');if(k==='integrations')return openIntegrationDetail(idx,'detail');if(k==='users')return openUserDetail(idx,'detail');if(k==='executions')return openExecution(idx);if(k==='skills')return openSkillDetail(idx);const p=pages[k],r=p.rows[idx];const html=`<div class="kv">${p.fields.filter(x=>x.where.includes('详情')).map(x=>`<div>${esc(x.name)}</div><div>${esc(detailValue(p,r,x.name))}</div>`).join('')}</div>`;showDrawer(`${p.title}详情`,html,`<button class="btn" onclick="closeLayer()">关闭</button>${k!=='executions'?`<button class="btn primary" onclick="closeLayer();openEdit('${k}',${idx})">编辑</button>`:''}`)}
function rowValueForField(p,row,name){let i=p.columns.indexOf(name);if(i>=0)return row[i]??'';const aliases={'Skill 文件':'文件名','请求超时时间（秒）':'请求超时时间'};if(aliases[name]){i=p.columns.indexOf(aliases[name]);if(i>=0)return row[i]??''}return ''}
function openGenericForm(k,mode,idx){const p=pages[k];if(!p.add||typeof p.add==='string'){toast('该页面使用专用交互');return}const row=p.rows[idx]||[];const body=`<div class="form-grid">${p.add.map(d=>fieldHtml(d,mode,p.editLock.includes(d.name),rowValueForField(p,row,d.name))).join('')}</div>`;showModal(`${mode==='add'?'新增':'编辑'}${p.title}`,body,`<button class="btn" onclick="closeLayer()">取消</button><button class="btn primary" onclick="saveMock('${p.title}','${mode}')">${mode==='add'?'创建':'保存'}</button>`)}
function fieldHtml(d,mode,locked,val){const disabled=mode==='edit'&&locked;let c='';if(d.type==='textarea')c=`<textarea ${disabled?'disabled class="readonly"':''}>${mode==='edit'?esc(val||''):''}</textarea>`;else if(d.type==='select')c=`<select ${disabled?'disabled class="readonly"':''}>${String(d.options||'').split('|').map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;else if(d.type==='file')c=`<input type="file" accept="${esc(d.options||'')}" ${disabled?'disabled class="readonly"':''}>`;else c=`<input type="${d.type}" ${disabled?'disabled class="readonly"':''} value="${mode==='edit'&&d.type!=='password'?esc(val||''):''}">`;return `<div class="field ${d.type==='textarea'?'full':''}"><label>${esc(d.name)} ${d.required?'<span class="req">*</span>':''}</label>${c}${d.help?`<div class="help">${esc(d.help)}</div>`:''}${disabled?'<div class="help">创建后不可修改</div>':''}</div>`}
function timeFormatNote(){return '所有时间字段统一展示为 YYYY-MM-DD HH:mm:ss，例如 2026-09-10 22:15:00。'}
function showFieldMatrix(k){const p=pages[k];const rows=p.fields.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.where)}</td><td>${x.required?'<span class="required">是</span>':'否'}</td><td>${x.editable?'是':'否 / 只读'}</td><td>${esc(x.meaning)}</td></tr>`).join('');showDrawer(`${p.title}字段说明`,`<table class="field-list"><thead><tr><th>字段</th><th>出现位置</th><th>必填</th><th>可修改</th><th>字段含义</th></tr></thead><tbody>${rows}</tbody></table>`,`<button class="btn" onclick="closeLayer()">关闭</button>`)}

function agentBasicHtml(r,editable){const dis=editable?'':'disabled';return `<div class="form-grid"><div class="field"><label>智能体名称 <span class="req">*</span></label><input ${dis} value="${esc(r[0])}"></div><div class="field"><label>智能体标识</label><input disabled class="readonly" value="${esc(r[1])}"><div class="help">创建后不可修改</div></div><div class="field"><label>模型配置 <span class="req">*</span></label><select ${dis}><option>${esc(r[2])}</option><option>GPT-5.6 Sol</option></select><div class="help">V1 一个智能体只使用一个模型；保存后新的请求立即生效。</div></div><div class="field"><label>记忆策略 <span class="req">*</span></label><select ${dis}><option>仅会话记忆</option><option>关闭</option><option>会话记忆 + 用户长期记忆</option></select></div><div class="field full"><label>智能体说明</label><textarea ${dis}>负责 MSS 服务相关的查询、分析和任务执行。</textarea></div><div class="field full"><label>系统提示词 <span class="req">*</span></label><textarea ${dis}>你是 MSS 服务助手。根据用户目标选择已授权能力和服务，并遵守业务范围与写操作确认规则。</textarea></div></div>`}
function agentTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');const body=document.getElementById('agentTabBody');if(t==='cap')body.innerHTML=bindingHtml('已绑定能力','+ 绑定能力',[['查询客户','customer.get'],['查询设备','device.list'],['发送通知','notify.send']],'能力从“能力”列表选择，绑定关系在这里维护，不在智能体新增弹窗输入。');if(t==='skill')body.innerHTML=agentSkillBindingHtml();if(t==='knowledge')body.innerHTML=`<div class="empty">知识库接入方式尚未冻结。当前智能体可以保留“知识库”页签占位，但不产生 API/DB 设计。</div>`;if(t==='service')body.innerHTML=bindingHtml('允许调用的其他服务','+ 绑定可调用服务',[['漏洞扫描','vuln-scan'],['月度报告','monthly-report']],'这是智能体运行时可以主动发起的其他业务服务白名单，与“服务创建时绑定执行智能体”是两个不同方向的关系。');if(t==='channel')body.innerHTML=channelHtml();if(t==='user')body.innerHTML=agentUserGrantHtml()}
function bindingHtml(title,btn,items,note){return `<div class="subtoolbar"><b>${title}</b><button class="btn primary" onclick="toast('打开资源选择弹窗（原型）')">${btn}</button></div><div class="info">${note}</div><table class="mini-table"><thead><tr><th>名称</th><th>标识</th><th>操作</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><button class="btn link danger" onclick="toast('已解除绑定（原型）')">解除绑定</button></td></tr>`).join('')}</tbody></table>`}
function agentSkillBindingHtml(){return `<div class="subtoolbar"><b>已绑定 Skill</b><button class="btn primary" onclick="toast('打开已导入且校验通过的 Skill 选择弹窗（原型）')">+ 绑定 Skill</button></div><div class="info"><b>关系规则：</b>Agent 只绑定 Skill 本身。Skill 内部依赖能力来自当前 Artifact 的 skill.yaml，只供 Skill Runtime 通过 SDK 调用，不会自动暴露成 Agent 的 LLM Tool。</div><table class="mini-table"><thead><tr><th>Skill</th><th>归属平台</th><th>SDK</th><th>内部依赖能力</th><th>校验</th><th>操作</th></tr></thead><tbody><tr><td>策略异常分析<br><span class="muted">policy-analysis</span></td><td>MSS<br><span class="muted">仅识别标签</span></td><td>1.x</td><td>3 个<br><span class="muted">只读 manifest</span></td><td>${tag('校验通过')}</td><td><button class="btn link danger" onclick="toast('已解除 Skill 绑定（原型）')">解除绑定</button></td></tr><tr><td>客户经营分析<br><span class="muted">customer-analysis</span></td><td>MSS<br><span class="muted">仅识别标签</span></td><td>1.x</td><td>2 个<br><span class="muted">只读 manifest</span></td><td>${tag('校验通过')}</td><td><button class="btn link danger" onclick="toast('已解除 Skill 绑定（原型）')">解除绑定</button></td></tr></tbody></table><div class="callout">Agent 的“直接能力”才进入 LLM Tool 列表。Skill 内部能力是 Skill 的执行依赖，避免 Agent 绕过 Skill SOP 直接调用。</div>`}
function channelHtml(){return `<div class="info">IM 在产品上直接配置于智能体。底层由 Channel Gateway 统一维持企业微信 WebSocket 长连接并按 bot_id 路由；V1 一个智能体最多一个企微机器人，一个 bot_id 全局只绑定一个智能体。/bind 只做外部身份映射，用户还必须拥有当前智能体授权。</div><div class="subtoolbar"><b>企业微信机器人</b><button class="btn primary" onclick="openWecomChannel()">配置企业微信机器人</button><button class="btn" onclick="toast('WebChat 接入字段后续设计')">WebChat（规划）</button></div><table class="mini-table"><thead><tr><th>渠道</th><th>机器人标识</th><th>连接方式</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>企业微信</td><td>bot_mss_prod</td><td>WebSocket</td><td>${tag('启用')}</td><td><button class="btn link" onclick="openWecomChannel(true)">编辑</button> <button class="btn link danger" onclick="toast('IM 接入已停用（原型）')">停用</button></td></tr></tbody></table><div class="panel" style="margin-top:14px"><div class="panel-title"><b>IM 内置命令</b><span class="muted">Runtime 固定能力，V1 不按 Agent 单独配置</span></div><table class="mini-table"><thead><tr><th>命令</th><th>作用</th><th>关键规则</th></tr></thead><tbody><tr><td><code>/bind &lt;code&gt;</code></td><td>绑定 IM 身份</td><td>把企业微信用户映射到平台用户；不等同于智能体授权。</td></tr><tr><td><code>/skills</code></td><td>查看当前智能体可用 Skill</td><td>只展示当前 Agent 已绑定且启用的 Skill，按“归属平台”文本标签分组。</td></tr><tr><td><code>/new</code></td><td>创建新会话</td><td>结束当前会话上下文并创建新 Session；不改变用户、Agent、Skill 和 IM 绑定。</td></tr><tr><td><code>/stop</code></td><td>停止当前执行</td><td>取消当前会话正在运行的 Run；不删除会话、不解绑资源。</td></tr></tbody></table><div class="right" style="margin-top:10px"><button class="btn" onclick="previewSkillsCommand()">预览 /skills</button></div><div class="footnote">后续可以扩展 /help、/skills &lt;归属平台&gt; 等，但 V1 先固定命令语义，避免不同 IM 渠道各自实现一套。</div></div>`}

function serviceBasicHtml(r,editable){return `<div class="grid2"><div class="panel"><div class="panel-title"><b>基本信息</b></div><div class="form-grid"><div class="field"><label>服务名称 *</label><input ${editable?'':'disabled'} value="${esc(r[0])}"></div><div class="field"><label>服务标识</label><input disabled class="readonly" value="${esc(r[1])}"></div><div class="field"><label>绑定智能体 *</label><select ${editable?'':'disabled'}><option>${esc(r[2])}</option><option>MSS 服务助手</option><option>安全执行助手</option><option>报告助手</option></select><div class="help">V1 服务必须绑定一个主智能体。</div></div><div class="field"><label>执行方式 *</label><select ${editable?'':'disabled'}><option>${esc(r[3])}</option><option>智能体自主</option><option>固定流程</option><option>混合执行</option></select></div><div class="field full"><label>服务说明 *</label><textarea ${editable?'':'disabled'}>为目标业务对象执行检查、分析并生成结果。</textarea></div></div></div><div class="panel"><div class="panel-title"><b>生命周期</b></div><div class="kv"><div>当前发布版本</div><div>${esc(r[4])}</div><div>草稿状态</div><div>${esc(r[5])}</div><div>启用状态</div><div>${esc(r[6])}</div><div>最近更新时间</div><div>${esc(r[7])}</div></div><div class="callout">只有 Service 有草稿 / 校验 / 发布。智能体、模型、能力等配置保存后直接生效。</div></div></div>`}
function serviceTab(btn,t,idx,mode){

    body.innerHTML=`<div class="subtoolbar"><div><b>执行步骤</b><div class="help">按顺序描述服务执行阶段。详情模式只读；编辑模式可以新增、编辑和删除步骤。</div></div>${editable?`<button class="btn primary" onclick="openServiceStep(${idx})">+ 新增步骤</button>`:''}</div>

    <div class="field"><label>业务对象类型 *</label><input ${editable?'':'disabled'} value="设备"></div>
    <div class="field"><label>对象标识参数 *</label><input ${editable?'':'disabled'} value="device_id"><div class="help">调用服务时用于定位业务对象的输入字段。</div></div>

    ${editable?'<div class="right" style="margin-top:12px"><button class="btn primary" onclick="toast(\'业务范围已保存到服务草稿（原型）\')">保存业务范围</button></div>':''}`;return
  }
  if(t==='release'){
    const publishBtn=currentRole==='Admin'&&editable?'<button class="btn primary" onclick="publishService()">发布当前草稿</button>':'';
    body.innerHTML=`<div class="grid2"><div class="panel"><div class="panel-title"><b>草稿校验与测试</b></div><div class="kv"><div>当前发布版本</div><div>${esc(r[4])}</div><div>草稿状态</div><div>${esc(r[5])}</div><div>最近更新时间</div><div>${esc(r[7])}</div></div>${editable?`<div class="right" style="margin-top:12px"><button class="btn" onclick="toast('服务草稿校验通过（原型）')">校验草稿</button><button class="btn" onclick="openServiceTest(${idx})">运行测试</button></div>`:''}</div>

function renderPaginationDetail(){const enabled=document.getElementById('paginationEnabled')?.value==='是';const wrap=document.getElementById('paginationDetail');if(!wrap)return;if(!enabled){wrap.innerHTML=`<div class="empty" style="padding:20px">当前能力按单次请求返回结果，不执行自动翻页。</div>`;return}const type=document.getElementById('paginationType')?.value||'页码分页';let request='';if(type==='页码分页')request=`<div class="field"><label>页码参数 <span class="req">*</span></label><input value="page"><div class="help">请求中表示当前页码的参数名。</div></div><div class="field"><label>每页数量参数 <span class="req">*</span></label><input value="page_size"><div class="help">请求中表示每页数量的参数名。</div></div><div class="field"><label>起始页 <span class="req">*</span></label><input type="number" value="1"></div><div class="field"><label>每页数量 <span class="req">*</span></label><input type="number" value="100"><div class="help">应不超过下游接口允许的单页最大值。</div></div>`;else if(type==='Offset / Limit')request=`<div class="field"><label>Offset 参数 <span class="req">*</span></label><input value="offset"></div><div class="field"><label>Limit 参数 <span class="req">*</span></label><input value="limit"></div><div class="field"><label>起始 Offset <span class="req">*</span></label><input type="number" value="0"></div><div class="field"><label>每页数量 <span class="req">*</span></label><input type="number" value="100"></div>`;else request=`<div class="field"><label>Cursor 参数 <span class="req">*</span></label><input value="cursor"><div class="help">请求下一页时携带的游标参数名。</div></div><div class="field"><label>每页数量参数</label><input value="page_size"></div><div class="field"><label>每页数量</label><input type="number" value="100"></div><div class="field"><label>下一游标路径 <span class="req">*</span></label><input value="data.next_cursor"><div class="help">为空或 null 时结束。</div></div>`;const termination=type==='Cursor'?`<div class="info"><b>Cursor 结束规则：</b>根据“下一游标路径”判断；下一游标为空/null 时结束。仍受最大页数、最大数据量和最大总耗时保护。</div>`:`<div class="panel"><div class="panel-title"><b>分页结束策略</b><span class="muted">未知总量时必须有明确兜底</span></div><label style="display:block;margin:7px 0"><input type="checkbox" checked disabled> 当前页列表为空时结束（固定兜底）</label><label style="display:block;margin:7px 0"><input type="checkbox" checked> 当前页返回条数小于“每页数量”时提前结束</label><label style="display:block;margin:7px 0"><input type="checkbox"> 如果填写总数路径，累计获取数量达到 total 时结束</label><label style="display:block;margin:7px 0"><input type="checkbox"> 使用“是否还有下一页”字段判断</label><div class="form-grid" style="margin-top:10px"><div class="field"><label>是否还有下一页路径</label><input placeholder="例如：data.has_more"><div class="help">仅开启对应结束策略时填写；false 表示结束。</div></div></div></div>`;wrap.innerHTML=`<div class="callout"><b>执行语义：</b>Agent 只发起一次逻辑能力调用。Capability Executor 在内部连续拉取各页；Skill 不写 for/while 分页脚本，LLM 也不逐页思考和调用。</div><div class="panel"><div class="panel-title"><b>请求分页参数</b><span class="muted">${type}</span></div><div class="form-grid">${request}</div></div><div class="panel"><div class="panel-title"><b>响应解析</b></div><div class="form-grid"><div class="field"><label>数据列表路径 <span class="req">*</span></label><input value="data.items"><div class="help">从每页响应中提取列表，例如 data.items。</div></div><div class="field"><label>总数路径</label><input placeholder="例如：data.total"><div class="help">可选。总量未知或接口不返回 total 时留空。</div></div></div></div>${termination}<div class="panel"><div class="panel-title"><b>安全限制</b><span class="muted">任何结束策略都必须同时受硬限制保护</span></div><div class="form-grid"><div class="field"><label>最大页数 <span class="req">*</span></label><input type="number" value="200"><div class="help">达到后停止并标记分页超限，防止异常接口无限返回。</div></div><div class="field"><label>最大数据量 <span class="req">*</span></label><input type="number" value="20000"><div class="help">累计列表项达到上限时停止继续获取。</div></div><div class="field"><label>最大总执行时间（毫秒） <span class="req">*</span></label><input type="number" value="120000"></div><div class="field"><label>重复页检测 <span class="req">*</span></label><select><option>启用</option><option>停用</option></select><div class="help">连续页面内容完全相同时视为分页异常，避免服务忽略 page 参数导致死循环。</div></div></div></div><div class="info"><b>推荐结束优先级：</b>明确 next_cursor / has_more → total → 返回条数不足一页 → 空列表兜底。Page / Offset 模式始终保留“空列表结束”兜底。</div>`}
function capHelp(type){return {'平台服务（注册发现）':'这是唯一与“项目平台”关联的能力类型。平台服务能力属于一个确定项目平台；即使底层服务/接口相同，另一个项目平台使用时也新建一条能力，保持认证、语义和风险边界独立。平台列表接口可在下方配置自动分页。','HTTP 接口':'与项目平台无关。若接口需要认证，使用系统统一认证，所有用户共享，不读取用户在 MSS 等项目平台上的账号。HTTP 列表接口同样可以配置自动分页。','MCP 工具':'与项目平台无关。若 MCP Server 需要认证，使用系统统一认证。工具参数仍由上面的输入参数定义约束。','沙箱命令':'与项目平台无关，不存在用户项目认证。只执行白名单入口，工作目录、网络和环境变量显式受控。'}[type]}

  if(t==='validation'){body.innerHTML=`<div class="grid2"><div class="panel"><div class="panel-title"><b>导入校验</b></div><div class="kv"><div>Manifest Schema</div><div>${tag('校验通过')}</div><div>SDK 兼容性</div><div>${tag('校验通过')}</div><div>入口文件</div><div>${tag('校验通过')}</div><div>Capability 依赖</div><div>${tag('校验通过')}</div><div>基础 Secret 扫描</div><div>${tag('校验通过')}</div></div></div><div class="panel"><div class="panel-title"><b>本地开发契约</b></div><div class="kv"><div>SDK</div><div>fluxion_skill_sdk ${esc(r[3])}</div><div>单元测试</div><div>MockSkillContext</div><div>真实联调</div><div>SDK → HTTP Dev Capability Gateway</div><div>生产执行</div><div>同一 Skill 代码，无需修改</div></div></div></div>`;return}
