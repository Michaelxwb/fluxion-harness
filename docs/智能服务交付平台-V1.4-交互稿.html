.schedule-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:44px;
  row-gap:0;
  margin-top:8px;
}
.schedule-field{
  display:grid;
  grid-template-columns:110px minmax(0,1fr);
  align-items:center;
  min-height:44px;
  border-bottom:1px solid #f0f1f3;
}
.schedule-label{
  color:#667085;
  font-size:13px;
}
.schedule-value{
  color:#1d2939;
  font-size:13px;
  min-width:0;
  word-break:break-word;
}
.simple-history-list{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  margin-top:10px;
}
.history-row{
  display:grid;
  grid-template-columns:1.45fr 1.05fr 1.05fr 90px;
  gap:20px;
  align-items:center;
  min-height:46px;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.history-row:last-child{
  border-bottom:none;
}
.history-head{
  min-height:40px;
  background:#fafafa;
  color:#667085;
  font-weight:600;
}
@media (max-width: 900px){
  .schedule-info-grid{
    grid-template-columns:1fr;
    column-gap:0;
  }
  .history-row{
    grid-template-columns:1.3fr 1fr 90px;
  }
  .history-row > span:nth-child(3){
    display:none;
  }
}


.agent-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:44px;
  margin-top:8px;
}
.agent-field{
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  align-items:center;
  min-height:44px;
  border-bottom:1px solid #f0f1f3;
}
.agent-label{
  color:#667085;
  font-size:13px;
}
.agent-value{
  color:#1d2939;
  font-size:13px;
  min-width:0;
  word-break:break-word;
}
.agent-config-grid{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:16px;
  margin-top:10px;
}
.agent-model-card,
.agent-instruction-card{
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  background:#fff;
}
.agent-model-name{
  font-size:16px;
  font-weight:600;
  margin-top:10px;
  color:#1d2939;
}
.agent-instruction-text{
  margin-top:10px;
  line-height:1.7;
  color:#344054;
  white-space:pre-wrap;
}
.simple-run-list{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  margin-top:10px;
}
.run-row{
  display:grid;
  grid-template-columns:1.3fr .8fr .9fr 1.4fr 80px;
  gap:16px;
  align-items:center;
  min-height:46px;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.run-row:last-child{
  border-bottom:none;
}
.run-head{
  min-height:40px;
  background:#fafafa;
  color:#667085;
  font-weight:600;
}
@media (max-width: 900px){
  .agent-info-grid{
    grid-template-columns:1fr;
    column-gap:0;
  }
  .agent-config-grid{
    grid-template-columns:1fr;
  }
  .run-row{
    grid-template-columns:1.2fr .8fr 1fr 80px;
  }
  .run-row > span:nth-child(4){
    display:none;
  }
}


.skill-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:44px;
  margin-top:8px;
}
.skill-field{
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  align-items:center;
  min-height:44px;
  border-bottom:1px solid #f0f1f3;
}
.skill-label{
  color:#667085;
  font-size:13px;
}
.skill-value{
  color:#1d2939;
  font-size:13px;
  min-width:0;
  word-break:break-word;
}
.skill-desc-block{
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  align-items:start;
  margin-top:14px;
}
.skill-description{
  color:#344054;
  line-height:1.65;
  font-size:13px;
}
.skill-version-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 44px;
  margin-top:8px;
}
.skill-summary-item{
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  align-items:center;
  min-height:42px;
  border-bottom:1px solid #f0f1f3;
  font-size:13px;
}
.skill-summary-item span{
  color:#667085;
}
.skill-summary-item b{
  font-weight:500;
  color:#1d2939;
}
.skill-md-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.skill-md-preview{
  margin-top:10px;
  max-height:190px;
  overflow:hidden;
  position:relative;
}
.skill-md-preview:after{
  content:'';
  position:absolute;
  left:0;right:0;bottom:0;
  height:42px;
  background:linear-gradient(to bottom,rgba(15,23,42,0),rgba(15,23,42,.94));
  pointer-events:none;
}
.simple-version-list,
.simple-agent-list,
.simple-gray-list{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  margin-top:10px;
}
.version-row{
  display:grid;
  grid-template-columns:.65fr .8fr .8fr 1.15fr 1.15fr .65fr .6fr;
  gap:14px;
  align-items:center;
  min-height:46px;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.skill-agent-row{
  display:grid;
  grid-template-columns:1.2fr 1.2fr .7fr 1.1fr .6fr;
  gap:14px;
  align-items:center;
  min-height:46px;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.gray-row{
  display:grid;
  grid-template-columns:1fr 1fr 1.2fr .6fr;
  gap:14px;
  align-items:center;
  min-height:46px;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.version-row:last-child,
.skill-agent-row:last-child,
.gray-row:last-child{
  border-bottom:none;
}
.version-head,
.skill-agent-head,
.gray-head{
  min-height:40px;
  background:#fafafa;
  color:#667085;
  font-weight:600;
}
@media (max-width: 900px){
  .skill-info-grid,
  .skill-version-summary{
    grid-template-columns:1fr;
    column-gap:0;
  }
  .version-row{
    grid-template-columns:1fr 1fr 1fr .7fr;
  }
  .version-row > span:nth-child(4),
  .version-row > span:nth-child(5),
  .version-row > span:nth-child(6){
    display:none;
  }
  .skill-agent-row{
    grid-template-columns:1.2fr 1fr .7fr;
  }
  .skill-agent-row > span:nth-child(4),
  .skill-agent-row > span:nth-child(5){
    display:none;
  }
}


.mcp-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:44px;
  margin-top:8px;
}
.mcp-field{
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  align-items:center;
  min-height:44px;
  border-bottom:1px solid #f0f1f3;
}
.mcp-label{
  color:#667085;
  font-size:13px;
}
.mcp-value{
  color:#1d2939;
  font-size:13px;
  min-width:0;
  word-break:break-word;
}
.mcp-full-field{
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  align-items:start;
  margin-top:14px;
}
.mcp-tool-summary{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  margin-top:10px;
}
.mcp-tool-summary-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:20px;
  align-items:center;
  padding:12px 14px;
  border-bottom:1px solid var(--line);

function openImChannelConfig(agentId,channelId=''){

function saveImChannel(agentId,channelId=''){
 const botId=$('#botId').value.trim(),name=$('#imName').value.trim();
 if(!botId||!name)return toast('请填写通道名称和 bot_id');
 const a=S.agents.find(x=>x.id===agentId); a.channels=a.channels||[];
 if(channelId){const c=a.channels.find(x=>x.id===channelId);c.name=name;c.botId=botId;c.status='CONNECTED'}
 else a.channels.push({id:'im-'+Date.now(),type:$('#imType').value,name,botId,status:'CONNECTED'});
 closeModal();openAgent(agentId,'im');toast('IM 通道已保存')
}
function removeImChannel(agentId,channelId){
 const a=S.agents.find(x=>x.id===agentId);a.channels=(a.channels||[]).filter(x=>x.id!==channelId);openAgent(agentId,'im');toast('IM 通道已移除')
}

 return `<div class="card"><div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="openModelCreate()">＋ 新增模型</button><button class="btn" onclick="batchTestModels()" ${selectedCount?'':'disabled'}>批量测试${selectedCount?`（${selectedCount}）`:''}</button></div><div class="toolbar-right"><input id="modelSearch" class="input search" placeholder="名称 / 标识 / Base URL / 模型 ID"><button class="btn" onclick="toast('已刷新')">↻ 刷新</button></div></div><div class="table-wrap"><table><thead><tr><th style="width:42px"><input type="checkbox" ${allChecked?'checked':''} onchange="toggleAllModels(this.checked)"></th><th>名称</th><th>标识</th><th>协议</th><th>Base URL</th><th>模型 ID</th><th>启用状态</th><th>测试状态</th><th>修订版本</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${S.models.map(m=>`<tr><td><input type="checkbox" ${modelSelected.has(m.id)?'checked':''} onchange="toggleModelSelected('${m.id}',this.checked)"></td><td><span class="row-link" onclick="openModelDetail('${m.id}')">${m.name}</span></td><td class="mono">${m.key}</td><td>${tag('OpenAI','blue')}</td><td class="mono">${m.baseUrl}</td><td class="mono">${m.modelId}</td><td>${m.enabled?statusTag('ENABLED'):statusTag('DISABLED')}</td><td>${modelTestTag(m.testStatus)}</td><td>r${m.revision}</td><td>${m.updated}</td><td><button class="btn ghost" onclick="openModelEdit('${m.id}')">编辑</button></td></tr>`).join('')}</tbody></table></div>${pagination(S.models.length,1,10,'void')}</div>`
}

function openModelCreate(){
 openModelForm()
}

function modelTestTag(s){
 if(s==='AVAILABLE')return tag('通过','green');
 if(s==='FAILED')return tag('失败','red');
 if(s==='TESTING')return tag('测试中','orange');
 return tag('未测试','gray')
}


function openModelForm(id=''){
 const editing=!!id;const m=editing?S.models.find(x=>x.id===id):{name:'',key:'',protocol:'OPENAI',baseUrl:'',modelId:'',apiKeySet:false,enabled:true,revision:1};
 openModal(editing?'编辑模型':'新增模型',`<div class="form-grid">
   <div class="form-item"><label class="req">名称</label><input id="modelName" value="${m.name||''}" placeholder="例如：Qwen3-235B"></div>
   <div class="form-item"><label class="req">标识</label><input id="modelKey" value="${m.key||''}" placeholder="例如：qwen3-235b"></div>
   <div class="form-item"><label class="req">协议</label><input value="OpenAI" readonly><div class="help">当前版本仅支持 OpenAI 兼容协议。</div></div>
   <div class="form-item"><label class="req">模型 ID</label><input id="modelId" value="${m.modelId||''}" placeholder="例如：qwen3-235b-a22b"></div>
   <div class="form-item full"><label class="req">Base URL</label><input id="modelBaseUrl" value="${m.baseUrl||''}" placeholder="例如：http://model-gateway.internal/v1"><div class="help">填写 OpenAI 兼容接口 Base URL，不填写 /chat/completions。</div></div>
   <div class="form-item full"><label>API Key</label><input id="modelApiKey" type="password" placeholder="${editing&&m.apiKeySet?'已配置；留空表示保持不变':'可选；如网关要求认证则填写'}"><div class="help">API Key 不在列表或详情中回显。</div></div>
   <div class="form-item"><label>启用状态</label><select id="modelEnabled"><option value="true" ${m.enabled?'selected':''}>启用</option><option value="false" ${!m.enabled?'selected':''}>禁用</option></select></div>
 </div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveModel('${id}')">保存</button>`)
}

function openModelEdit(id){
 openModelForm(id)
}


function saveModel(id=''){
 const name=$('#modelName').value.trim(),key=$('#modelKey').value.trim(),baseUrl=$('#modelBaseUrl').value.trim(),modelId=$('#modelId').value.trim(),apiKey=$('#modelApiKey').value,enabled=$('#modelEnabled').value==='true';
 if(!name||!key||!baseUrl||!modelId)return toast('请填写名称、标识、Base URL 和模型 ID');
 if(!/^https?:\/\//i.test(baseUrl))return toast('Base URL 必须以 http:// 或 https:// 开头');
 if(S.models.some(x=>x.id!==id&&x.key===key))return toast('标识已存在');
 if(id){const m=S.models.find(x=>x.id===id);m.name=name;m.key=key;m.protocol='OPENAI';m.baseUrl=baseUrl.replace(/\/+$/,'');m.modelId=modelId;if(apiKey.trim())m.apiKeySet=true;m.enabled=enabled;m.testStatus='UNTESTED';m.revision=(m.revision||0)+1;m.updated='2026-09-17 16:01:00';closeModal();render();toast('模型已更新，建议重新批量测试')}
 else{S.models.unshift({id:'m-'+Date.now(),name,key,protocol:'OPENAI',baseUrl:baseUrl.replace(/\/+$/,''),modelId,apiKeySet:!!apiKey.trim(),enabled,testStatus:'UNTESTED',revision:1,updated:'2026-09-17 16:01:00'});closeModal();render();toast('模型已创建，请选择后执行批量测试')}
}

function toggleModelSelected(id,checked){
 if(checked)modelSelected.add(id); else modelSelected.delete(id);
 render()
}

function toggleAllModels(checked){
 if(checked)S.models.forEach(m=>modelSelected.add(m.id));
 else modelSelected.clear();
 render()
}


function batchTestModels(){
 const selected=S.models.filter(m=>modelSelected.has(m.id));if(!selected.length)return toast('请先选择需要测试的模型');selected.forEach(m=>m.testStatus='TESTING');render();selected.forEach(m=>{m.testStatus=m.enabled?'AVAILABLE':'FAILED';m.updated='2026-09-17 16:01:00'});
 const rows=selected.map(m=>`<div class="model-test-row"><div><b>${m.name}</b><div class="small mono muted">${m.baseUrl} · ${m.modelId}</div></div><div>${m.enabled?tag('测试通过','green'):tag('模型已禁用','red')}</div></div>`).join('');
 openModal(`批量测试结果（${selected.length}）`,`<div class="notice">按照 OpenAI 兼容协议对所选模型执行连通性与模型调用测试。</div><div class="model-test-list">${rows}</div>`,`<button class="btn primary" onclick="closeModal();modelSelected.clear();render()">关闭</button>`)
}


function users(){
 return `<div class="card">${tableToolbar('新增用户','openUserCreate','userSearch')}<div class="table-wrap"><table><thead><tr><th>姓名</th><th>账号</th><th>Agent 授权数</th><th>已配置用户凭据数</th><th>IM 身份数</th><th>用户记忆数</th><th>启用状态</th><th>更新时间</th></tr></thead><tbody>${S.users.map(u=>{const grants=u.agentGrants||[],credCount=Object.values(u.credentials||{}).filter(x=>x.configured).length,identityCount=(u.identities||[]).length,memoryCount=(u.memories||[]).length;return `<tr><td><span class="row-link" onclick="openUser('${u.id}')">${u.name}</span></td><td>${u.account}</td><td>${grants.length}</td><td>${credCount}</td><td>${identityCount}</td><td>${memoryCount}</td><td>${statusTag(u.status)}</td><td>${u.updated}</td></tr>`}).join('')}</tbody></table></div>${pagination(S.users.length,1,10,'void')}</div>`
}

function openUserCreate(){
 openModal('新增用户',`<div class="form-grid">
   <div class="form-item"><label class="req">姓名</label><input id="newUserName" placeholder="例如：张明"></div>
   <div class="form-item"><label class="req">账号</label><input id="newUserAccount" placeholder="例如：zhangming"></div>
   <div class="form-item"><label>状态</label><select id="newUserStatus"><option value="ACTIVE">启用</option><option value="DISABLED">禁用</option></select></div>
   <div class="form-item"><label>初始 Agent 授权</label><select id="newUserAgent"><option value="">暂不授权</option>${S.agents.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
 </div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveNewUser()">保存</button>`)
}

function saveNewUser(){
 const name=$('#newUserName').value.trim(),account=$('#newUserAccount').value.trim(),status=$('#newUserStatus').value,agentId=$('#newUserAgent').value;
 if(!name||!account)return toast('请填写姓名和账号');
 if(S.users.some(u=>u.account===account))return toast('账号已存在');
 const now='2026-09-17 14:20:00';
 const grants=agentId?[{agentId,grantedAt:now}]:[];
 const agents=grants.map(g=>S.agents.find(a=>a.id===g.agentId)?.name).filter(Boolean);
 S.users.unshift({
   id:'u-'+Date.now(),name,account,agents,platform:'未配置',im:'未绑定',memory:0,status,
   created:now,updated:now,agentGrants:grants,credentials:{},identities:[],memories:[]
 });
 closeModal();render();toast('用户已创建')
}

function openUserEdit(id){
 const u=S.users.find(x=>x.id===id);
 openModal('编辑用户',`<div class="form-grid">
   <div class="form-item"><label class="req">姓名</label><input id="editUserName" value="${u.name}"></div>
   <div class="form-item"><label class="req">账号</label><input id="editUserAccount" value="${u.account}"></div>
   <div class="form-item"><label>状态</label><select id="editUserStatus"><option value="ACTIVE" ${u.status==='ACTIVE'?'selected':''}>启用</option><option value="DISABLED" ${u.status==='DISABLED'?'selected':''}>禁用</option></select></div>
 </div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveUserEdit('${id}')">保存</button>`)
}

function saveUserEdit(id){
 const u=S.users.find(x=>x.id===id);
 const name=$('#editUserName').value.trim(),account=$('#editUserAccount').value.trim();
 if(!name||!account)return toast('请填写姓名和账号');
 if(S.users.some(x=>x.id!==id&&x.account===account))return toast('账号已存在');
 u.name=name;u.account=account;u.status=$('#editUserStatus').value;u.updated='2026-09-17 14:20:00';
 closeModal();render();openUser(id,'basic');toast('用户信息已更新')
}

function openUserGrantAgent(userId){
 const u=S.users.find(x=>x.id===userId);
 const granted=new Set((u.agentGrants||[]).map(g=>g.agentId));
 const options=S.agents.filter(a=>!granted.has(a.id));
 openModal('授权 Agent', options.length?`<div class="form-item"><label class="req">选择 Agent</label><select id="grantAgentId">${options.map(a=>`<option value="${a.id}">${a.name} · ${a.key}</option>`).join('')}</select></div><div class="notice" style="margin-top:14px">授权后用户可以通过已绑定 IM 身份使用该 Agent；该操作不会自动配置项目平台凭据。</div>`:`<div class="empty">当前所有 Agent 均已授权</div>`, options.length?`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveUserAgentGrant('${userId}')">授权</button>`:`<button class="btn primary" onclick="closeModal()">关闭</button>`)
}

function saveUserAgentGrant(userId){
 const u=S.users.find(x=>x.id===userId),agentId=$('#grantAgentId').value,a=S.agents.find(x=>x.id===agentId);
 u.agentGrants=u.agentGrants||[];
 u.agentGrants.push({agentId,grantedAt:'2026-09-17 14:20:00'});
 u.agents=u.agentGrants.map(g=>S.agents.find(x=>x.id===g.agentId)?.name).filter(Boolean);
 u.updated='2026-09-17 14:20:00';
 closeModal();openUser(userId,'agents');toast(`已授权 ${a.name}`)
}

function revokeUserAgent(userId,agentId){
 const u=S.users.find(x=>x.id===userId);
 u.agentGrants=(u.agentGrants||[]).filter(g=>g.agentId!==agentId);
 u.agents=u.agentGrants.map(g=>S.agents.find(x=>x.id===g.agentId)?.name).filter(Boolean);
 u.updated='2026-09-17 14:20:00';
 openUser(userId,'agents');toast('Agent 授权已取消')
}

function openUserCredential(userId,platformId){
 const u=S.users.find(x=>x.id===userId),p=S.platforms.find(x=>x.id===platformId),a=adapterByKey(p.adapterKey);
 const current=(u.credentials||{})[platformId]||{configured:false};
 const fields=(a?.credentialFields||[]).map(f=>`<div class="form-item"><label class="req">${f.label}</label><input ${f.secret?'type="password"':''} id="usercred_${f.key}" placeholder="${current.configured&&f.secret?'已配置；留空表示保持不变':f.secret?'输入后不会回显':''}"></div>`).join('');
 openModal('配置项目平台凭据',`<div class="notice"><b>${u.name}</b> · ${p.name}<br>${a?.name||p.adapterKey} · ${credentialModeName(p.credentialMode)}</div><div class="form-grid" style="margin-top:14px">${fields||'<div class="empty">该平台无需用户凭据</div>'}</div><div class="help">保存时写入 Secret Provider，Console 只保存密钥引用。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveUserCredential('${userId}','${platformId}')">保存</button>`)
}

function saveUserCredential(userId,platformId){
 const u=S.users.find(x=>x.id===userId);
 u.credentials=u.credentials||{};
 u.credentials[platformId]={configured:true,updated:'2026-09-17 14:20:00'};
 u.platform='项目平台凭据已配置';
 u.updated='2026-09-17 14:20:00';
 closeModal();openUser(userId,'cred');toast('项目平台凭据已保存')
}

function generateBind(id){
 const u=S.users.find(x=>x.id===id);
 openModal('生成 IM 绑定码',`<div style="text-align:center;padding:22px">
   <div class="small muted">${u.name}（${u.account}）</div>
   <div style="margin-top:8px">请用户在任意可访问的企业微信 Bot 输入</div>
   <div class="code" style="font-size:22px;margin:16px auto;display:inline-block">/bind 8K3M-7Q2P</div>
   <div class="small muted">10 分钟内有效 · 单次使用</div>
 </div>
 <div class="notice">绑定码只建立 IM 外部身份与当前 PlatformUser 的映射，不绑定 Agent，也不会修改 AgentAccessGrant。</div>`,
 `<button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="toast('已复制绑定命令')">复制命令</button>`)
}

function unbindIdentity(userId,identityId){
 const u=S.users.find(x=>x.id===userId);
 u.identities=(u.identities||[]).filter(x=>x.id!==identityId);
 u.im=u.identities.length?(u.identities[0].externalId):'未绑定';
 u.updated='2026-09-17 14:20:00';
 openUser(userId,'im');toast('IM 身份已解绑')
}

function deleteUserMemory(userId,memoryId){
 const u=S.users.find(x=>x.id===userId);
 u.memories=(u.memories||[]).filter(x=>x.id!==memoryId);
 u.memory=u.memories.length;
 u.updated='2026-09-17 14:20:00';
 openUser(userId,'memory');toast('用户记忆已清理')
}

function clearUserMemory(userId){
 const u=S.users.find(x=>x.id===userId);
 u.memories=[];u.memory=0;u.updated='2026-09-17 14:20:00';
 openUser(userId,'memory');toast('用户记忆已全部清理')
}



function platforms(){
 const adapterName=k=>S.platformAdapters.find(a=>a.key===k)?.name||k;
 return `<div class="card">${tableToolbar('新增项目平台','openPlatformCreate','platformSearch')}<div class="table-wrap"><table><thead><tr><th>名称</th><th>标识</th><th>平台适配器</th><th>接入方式</th><th>访问配置</th><th>凭据策略</th><th>已配置用户凭据数</th><th>启用状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${S.platforms.map(p=>`<tr><td><span class="row-link" onclick="openPlatform('${p.id}')">${p.name}</span></td><td class="mono">${p.key}</td><td>${adapterName(p.adapterKey)}</td><td>${resolverTypeName(p.resolverType)}</td><td class="mono">${resolverDisplay(p)}</td><td>${credentialModeName(p.credentialMode)}</td><td>${platformCredentialCount(p.id)}</td><td>${p.enabled?statusTag('ENABLED'):statusTag('DISABLED')}</td><td>${p.updated}</td><td><button class="btn ghost" onclick="openPlatformTest('${p.id}')">调用测试</button></td></tr>`).join('')}</tbody></table></div>${pagination(S.platforms.length,1,10,'void')}</div>`
}


function openPlatformCreate(){
 const adapterOpts=S.platformAdapters.map(a=>`<option value="${a.key}">${a.name}</option>`).join('');
 openModal('新增项目平台',`<div class="notice">项目平台保存平台实例、寻址方式和 PlatformAdapter 配置。认证、签名和 Session 逻辑由 PlatformAdapter 负责。</div><div class="form-grid" style="margin-top:16px"><div class="form-item"><label class="req">名称</label><input id="platformName" placeholder="例如：MSSW 生产平台"></div><div class="form-item"><label class="req">标识</label><input id="platformKey" placeholder="mssw-prod"></div><div class="form-item"><label class="req">接入方式</label><select id="platformResolverType" onchange="renderPlatformResolverFields()"><option value="BASE_URL">Base URL</option><option value="SERVICE_DISCOVERY">服务发现</option></select></div><div class="form-item"><label class="req">平台适配器</label><select id="platformAdapter" onchange="renderPlatformAdapterFields()">${adapterOpts}</select></div><div id="platformResolverFields" class="form-item full"></div><div class="form-item"><label class="req">凭据策略</label><select id="credentialMode"><option value="USER_ONLY">仅用户凭据</option><option value="SHARED_ONLY">仅共享凭据</option><option value="USER_THEN_SHARED">用户优先 / 共享回退</option><option value="NONE">无凭据</option></select></div><div class="form-item"><label>启用状态</label><select id="platformEnabled"><option value="true">启用</option><option value="false">禁用</option></select></div><div id="adapterFields" class="form-item full"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveProjectPlatform()">保存</button>`);
 setTimeout(()=>{renderPlatformResolverFields();renderPlatformAdapterFields()},0)
}

function adapterByKey(key){return S.platformAdapters.find(a=>a.key===key)}

function renderPlatformResolverFields(){
 const type=$('#platformResolverType')?.value||'BASE_URL',host=$('#platformResolverFields');if(!host)return;
 host.innerHTML=type==='SERVICE_DISCOVERY'
   ? `<label class="req">服务名</label><input id="platformServiceName" placeholder="例如：customer-service-mgr"><div class="help">由内部服务发现解析真实地址。</div>`
   : `<label class="req">Base URL</label><input id="platformBaseUrl" placeholder="例如：https://mssw.internal"><div class="help">填写业务平台根地址。</div>`
}

function renderPlatformAdapterFields(values={}){
 const key=$('#platformAdapter')?.value||S.platformAdapters[0].key;
 const a=adapterByKey(key);
 const host=$('#adapterFields'); if(!host||!a)return;
 const fields=a.configFields.map(f=>{
   const v=values[f.key]??'';
   const ctrl=f.type==='select'?`<select id="adapter_${f.key}">${f.options.map(o=>`<option ${String(v)===String(o)?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="adapter_${f.key}" value="${v}" placeholder="${f.placeholder||''}">`;
   return `<div class="form-item"><label>${f.label}</label>${ctrl}</div>`
 }).join('');
 host.innerHTML=`<div class="notice" style="margin-bottom:12px"><b>${a.name}</b> · 会话模式：${a.sessionMode} · 适配器版本：${a.version}<br><span class="small">以下字段由 PlatformAdapter 的 平台配置 Schema 动态生成。</span></div><div class="form-grid">${fields||'<div class="empty">该 PlatformAdapter 无额外平台配置</div>'}</div>`
}

function saveProjectPlatform(){
 const name=$('#platformName').value.trim(),key=$('#platformKey').value.trim(),resolverType=$('#platformResolverType').value,adapterKey=$('#platformAdapter').value,credentialMode=$('#credentialMode').value,enabled=$('#platformEnabled').value==='true';
 const resolverConfig=resolverType==='SERVICE_DISCOVERY'?{serviceName:$('#platformServiceName').value.trim()}:{baseUrl:$('#platformBaseUrl').value.trim()};
 if(!name||!key||!Object.values(resolverConfig)[0])return toast('请填写名称、标识和访问配置');
 if(S.platforms.some(p=>p.key===key))return toast('平台标识已存在');
 const a=adapterByKey(adapterKey),cfg={};a.configFields.forEach(f=>cfg[f.key]=$(`#adapter_${f.key}`)?.value||'');
 S.platforms.unshift({id:'p-'+Date.now(),name,key,resolverType,resolverConfig,adapterKey,credentialMode,adapterConfig:cfg,enabled,updated:'2026-09-17 16:01:00'});closeModal();render();toast('项目平台已创建')
}

function credentialModeName(m){return ({USER_ONLY:'仅用户凭据',SHARED_ONLY:'仅共享凭据',USER_THEN_SHARED:'用户优先 / 共享回退',NONE:'无凭据'})[m]||m}


function openPlatform(id,tab='basic'){
 const p=S.platforms.find(x=>x.id===id),a=adapterByKey(p.adapterKey);const tabs=[['basic','基本信息'],['credentials','凭据管理']];let body='';
 if(tab==='basic')body=`<div class="detail-pane"><div class="section-title">基本信息</div><div class="platform-info-grid"><div class="platform-field"><span class="platform-label">名称</span><span class="platform-value">${p.name}</span></div><div class="platform-field"><span class="platform-label">标识</span><span class="platform-value mono">${p.key}</span></div><div class="platform-field"><span class="platform-label">平台适配器</span><span class="platform-value">${a?.name||p.adapterKey}</span></div><div class="platform-field"><span class="platform-label">适配器版本</span><span class="platform-value">${a?.version||'-'}</span></div><div class="platform-field"><span class="platform-label">接入方式</span><span class="platform-value">${resolverTypeName(p.resolverType)}</span></div><div class="platform-field"><span class="platform-label">凭据策略</span><span class="platform-value">${credentialModeName(p.credentialMode)}</span></div><div class="platform-field"><span class="platform-label">已配置用户凭据数</span><span class="platform-value">${platformCredentialCount(p.id)}</span></div><div class="platform-field"><span class="platform-label">启用状态</span><span class="platform-value">${p.enabled?statusTag('ENABLED'):statusTag('DISABLED')}</span></div><div class="platform-field"><span class="platform-label">更新时间</span><span class="platform-value">${p.updated}</span></div></div><div class="platform-full-field"><span class="platform-label">访问配置</span><span class="platform-value mono">${resolverDisplay(p)}</span></div><div class="divider"></div><div class="section-title">平台配置</div><div class="platform-config-grid">${(a?.configFields||[]).map(f=>`<div class="platform-config-item"><span class="platform-config-label">${f.label}</span><span class="platform-config-value mono">${p.adapterConfig?.[f.key]??'-'}</span></div>`).join('')||'<div class="empty">当前平台适配器无额外配置</div>'}</div><div class="small muted" style="margin-top:10px">配置项由 PlatformAdapter 的平台配置 Schema 定义。</div><div class="divider"></div><div class="section-title">凭据定义</div><div class="platform-schema-list"><div class="platform-schema-row platform-schema-head"><span>字段</span><span>标识</span><span>敏感性</span><span>说明</span></div>${(a?.credentialFields||[]).map(f=>`<div class="platform-schema-row"><span>${f.label}</span><span class="mono">${f.key}</span><span>${f.secret?tag('敏感字段','orange'):tag('普通字段','gray')}</span><span>${f.secret?'保存到 Secret Provider，不回显明文':'按平台适配器定义使用'}</span></div>`).join('')||'<div class="empty">当前平台无需凭据</div>'}</div><div class="notice" style="margin-top:16px"><b>接入边界：</b>项目平台只保存实例配置；登录、签名、Cookie、CSRF、Session 刷新/校验等协议细节由 PlatformAdapter 负责。</div></div>`;
 if(tab==='credentials')body=`<div class="detail-pane"><div class="toolbar" style="padding-left:0;padding-right:0"><div><button class="btn primary" onclick="openPlatformUserCredentialPicker('${p.id}')">＋ 配置用户凭据</button></div></div><div class="section-title">用户凭据</div><div class="platform-credential-list"><div class="platform-credential-row platform-list-head"><span>用户</span><span>账号</span><span>配置状态</span><span>更新时间</span><span>操作</span></div>${S.users.map(u=>{const c=u.credentials?.[p.id]||{configured:false,updated:'-'};return `<div class="platform-credential-row"><span class="row-link" onclick="openUser('${u.id}','cred')">${u.name}</span><span class="mono">${u.account}</span><span>${c.configured?tag('已配置','green'):tag('未配置','orange')}</span><span>${c.updated}</span><span><button class="btn ghost" onclick="openUserCredential('${u.id}','${p.id}')">${c.configured?'更新':'配置'}</button></span></div>`}).join('')}</div>${p.credentialMode==='USER_THEN_SHARED'||p.credentialMode==='SHARED_ONLY'?`<div class="divider"></div><div class="section-title">共享凭据</div><div class="platform-shared-credential"><div><b>默认共享凭据</b><div class="small muted">仅在当前凭据策略允许时回退使用。</div></div><div>${tag('已配置','green')} <button class="btn ghost" onclick="openSharedCredential('${p.id}')">更新</button></div></div>`:''}<div class="notice warningbox" style="margin-top:16px">凭据真实值写入 Secret Provider；Console 只保存密钥引用和 Schema 版本。</div></div>`;
 const tabsHtml=`<div class="tabs">${tabs.map(t=>`<div class="tab ${tab===t[0]?'active':''}" onclick="openPlatform('${p.id}','${t[0]}')">${t[1]}</div>`).join('')}</div>`;
 openDrawer(p.name,p.key,tabsHtml+body,`<button class="btn" onclick="openPlatformTest('${p.id}')">调用测试</button><button class="btn primary" onclick="openPlatformEdit('${p.id}')">编辑平台</button>`)
}

function openPlatformCredential(platformId){
 const p=S.platforms.find(x=>x.id===platformId),a=adapterByKey(p.adapterKey);
 const fields=a.credentialFields.map(f=>`<div class="form-item"><label class="req">${f.label}</label><input ${f.secret?'type="password"':''} id="cred_${f.key}" placeholder="${f.secret?'输入后不会回显':''}"></div>`).join('');
 openModal('配置用户凭据',`<div class="notice">${p.name} 使用 <b>${a.name}</b>；下面字段由 凭据 Schema 动态生成。</div><div class="form-grid" style="margin-top:14px"><div class="form-item full"><label>用户</label><select><option>王博 / wangbo</option><option>李明 / liming</option></select></div>${fields}</div><div class="help">保存时写入 Secret Provider，数据库仅保存 密钥引用 和 Schema 版本。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="closeModal();toast('用户凭据已保存到 Secret Provider')">保存</button>`)
}



function tasks(){
 const q=F.taskSearch.toLowerCase(),st=F.taskStatus,tr=F.taskTrigger;const rows=S.tasks.filter(t=>(t.id+t.intent+t.user+t.agent+t.skill).toLowerCase().includes(q)&&(st==='ALL'||t.status===st)&&(tr==='ALL'||t.trigger===tr));const statusOpts=[['QUEUED','排队中'],['RUNNING','执行中'],['WAITING','等待中'],['COMPLETED','已完成'],['FAILED','失败'],['CANCELLED','已取消']];
 return `<div class="card"><div class="toolbar"><div class="toolbar-left"><button class="btn" onclick="openTaskHelp()">查看任务创建方式</button></div><div class="toolbar-right"><input id="taskSearch" class="input search" value="${F.taskSearch}" placeholder="任务 ID / 意图 / 用户" onkeydown="if(event.key==='Enter')applySearch('taskSearch','taskSearch')"><button class="btn" onclick="applySearch('taskSearch','taskSearch')">搜索</button><select id="taskStatus" class="select" onchange="setFilter('taskStatus',this.value)"><option value="ALL" ${F.taskStatus==='ALL'?'selected':''}>全部任务状态</option>${statusOpts.map(x=>`<option value="${x[0]}" ${F.taskStatus===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><select id="taskTrigger" class="select" onchange="setFilter('taskTrigger',this.value)"><option value="ALL" ${F.taskTrigger==='ALL'?'selected':''}>全部触发方式</option><option value="IMMEDIATE" ${F.taskTrigger==='IMMEDIATE'?'selected':''}>立即</option><option value="SCHEDULED" ${F.taskTrigger==='SCHEDULED'?'selected':''}>定时</option></select><button class="btn" onclick="toast('已刷新')">↻ 刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>任务 ID</th><th>业务意图</th><th>Agent</th><th>执行用户</th><th>Skill</th><th>触发方式</th><th>任务状态</th><th>子任务进度</th><th>开始时间</th><th>完成时间</th><th>任务截止时间</th><th>投递状态</th><th>操作</th></tr></thead><tbody>${rows.map(t=>`<tr><td><span class="row-link mono" onclick="openTask('${t.id}')">${t.id}</span></td><td class="mono">${t.intent}</td><td>${t.agent}</td><td>${t.user}</td><td>${t.skill}</td><td>${statusTag(t.trigger)}</td><td>${statusTag(t.status)}</td><td style="min-width:130px"><div>${t.progress}</div><div class="progress" style="margin-top:5px"><i style="width:${Math.max(4,(t.completed+t.failed)/Math.max(1,t.children)*100)}%"></i></div></td><td>${t.started}</td><td>${t.finished}</td><td>${taskDeadline(t)}</td><td>${statusTag(t.delivery)}</td><td>${['RUNNING','QUEUED','WAITING'].includes(t.status)?`<button class="btn ghost" style="color:#b42318" onclick="cancelTask('${t.id}')">取消</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>${pagination(rows.length,1,10,'void')}</div>`
}

function openTaskHelp(){openModal('后台任务如何产生',`<div class="notice">Console 不手工编辑任务输入。用户在 IM 中表达业务目标，由 Agent 理解一个 业务意图，选择 Skill，再由 执行路由 根据 执行模式 决定是否提交 后台任务。</div><div class="code" style="margin-top:14px">用户输入<br>→ 意图理解<br>→ Skill 解析<br>→ execute_skill<br>→ 执行路由<br>→ 异步 / 定时<br>→ agent-worker</div>`,`<button class="btn primary" onclick="closeModal()">知道了</button>`)}

function taskDeadline(t){const d=new Date(String(t.started).replace(' ','T')+'+08:00');if(isNaN(d))return '-';d.setHours(d.getHours()+24);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}

function openTask(id,tab='overview'){
 const t=S.tasks.find(x=>x.id===id);if(!t)return toast('任务不存在');const tabs=[['overview','任务概览'],['children','子任务'],['timeline','时间线'],['snapshot','执行快照'],['result','结果与产物']];let body='';
 if(tab==='overview')body=`<div class="detail-pane"><div class="grid grid-3"><div class="card-pad" style="border:1px solid var(--line);border-radius:8px"><div class="small muted">任务状态</div><div style="margin-top:8px">${statusTag(t.status)}</div></div><div class="card-pad" style="border:1px solid var(--line);border-radius:8px"><div class="small muted">子任务进度</div><div style="font-size:22px;font-weight:700;margin-top:5px">${t.completed+t.failed}/${t.children}</div></div><div class="card-pad" style="border:1px solid var(--line);border-radius:8px"><div class="small muted">投递状态</div><div style="margin-top:8px">${statusTag(t.delivery)}</div></div></div><div class="divider"></div><dl class="kv"><dt>业务意图</dt><dd class="mono">${t.intent}</dd><dt>Agent</dt><dd>${t.agent}</dd><dt>执行用户</dt><dd>${t.user}</dd><dt>Skill</dt><dd>${t.skill}</dd><dt>触发方式</dt><dd>${statusTag(t.trigger)}</dd><dt>执行模式</dt><dd>${statusTag(t.mode)}</dd><dt>投递路由</dt><dd>${t.route}</dd><dt>开始时间</dt><dd>${t.started}</dd><dt>完成时间</dt><dd>${t.finished}</dd><dt>任务截止时间</dt><dd>${taskDeadline(t)}</dd>${t.error?`<dt>失败原因</dt><dd class="mono">${t.error}</dd>`:''}${t.scheduleId?`<dt>定时任务 ID</dt><dd class="mono"><span class="row-link" onclick="openSchedule('${t.scheduleId}')">${t.scheduleId}</span></dd>`:''}</dl><div class="divider"></div><div class="notice">该任务不绑定固定 Worker Pod；lease_owner 只表示当前租约持有者，Pod 崩溃后租约到期可由其他 Worker 重新领取。</div></div>`;
 if(tab==='children')body=`<div class="detail-pane"><div class="tree"><div class="tree-node tree-root"><div class="tree-row"><b>▾ ${t.id}</b> ${statusTag(t.status)} <span class="muted">${t.intent}</span></div>${[...Array(Math.min(t.children,20))].map((_,i)=>{let s=i<t.completed?'COMPLETED':i<t.completed+t.failed?'FAILED':'RUNNING';return `<div class="tree-node"><div class="tree-row"><span>└</span><span class="mono">child-${String(i+1).padStart(2,'0')}</span>${statusTag(s)}<span class="muted">customer-${String.fromCharCode(65+i)}</span></div></div>`}).join('')}</div></div></div>`;
 if(tab==='timeline')body=`<div class="detail-pane"><div class="timeline"><div class="timeline-item"><b>任务已创建</b><div class="muted">Agent Runtime 提交后台任务</div><div class="timeline-time">${t.started}</div></div><div class="timeline-item"><b>任务已领取</b><div class="muted">worker-b · 租约 60 秒</div><div class="timeline-time">${t.started}</div></div><div class="timeline-item"><b>并行拆分</b><div class="muted">创建 ${t.children} 个子任务 · 最大并发数=10</div><div class="timeline-time">${t.started}</div></div><div class="timeline-item"><b>${t.status==='COMPLETED'?'聚合完成':'子任务执行中'}</b><div class="muted">成功 ${t.completed} · 失败 ${t.failed}</div><div class="timeline-time">${t.finished==='-'?'进行中':t.finished}</div></div></div></div>`;
 if(tab==='snapshot')body=`<div class="detail-pane"><div class="code">{<br>&nbsp;&nbsp;"agent_revision": "${t.agentRevision}",<br>&nbsp;&nbsp;"skill_artifact": "${t.skillArtifact}",<br>&nbsp;&nbsp;"intent_key": "${t.intent}",<br>&nbsp;&nbsp;"delivery_mode": "FINAL_ONLY",<br>&nbsp;&nbsp;"mcp_catalog_revision": 7,<br>&nbsp;&nbsp;"mcp_catalog_hash": "sha256:3f9c...",<br>&nbsp;&nbsp;"prompt_template_version": "1",<br>&nbsp;&nbsp;"contains_secret": false<br>}</div><div class="notice" style="margin-top:12px">单次 Task 开始后 execution snapshot 不漂移；定时任务每次触发重新解析当前定义并生成新的执行快照。</div></div>`;
 if(tab==='result')body=`<div class="detail-pane">${t.status==='RUNNING'?'<div class="empty">任务尚未完成，最终结果将在结果聚合后生成。</div>':`<div class="notice ${t.status==='COMPLETED'?'successbox':'warningbox'}">${t.result||'无结果'}</div><div class="listline"><div><b>结果文件</b><div class="small muted">Artifact Store 制品</div></div><button class="btn">查看</button></div>`}</div>`;
 const actions=['RUNNING','QUEUED','WAITING'].includes(t.status)?`<button class="btn danger" onclick="cancelTask('${t.id}')">取消任务</button>`:'';openDrawer(t.id,`${t.intent} · ${t.user}`,`<div class="tabs">${tabs.map(x=>`<div class="tab ${tab===x[0]?'active':''}" onclick="openTask('${t.id}','${x[0]}')">${x[1]}</div>`).join('')}</div>${body}`,actions)
}

function cancelTask(id){const t=S.tasks.find(x=>x.id===id);if(t){t.status='CANCELLED';t.finished='2026-09-17 12:40:00';t.delivery='NONE'}closeDrawer();render();toast('已提交取消请求')}



function schedules(){
 const q=F.scheduleSearch.toLowerCase(),st=F.scheduleStatus;const rows=S.schedules.filter(s=>(s.name+s.user+s.intent+s.skill).toLowerCase().includes(q)&&(st==='ALL'||s.status===st));
 return `<div class="card"><div class="toolbar"><div class="toolbar-left"><button class="btn" onclick="openScheduleHelp()">如何通过 Agent 创建</button></div><div class="toolbar-right"><input id="scheduleSearch" class="input search" value="${F.scheduleSearch}" placeholder="名称 / 用户 / 业务意图" onkeydown="if(event.key==='Enter')applySearch('scheduleSearch','scheduleSearch')"><button class="btn" onclick="applySearch('scheduleSearch','scheduleSearch')">搜索</button><select id="scheduleStatus" class="select" onchange="setFilter('scheduleStatus',this.value)"><option value="ALL" ${F.scheduleStatus==='ALL'?'selected':''}>全部调度状态</option><option value="ACTIVE" ${F.scheduleStatus==='ACTIVE'?'selected':''}>启用</option><option value="PAUSED" ${F.scheduleStatus==='PAUSED'?'selected':''}>已暂停</option><option value="COMPLETED" ${F.scheduleStatus==='COMPLETED'?'selected':''}>已完成</option></select><button class="btn" onclick="toast('已刷新')">↻ 刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>名称</th><th>Agent</th><th>执行用户</th><th>业务意图</th><th>Skill</th><th>调度规则</th><th>时区</th><th>下次触发时间</th><th>最近触发时间</th><th>调度状态</th><th>操作</th></tr></thead><tbody>${rows.map(s=>`<tr><td><span class="row-link" onclick="openSchedule('${s.id}')">${s.name}</span></td><td>${s.agent}</td><td>${s.user}</td><td class="mono">${s.intent}</td><td>${s.skill}</td><td>${s.expr}</td><td>${s.tz}</td><td>${s.next}</td><td>${s.last}</td><td>${statusTag(s.status)}</td><td>${s.status==='ACTIVE'?`<button class="btn ghost" onclick="toggleSchedule('${s.id}')">暂停</button>`:(s.status==='PAUSED'?`<button class="btn ghost" onclick="toggleSchedule('${s.id}')">恢复</button>`:'-')}</td></tr>`).join('')}</tbody></table></div>${pagination(rows.length,1,10,'void')}</div>`
}

function openScheduleHelp(){openModal('通过 Agent 创建定时任务',`<div class="chat"><div class="chat-title">企业微信 · MSS 服务助手</div><div class="chat-messages"><div class="bubble user">每周一上午 9 点帮 A 客户做一次策略检查，完成后告诉我</div><div class="bubble bot">已理解：每周一 09:00 为 A 客户执行“设备策略检查”。任务将在后台执行，完成后只推送最终结果。确认创建吗？</div><div class="bubble user">确认</div><div class="bubble bot">已创建定时任务“每周策略检查”，下次触发：2026-09-21 09:00。</div></div><div class="chat-input"><input placeholder="这里只是交互演示" disabled><button class="btn primary" disabled>发送</button></div></div>`,`<button class="btn primary" onclick="closeModal()">关闭</button>`,'wide')}



function openSchedule(id){
 const s=S.schedules.find(x=>x.id===id);const history=S.tasks.filter(t=>t.scheduleId===s.id).sort((a,b)=>b.started.localeCompare(a.started));
 const baseInfo=`<div class="detail-pane"><div class="section-title">基本信息</div><div class="schedule-info-grid"><div class="schedule-field"><span class="schedule-label">名称</span><span class="schedule-value">${s.name}</span></div><div class="schedule-field"><span class="schedule-label">Agent</span><span class="schedule-value">${s.agent}</span></div><div class="schedule-field"><span class="schedule-label">执行用户</span><span class="schedule-value">${s.user}</span></div><div class="schedule-field"><span class="schedule-label">业务意图</span><span class="schedule-value mono">${s.intent}</span></div><div class="schedule-field"><span class="schedule-label">Skill</span><span class="schedule-value">${s.skill}</span></div><div class="schedule-field"><span class="schedule-label">调度规则</span><span class="schedule-value">${s.expr}</span></div><div class="schedule-field"><span class="schedule-label">时区</span><span class="schedule-value">${s.tz}</span></div><div class="schedule-field"><span class="schedule-label">投递路由</span><span class="schedule-value">${s.route}</span></div><div class="schedule-field"><span class="schedule-label">下次触发时间</span><span class="schedule-value">${s.next}</span></div><div class="schedule-field"><span class="schedule-label">最近触发时间</span><span class="schedule-value">${s.last}</span></div><div class="schedule-field"><span class="schedule-label">调度状态</span><span class="schedule-value">${statusTag(s.status)}</span></div><div class="schedule-field"><span class="schedule-label">定时任务 ID</span><span class="schedule-value mono">${s.id}</span></div></div><div class="divider"></div><div class="section-title">历史触发</div>${history.length?`<div class="simple-history-list"><div class="history-row history-head"><span>任务 ID</span><span>触发时间</span><span>完成时间</span><span>任务状态</span></div>${history.map(t=>`<div class="history-row"><span class="row-link mono" onclick="openTask('${t.id}')">${t.id}</span><span>${t.started}</span><span>${t.finished}</span><span>${statusTag(t.status)}</span></div>`).join('')}</div>`:'<div class="empty">暂无历史触发任务</div>'}</div>`;
 openDrawer(s.name,`${s.id} · ${s.status==='ACTIVE'?'启用':'已暂停'}`,baseInfo,`${s.status==='ACTIVE'?`<button class="btn" onclick="toggleSchedule('${s.id}')">暂停</button>`:`<button class="btn" onclick="toggleSchedule('${s.id}')">恢复</button>`}<button class="btn danger" onclick="deleteSchedule('${s.id}')">删除</button>`)
}

function toggleSchedule(id){const s=S.schedules.find(x=>x.id===id);s.status=s.status==='ACTIVE'?'PAUSED':'ACTIVE';closeDrawer();render();toast(s.status==='ACTIVE'?'定时任务已恢复':'定时任务已暂停')}
function deleteSchedule(id){const i=S.schedules.findIndex(x=>x.id===id);if(i>=0)S.schedules.splice(i,1);closeDrawer();render();toast('定时任务已删除，仅影响未来触发')}



function audits(){
 return `<div class="card"><div class="toolbar"><div class="toolbar-left"></div><div class="toolbar-right"><input class="input search" placeholder="Trace ID / 操作用户 / 操作目标"><select class="select"><option>全部审计类型</option><option>任务</option><option>出网调用</option><option>模型调用</option><option>配置变更</option></select><button class="btn" onclick="toast('已刷新')">↻ 刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>审计类型</th><th>操作用户</th><th>Agent</th><th>操作目标</th><th>动作</th><th>执行结果</th><th>Trace ID</th></tr></thead><tbody>${S.audits.map((a,i)=>`<tr><td>${a.time}</td><td>${tag(({TASK:'任务',EGRESS:'出网调用',MODEL:'模型调用',CONFIG:'配置变更'})[a.type]||a.type,a.type==='TASK'?'purple':a.type==='EGRESS'?'cyan':'gray')}</td><td>${a.actor}</td><td>${a.agent}</td><td class="mono">${a.target}</td><td class="mono">${a.action}</td><td>${a.result==='SUCCESS'?tag('成功','green'):tag(a.result,'red')}</td><td><span class="row-link mono" onclick="openAudit(${i})">${a.trace}</span></td></tr>`).join('')}</tbody></table></div>${pagination(S.audits.length,1,20,'void')}</div>`
}

function mcpEffectTag(effect){
 return effect==='WRITE'?tag('写操作','orange'):effect==='EXTERNAL'?tag('外部调用','purple'):tag('只读','cyan')
}


function openMcp(id,tab='basic'){
 const m=S.mcps.find(x=>x.id===id);
 const tabs=[['basic','基本信息'],['tools','工具明细'],['agents','使用 Agent'],['users','指定用户']];
 let body='';

 if(tab==='basic'){
   body=`<div class="detail-pane">
     <div class="section-title">基本信息</div>
     <div class="mcp-info-grid">
       <div class="mcp-field"><span class="mcp-label">名称</span><span class="mcp-value">${m.name}</span></div>
       <div class="mcp-field"><span class="mcp-label">标识</span><span class="mcp-value mono">${m.key}</span></div>
       <div class="mcp-field"><span class="mcp-label">传输方式</span><span class="mcp-value">Streamable HTTP</span></div>
       <div class="mcp-field"><span class="mcp-label">启用状态</span><span class="mcp-value">${m.enabled?statusTag('ENABLED'):statusTag('DISABLED')}</span></div>
       <div class="mcp-field"><span class="mcp-label">用户范围</span><span class="mcp-value">${statusTag(m.userScope)}</span></div>
       <div class="mcp-field"><span class="mcp-label">指定用户数</span><span class="mcp-value">${m.userScope==='SELECTED'?(m.selectedUsers||[]).length:'不适用'}</span></div>
       <div class="mcp-field"><span class="mcp-label">工具数</span><span class="mcp-value">${m.tools.length}</span></div>
       <div class="mcp-field"><span class="mcp-label">使用 Agent 数</span><span class="mcp-value">${mcpAgentCount(m.key)}</span></div>
       <div class="mcp-field"><span class="mcp-label">连接状态</span><span class="mcp-value">${statusTag(m.connectionStatus)}</span></div>
       <div class="mcp-field"><span class="mcp-label">最近工具发现时间</span><span class="mcp-value">${m.lastDiscover}</span></div>
     </div>

     <div class="mcp-full-field"><span class="mcp-label">服务地址</span><span class="mcp-value mono">${m.endpoint}</span></div>

     <div class="notice" style="margin-top:14px">
       <b>权限关系：</b>用户必须拥有目标 Agent 的使用权，且 Agent 已绑定当前 MCP。
       ${m.userScope==='ALL'?'当前对全部 Agent 授权用户开放。':'当前还要求用户位于“指定用户”名单中。'}
     </div>

     <div class="divider"></div>
     <div class="section-title">工具目录摘要</div>
     <div class="mcp-tool-summary">
       ${m.tools.slice(0,4).map(t=>`<div class="mcp-tool-summary-row">
         <div><b class="mono">${t.name}</b><div class="small muted">${t.description}</div></div>
         <div>${mcpEffectTag(t.effect)} ${t.enabled?tag('启用','green'):tag('禁用','gray')}</div>
       </div>`).join('')}
     </div>
     <div class="notice" style="margin-top:16px"><b>工具数说明：</b>表示最近一次 MCP 工具发现成功后的 Tool 数量；V1.4 不做单 Tool 启停，用户范围按 MCP Server 级继承，也不对单个 Tool 再做用户授权。</div>
   </div>`;
 }

 if(tab==='tools'){
   body=`<div class="detail-pane">
     <div class="toolbar" style="padding-left:0;padding-right:0">
       <div><button class="btn" onclick="refreshMcpTools('${m.id}')">↻ 刷新工具目录</button></div>
       <div class="small muted">最近工具发现时间：${m.lastDiscover}</div>
     </div>
     <div class="section-title">工具明细</div>
     <div class="mcp-tool-list">
       <div class="mcp-tool-row mcp-tool-head"><span>工具名称</span><span>描述</span><span>输入参数</span><span>操作类型</span></div>
       ${m.tools.map(t=>`<div class="mcp-tool-row">
         <span class="row-link mono" onclick="openMcpTool('${m.id}','${t.name}')">${t.name}</span>
         <span>${t.description}</span><span class="mono small">${t.input}</span><span>${mcpEffectTag(t.effect)}</span>
       </div>`).join('')}
     </div>
     <div class="notice" style="margin-top:14px">这些 Tool 全部继承 MCP Server 的用户范围。Tool 的 READ/WRITE 类型用于运行时 Policy/Hook/Audit，不作为用户授权。</div>
   </div>`;
 }

 if(tab==='agents'){
   const used=S.agents.filter(a=>a.mcp.includes(m.key));
   body=`<div class="detail-pane">
     <div class="section-title">使用 Agent</div>
     ${used.length?`<div class="simple-agent-list">
       <div class="skill-agent-row skill-agent-head"><span>Agent 名称</span><span>标识</span><span>启用状态</span><span>绑定时间</span><span>操作</span></div>
       ${used.map((a,i)=>`<div class="skill-agent-row">
         <span class="row-link" onclick="openAgent('${a.id}')">${a.name}</span><span class="mono">${a.key}</span><span>${a.enabled?statusTag('ENABLED'):statusTag('DISABLED')}</span><span>${i===0?'2026-09-01 10:00:00':'2026-09-10 15:21:00'}</span><span>-</span>
       </div>`).join('')}
     </div>`:'<div class="empty">没有 Agent 使用当前 MCP</div>'}
     <div class="notice" style="margin-top:14px">这里决定“哪些 Agent 拥有当前 MCP”。用户是否能实际获得这些 Tool，还要与 AgentAccessGrant 和 MCP 用户范围取交集。</div>
   </div>`;
 }

 if(tab==='users'){
   const selected=(m.selectedUsers||[]).map(uid=>S.users.find(u=>u.id===uid)).filter(Boolean);
   body=`<div class="detail-pane">
     <div class="section-title">指定用户</div>
     ${m.userScope==='ALL'
       ? `<div class="notice">当前用户范围为 <b>全部授权用户</b>。所有同时满足“拥有 Agent 权限 + Agent 已绑定当前 MCP”的用户均可使用其工具。</div>`
       : `<div class="toolbar" style="padding-left:0;padding-right:0"><div><button class="btn primary" onclick="openMcpUserPicker('${m.id}')">＋ 添加用户</button></div></div>
          ${selected.length?`<div class="simple-gray-list">
            <div class="gray-row gray-head"><span>姓名</span><span>账号</span><span>授权时间</span><span>操作</span></div>
            ${selected.map((u,i)=>`<div class="gray-row"><span>${u.name}</span><span>${u.account}</span><span>${i===0?'2026-09-17 10:20:10':'2026-09-17 10:23:11'}</span><span><button class="btn ghost" style="color:#b42318" onclick="removeMcpUser('${m.id}','${u.id}')">移除</button></span></div>`).join('')}
          </div>`:'<div class="empty">暂无指定用户；当前 MCP 对任何用户都不可用，直到添加用户。</div>'}`
     }
     <div class="notice" style="margin-top:14px">指定用户授权不会自动授予 AgentAccessGrant，也不会把 MCP 自动绑定到 Agent。</div>
   </div>`;
 }

 const tabsHtml=`<div class="tabs">${tabs.map(t=>`<div class="tab ${tab===t[0]?'active':''}" onclick="openMcp('${m.id}','${t[0]}')">${t[1]}</div>`).join('')}</div>`;
 openDrawer(
   m.name,
   `${m.key} · ${m.tools.length} 个工具`,
   tabsHtml+body,
   `<button class="btn" onclick="testMcp('${m.id}')">连接测试</button>
    <button class="btn" onclick="openMcpUserScope('${m.id}')">变更用户范围</button>
    <button class="btn primary" onclick="refreshMcpTools('${m.id}')">刷新工具目录</button>`
 )
}

      <div class="mcp-info-grid">
        <div class="mcp-field"><span class="mcp-label">工具名称</span><span class="mcp-value mono">${t.name}</span></div>

      <div class="section-title">输入参数</div>

      <div class="notice">${t.effect==='WRITE'
        ? '该工具属于写操作。进入 ToolRegistry 后仍经过统一 Schema 校验、Hook、Policy、Trace 与审计。'
        : '该工具属于只读操作。进入 ToolRegistry 后与内置 Tool 使用相同的 Schema 校验、Hook、Trace 与错误处理。'}

function refreshMcpTools(id){
 const m=S.mcps.find(x=>x.id===id);
 m.connectionStatus='AVAILABLE';m.lastDiscover='2026-09-17 16:01:00';m.updated=m.lastDiscover;
 toast(`已刷新 ${m.tools.length} 个 MCP 工具`);
 if($('#drawer').classList.contains('show'))openMcp(id,'tools')
}

function openPlatformEdit(id){
 const p=S.platforms.find(x=>x.id===id);const adapterOpts=S.platformAdapters.map(x=>`<option value="${x.key}" ${x.key===p.adapterKey?'selected':''}>${x.name}</option>`).join('');
 openModal('编辑项目平台',`<div class="form-grid"><div class="form-item"><label class="req">名称</label><input id="editPlatformName" value="${p.name}"></div><div class="form-item"><label class="req">标识</label><input id="editPlatformKey" value="${p.key}"></div><div class="form-item"><label class="req">接入方式</label><select id="editPlatformResolverType" onchange="renderEditPlatformResolverFields('${p.id}')"><option value="BASE_URL" ${p.resolverType==='BASE_URL'?'selected':''}>Base URL</option><option value="SERVICE_DISCOVERY" ${p.resolverType==='SERVICE_DISCOVERY'?'selected':''}>服务发现</option></select></div><div class="form-item"><label class="req">平台适配器</label><select id="editPlatformAdapter" onchange="renderEditPlatformAdapterFields('${p.id}')">${adapterOpts}</select></div><div id="editPlatformResolverFields" class="form-item full"></div><div class="form-item"><label class="req">凭据策略</label><select id="editCredentialMode"><option value="USER_ONLY" ${p.credentialMode==='USER_ONLY'?'selected':''}>仅用户凭据</option><option value="SHARED_ONLY" ${p.credentialMode==='SHARED_ONLY'?'selected':''}>仅共享凭据</option><option value="USER_THEN_SHARED" ${p.credentialMode==='USER_THEN_SHARED'?'selected':''}>用户优先 / 共享回退</option><option value="NONE" ${p.credentialMode==='NONE'?'selected':''}>无凭据</option></select></div><div class="form-item"><label>启用状态</label><select id="editPlatformEnabled"><option value="true" ${p.enabled?'selected':''}>启用</option><option value="false" ${!p.enabled?'selected':''}>禁用</option></select></div><div id="editAdapterFields" class="form-item full"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePlatformEdit('${id}')">保存</button>`);setTimeout(()=>{renderEditPlatformResolverFields(id);renderEditPlatformAdapterFields(id)},0)
}


function renderEditPlatformResolverFields(platformId){
 const p=S.platforms.find(x=>x.id===platformId),type=$('#editPlatformResolverType')?.value||p.resolverType,host=$('#editPlatformResolverFields');if(!host)return;
 host.innerHTML=type==='SERVICE_DISCOVERY'?`<label class="req">服务名</label><input id="editPlatformServiceName" value="${p.resolverType==='SERVICE_DISCOVERY'?(p.resolverConfig?.serviceName||''):''}" placeholder="例如：customer-service-mgr">`:`<label class="req">Base URL</label><input id="editPlatformBaseUrl" value="${p.resolverType==='BASE_URL'?(p.resolverConfig?.baseUrl||''):''}" placeholder="例如：https://mssw.internal">`
}

function renderEditPlatformAdapterFields(platformId){
 const p=S.platforms.find(x=>x.id===platformId);
 const adapterKey=$('#editPlatformAdapter')?.value||p.adapterKey;
 const a=adapterByKey(adapterKey);
 const host=$('#editAdapterFields'); if(!host||!a)return;

 host.innerHTML=`${adapterKey!==p.adapterKey?'<div class="notice warningbox" style="margin-bottom:12px">更换平台适配器会使该平台已配置的用户/共享凭据失效（INVALID）并清理 PlatformSession；保存后需重新配置凭据。</div>':''}<div class="section-title" style="margin-bottom:8px">平台配置</div>
   <div class="form-grid">
     ${a.configFields.map(f=>{
       const v=(adapterKey===p.adapterKey?p.adapterConfig?.[f.key]:'')??'';
       if(f.type==='select'){
         return `<div class="form-item"><label>${f.label}</label><select id="edit_adapter_${f.key}">${f.options.map(o=>`<option ${String(v)===String(o)?'selected':''}>${o}</option>`).join('')}</select></div>`
       }
       return `<div class="form-item"><label>${f.label}</label><input id="edit_adapter_${f.key}" value="${v}" placeholder="${f.placeholder||''}"></div>`
     }).join('')||'<div class="empty">该适配器无额外配置</div>'}
   </div>
   <div class="help">字段由所选 PlatformAdapter 的平台配置 Schema 动态生成。</div>`
}


function savePlatformEdit(id){
 const p=S.platforms.find(x=>x.id===id),name=$('#editPlatformName').value.trim(),key=$('#editPlatformKey').value.trim(),resolverType=$('#editPlatformResolverType').value,adapterKey=$('#editPlatformAdapter').value,credentialMode=$('#editCredentialMode').value,enabled=$('#editPlatformEnabled').value==='true';
 const resolverConfig=resolverType==='SERVICE_DISCOVERY'?{serviceName:$('#editPlatformServiceName').value.trim()}:{baseUrl:$('#editPlatformBaseUrl').value.trim()};
 if(!name||!key||!Object.values(resolverConfig)[0])return toast('请填写名称、标识和访问配置');if(S.platforms.some(x=>x.id!==id&&x.key===key))return toast('平台标识已存在');
 const a=adapterByKey(adapterKey),cfg={};a.configFields.forEach(f=>cfg[f.key]=$(`#edit_adapter_${f.key}`)?.value||'');
 p.name=name;p.key=key;p.resolverType=resolverType;p.resolverConfig=resolverConfig;p.adapterKey=adapterKey;p.credentialMode=credentialMode;p.enabled=enabled;p.adapterConfig=cfg;p.updated='2026-09-17 16:01:00';closeModal();render();openPlatform(id,'basic');toast('项目平台已更新')
}

function runPlatformTest(platformId){
 const p=S.platforms.find(x=>x.id===platformId),a=adapterByKey(p.adapterKey),user=S.users.find(x=>x.id===$('#platformTestUser').value);
 const c=user?.credentials?.[platformId];
 const credentialOk=p.credentialMode==='NONE'||!!c?.configured||p.credentialMode==='USER_THEN_SHARED'||p.credentialMode==='SHARED_ONLY';

 openModal('调用测试结果',`
   <div class="platform-test-result-row"><span>ProjectPlatform 解析</span>${tag('通过','green')}</div>
   <div class="platform-test-result-row"><span>PlatformAdapter：${a?.name||p.adapterKey}</span>${tag('通过','green')}</div>
   <div class="platform-test-result-row"><span>CredentialRef：${user?.name||'-'}</span>${credentialOk?tag('通过','green'):tag('缺少凭据','red')}</div>
   <div class="platform-test-result-row"><span>Session 获取 / 刷新</span>${credentialOk?tag('通过','green'):tag('未执行','gray')}</div>
   <div class="platform-test-result-row"><span>请求准备</span>${credentialOk?tag('通过','green'):tag('未执行','gray')}</div>
   <div class="platform-test-result-row"><span>业务接口调用</span>${credentialOk?tag('200 成功','green'):tag('未执行','gray')}</div>
   <div class="notice ${credentialOk?'successbox':'warningbox'}" style="margin-top:14px">${credentialOk?'调用链路正常；测试过程中未展示任何 Secret 或 Session 明文。':'当前测试用户没有可用凭据，请先配置用户凭据或共享凭据。'}</div>`,
   `<button class="btn primary" onclick="closeModal()">关闭</button>`
 )
}

function openAgentBasicEdit(id){
 const a=S.agents.find(x=>x.id===id);
 openModal(
   '编辑 Agent 基本信息',
   `<div class="form-grid">
      <div class="form-item">
        <label class="req">名称</label>
        <input id="editAgentName" value="${a.name}">
      </div>
      <div class="form-item">
        <label class="req">标识</label>
        <input id="editAgentKey" value="${a.key}">
      </div>

      <div class="form-item">
        <label class="req">模型</label>
        <select id="editAgentModel">
          ${S.models.filter(m=>m.enabled).map(m=>`<option value="${m.name}" ${m.name===a.model?'selected':''}>${m.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-item">
        <label>状态</label>
        <select id="editAgentEnabled">
          <option value="true" ${a.enabled?'selected':''}>启用</option>
          <option value="false" ${!a.enabled?'selected':''}>禁用</option>
        </select>
      </div>

      <div class="form-item full">
        <label>系统 Prompt</label>
        <textarea id="editAgentPrompt" style="min-height:180px">${a.instructions||''}</textarea>
        <div class="help">系统 Prompt 会作为 Agent 的顶层系统指令参与每次新 Run 的 Prompt 构建。</div>
      </div>

      <div class="form-item full">
        <div class="notice">
          保存后会生成新的 Agent 修订版本。新请求立即使用新配置；
          已经开始的 Run 继续使用原 RuntimeSnapshot；后台 Task 继续使用其冻结的 execution snapshot。
        </div>
      </div>
    </div>`,
   `<button class="btn" onclick="closeModal()">取消</button>
    <button class="btn primary" onclick="saveAgentBasicEdit('${id}')">保存</button>`
 )
}

function saveAgentBasicEdit(id){
 const a=S.agents.find(x=>x.id===id);
 const name=$('#editAgentName').value.trim();
 const key=$('#editAgentKey').value.trim();
 const model=$('#editAgentModel').value;
 const enabled=$('#editAgentEnabled').value==='true';
 const prompt=$('#editAgentPrompt').value.trim();

 if(!name||!key)return toast('请填写名称和标识');
 if(S.agents.some(x=>x.id!==id&&x.key===key))return toast('Agent 标识已存在');

 a.name=name;
 a.key=key;
 a.model=model;
 a.enabled=enabled;
 a.instructions=prompt;
 a.revision=(a.revision||0)+1;
 a.updated='2026-09-17 15:18:00';

 // Keep user display cache in sync for this prototype.
 S.users.forEach(u=>{
   if((u.agentGrants||[]).some(g=>g.agentId===id)){
     u.agents=(u.agentGrants||[]).map(g=>S.agents.find(x=>x.id===g.agentId)?.name).filter(Boolean)
   }
 });

 closeModal();
 render();
 openAgent(id,'basic');
 toast(`Agent 已保存并发布为修订版本 r${a.revision}，新请求立即生效`)
}

function openSkillUserPicker(skillId){
 const s=S.skills.find(x=>x.id===skillId),selected=new Set(s.selectedUsers||[]);
 const users=S.users.filter(u=>!selected.has(u.id));

   users.length?`<div class="form-item"><label>用户</label><select id="skillGrantUser">${users.map(u=>`<option value="${u.id}">${u.name} / ${u.account}</option>`).join('')}</select></div>
   <div class="notice" style="margin-top:14px">此操作只创建 SkillUserGrant，不会授予 Agent 使用权。</div>`:`<div class="empty">没有可添加用户</div>`,
   users.length?`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveSkillUserGrant('${skillId}')">添加</button>`:`<button class="btn primary" onclick="closeModal()">关闭</button>`
 )
}
function saveSkillUserGrant(skillId){
 const s=S.skills.find(x=>x.id===skillId),uid=$('#skillGrantUser').value;
 s.selectedUsers=s.selectedUsers||[];
 if(!s.selectedUsers.includes(uid))s.selectedUsers.push(uid);
 closeModal();openSkill(skillId,'users');toast('指定用户已添加，新 Run/Task 立即生效')
}
function removeSkillUser(skillId,userId){
 const s=S.skills.find(x=>x.id===skillId);
 s.selectedUsers=(s.selectedUsers||[]).filter(id=>id!==userId);
 openSkill(skillId,'users');toast('指定用户已移除，新 Run/Task 不再获得该 Skill')
}

function render(){const f={overview,agents,skills,mcp,models,users,platforms,tasks,schedules,audits}[current];$('#content').innerHTML=f();}
function openModal(title,body,foot,wide=''){ $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot||'';$('#modal').classList.toggle('wide',wide==='wide');$('#modalMask').classList.add('show')}
function closeModal(){$('#modalMask').classList.remove('show')}
$('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal()});
function openDrawer(title,sub,body,actions=''){
  $('#drawerTitle').textContent=title;
  $('#drawerSub').textContent=sub||'';
  $('#drawerBody').innerHTML=body;
  $('#drawerActions').innerHTML=actions||'';
  $('#drawerMask').classList.add('show')
}
function closeDrawer(){$('#drawerMask').classList.remove('show')}
function drawerMaskClose(e){if(e.target.id==='drawerMask')closeDrawer()}
render();
</script>
