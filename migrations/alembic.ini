[alembic]
script_location = migrations
prepend_sys_path = .
# 本文件是 migrations/ 下脚本与 `alembic` 命令的**唯一**连接串来源（**不读环境变量**）。
# 换环境 = 改这里的 sqlalchemy.url，或另存一份 ini 用 `-c <ini>` 指定（如 alembic.prod.ini）。
sqlalchemy.url = postgresql+asyncpg://muad:muad@localhost:5432/muad
# 仅 migrations/bootstrap_db.py 使用：PG 管理员连接串（需 CREATEDB/CREATEROLE），指向维护库
admin_database_url = postgresql://postgres@localhost:5432/postgres
