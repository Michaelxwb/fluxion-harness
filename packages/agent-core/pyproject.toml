[project]
name = "muad-agent-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "muad-contracts",
  "muad-artifact-store",
  "muad-logging",
  "muad-skill-sdk",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  # `tools/pipeline.py` 直接 import；缺声明时本地 venv 因 dev 依赖能跑，
  # prod 镜像（`uv sync --no-dev`）会 ModuleNotFoundError（2026-10-20 真 Pod 复现）。
  "jsonschema>=4,<5",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
muad-contracts = { workspace = true }
muad-artifact-store = { workspace = true }
muad-logging = { workspace = true }
muad-skill-sdk = { workspace = true }
