[project]
name = "muad-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["muad-logging", "pydantic>=2.9", "pydantic-settings>=2.5", "redis>=5,<7"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
muad-logging = { workspace = true }

[tool.setuptools.package-data]
"*" = ["py.typed"]
