[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fluxion-harness"
version = "0.1.0"
description = "Stateless, plugin-oriented agent runtime and control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.2,<4",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "jsonschema>=4.20,<5",
  "mcp>=2,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
  "cryptography>=45,<47",
  "structlog>=24,<26",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp>=1.37,<2",
  "redis>=5.0,<6",
  "dbos>=2.31,<3",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-benchmark>=5,<6",
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
]

[project.scripts]
fluxion = "fluxion.cli.main:app"
fluxion-workflow-worker = "fluxion.cli.workflow_worker:main"
fluxion-capacity = "fluxion.cli.capacity:main"
fluxion-migrate = "fluxion.cli.migrate:main"
fluxion-chaos = "fluxion.cli.chaos:main"
fluxion-dod = "fluxion.cli.dod:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/fluxion"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    # Phase 6（FEAT-P6-01/02/04）：scale / chaos / dod 分组运行标记
    "scale: capacity scale-test（fluxion-capacity verify 等价，FEAT-P6-01）",
    "chaos_runtime: Runtime 组故障注入（FEAT-P6-02）",
    "chaos_workflow: Workflow 组故障注入（FEAT-P6-02）",
    "chaos_storage: Storage 组故障注入（FEAT-P6-02）",
    "dod: Final DoD 14 项验收 verifier（FEAT-P6-04）",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]
