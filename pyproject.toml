[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fluxion-harness"
version = "0.1.0"
description = "Stateless, plugin-oriented agent runtime and control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.2,<4",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
  "cryptography>=45,<47",
  "structlog>=24,<26",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-benchmark>=5,<6",
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
]

[project.scripts]
fluxion = "fluxion.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/fluxion"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]
