[project]
name = "fluxion-harness"
version = "0.3.0"
description = "Project-agnostic Agent + Service Execution framework"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
agent = [
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
]
redis = ["redis>=5,<7"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
  "muad-agent-core",
  "muad-api",
  "muad-artifact-store",
  "muad-common",
  "muad-contracts",
  "muad-logging",
  "muad-platform-sdk",
  "muad-skill-sdk",
  "muad-agent-runtime",
  "muad-agent-worker",
  "muad-console-platform",
  "muad-im-gateway",
  "muad-im-connector",
  "muad-im-core",
]

[tool.uv.sources]
muad-agent-core = { workspace = true }
muad-api = { workspace = true }
muad-artifact-store = { workspace = true }
muad-common = { workspace = true }
muad-contracts = { workspace = true }
muad-logging = { workspace = true }
muad-platform-sdk = { workspace = true }
muad-skill-sdk = { workspace = true }
muad-agent-runtime = { workspace = true }
muad-agent-worker = { workspace = true }
muad-console-platform = { workspace = true }
muad-im-gateway = { workspace = true }
muad-im-connector = { workspace = true }
muad-im-core = { workspace = true }

[tool.uv]
default-groups = []

[tool.uv.workspace]
members = [
  "packages/agent-core",
  "packages/api-kit",
  "packages/artifact-store",
  "packages/common",
  "packages/contracts",
  "packages/logging-kit",
  "packages/platform-sdk",
  "packages/skill-sdk",
  "apps/agent-runtime",
  "apps/agent-worker",
  "apps/im-gateway",
  "apps/im-connector",
  "packages/im-core",
  "apps/console-platform/backend",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 测试分层（DFX FEAT-01）：选择器 `-m unit|contract|integration|e2e` 的注册表。
# 注：既有全量用例未逐条打 marker（14-dfx-acceptance design §2.3 技术债①），
# 因此 `-m <层>` 的选择范围只覆盖已登记 marker 的用例；新增用例须显式标注层级。
markers = [
    "unit: 纯逻辑/状态机，无 IO（不依赖 DB、Redis、网络与真实文件系统）",
    "contract: 契约一致性（错误码/封套/迁移 parity/SSE 解析/词条）",
    "integration: 真实 PG/Redis 或真实进程栈，允许有限外部依赖",
    "e2e: 真实浏览器或跨服务真实链路（Gateway↔Runtime↔Worker↔Browser）",
    "capacity_load: 显式容量压测（200/1000 用户），环境依赖强、耗时长，默认 acceptance 不跑",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["migrations/versions", ".code-flow"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 既有 capacity/迁移测试内嵌长 JS/HTML 字符串或长断言；为满足 110 列而换行会改变字符串内容，
# 故只对这批文件定向豁免 E501（其余规则照常检查）。
"tests/frontend/test_capacity_webchat_*.py" = ["E501"]
"tests/migrations/test_capacity_webchat_*.py" = ["E501"]
"tests/agent_runtime/test_capacity_webchat_upload_staging.py" = ["E501"]
"tests/agent_runtime/test_memory_redesign_admin_api.py" = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true
# tests/ 不在 strict mypy 范围内（muad_* 包未提供 py.typed、测试不做全量注解）；
# migrations/versions/ 为 alembic 自动生成（同 ruff 的 extend-exclude 口径）。
# 该清单与 .code-flow/validation.yml 的 mypy 触发范围保持一致，避免 `mypy .` 恒红。
exclude = ["frontend", "apps/console-platform/frontend", "tests", "migrations/versions"]

# TASK-007 过渡期：Connector 复用 Gateway 的 WeCom adapter surface（TASK-009 会把 adapter
# 移入 Connector）。Gateway 包没有 py.typed，单独检查 Connector 文件时按未类型化模块处理，
# 不因此把过渡期依赖变成类型检查噪音。
[[tool.mypy.overrides]]
module = ["muad_im_gateway.*"]
ignore_missing_imports = true
