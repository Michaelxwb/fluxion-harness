# 本地 1000×1 SSE 诊断 profile（MacBook Pro M5 Pro：15 核 / 48GB，同机 PG/Redis）。
# 用途：产品收口后的主链路回归，不用于生产容量验收；staging E-09 用
# tests/capacity/profiles/agent-capacity-webchat.example.yml（seed 16 模型槽、正式拓扑）。
# 配套：MUAD_NOTIFICATION_TRANSPORT=sse、scripts/capacity/p1_1000_steady.py。
workload:
  users: 1000
  active_runs_per_user: 1
  ramp_sec: 30
  steady_sec: 150
  turns_per_user: 1
  input_distribution:
    think_time_ms:
      p50: 3000
      p95: 15000
      max: 60000
    text_bytes:
      p50: 256
      p95: 4096
      max: 65536
  attachment_distribution:
    ratio: 0.1
    upload_bytes:
      p50: 1048576
      p95: 10485760
      max: 52428800
model:
  mode: CONTROLLED_PROBE
  probe_latency_ms:
    p50: 800
    p95: 2500
    max: 10000
  output_distribution:
    p50: 256
    p95: 1024
    max: 4096
slo:
  admission_p95_ms: 500
  admission_p99_ms: 1500
  framework_first_delta_p95_ms: 1200
  recovery_max_sec: 60
  max_system_error_ratio: 0.01
resources:
  hardware:
    console-platform:
      cpu_request_millicores: 500
      cpu_limit_millicores: 2000
      memory_request_mb: 1024
      memory_limit_mb: 4096
    agent-runtime:
      cpu_request_millicores: 1000
      cpu_limit_millicores: 4000
      memory_request_mb: 2048
      memory_limit_mb: 8192
    agent-worker:
      cpu_request_millicores: 1000
      cpu_limit_millicores: 4000
      memory_request_mb: 2048
      memory_limit_mb: 8192
    im-gateway:
      cpu_request_millicores: 500
      cpu_limit_millicores: 2000
      memory_request_mb: 1024
      memory_limit_mb: 4096
  process_counts:
    console-platform: 4
    agent-runtime: 1
    agent-worker: 1
    im-gateway: 1
  replica_counts:
    console-platform: 1
    agent-runtime: 8
    agent-worker: 4
    im-gateway: 2
  max_replica_counts:
    console-platform: 1
    agent-runtime: 8
    agent-worker: 4
    im-gateway: 2
  pg_connection_budget: 500
  fd_budget: 16384
  storage_budget:
    event_bytes_per_day: 5368709120
    retention_days: 30
    artifact_bytes: 107374182400
